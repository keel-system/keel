default:
  model: relational

entities:

  MeterReading:
    persisted: true
    naturalKey: [meterId, readAt]
    indexes:
      # El barrido nocturno recorre las lecturas de un contador en una ventana de tiempo.
      - [meterId, readAt]

  DailyDigest:
    persisted: true
    naturalKey: [meterId, day]
    indexes:
      - [day]

  MeterDecommission:
    persisted: true

audit:
  # MeterReading declara createdAt en domain: la ingesta lo devuelve al cliente.
  timestamps: declared
  # Nadie pregunta quién registró una lectura: las escribe la ingesta de contadores.
  authorship: none

consistency:
  # Cada operación toca una sola raíz y no hay agregados compuestos: la frontera es
  # la operación, no el agregado.
  transactionalBoundary: per-operation
  # Dos escrituras sobre el mismo resumen diario no pueden pisarse en silencio: 409.
  optimisticLocking: all

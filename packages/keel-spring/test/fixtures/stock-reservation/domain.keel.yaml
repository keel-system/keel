types:
  ReservationStatus:
    description: Estados por los que pasa una reserva de stock.
    # `awaitingStock` es el estado de ESPERA, y es lo que hace que la reconciliación
    # tenga algo que barrer: el encargo se publicó y el desenlace llega por un evento
    # que puede no llegar nunca. Sin un estado así, `reconciledBy` no tendría sentido.
    values: [pending, awaitingStock, confirmed, released]

entities:
  Reservation:
    description: Reserva de stock de un artículo para un pedido.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      orderId:
        type: uuid
        required: true
        unique: true
        description: Pedido al que pertenece la reserva; uno por pedido.
      sku:
        type: string
        required: true
        constraints: { maxLength: 32 }
      quantity:
        type: int
        required: true
        constraints: { min: 1 }
      status:
        type: ReservationStatus
        required: true
        default: pending
      releaseReason:
        type: string
        description: Por qué se liberó la reserva; lo escribe la compensación.
      lastCountedQuantity:
        type: int
        description: >-
          Última cantidad que el almacén dice tener bloqueada para este pedido. La escribe
          `noteStockCount` desde la suscripción, sin mover el estado: un recuento no es un
          desenlace del encargo, es una corrección de lo ya encargado.
      adjustmentCount:
        type: int
        required: true
        default: 0
        description: >-
          Cuántas correcciones de recuento ha recibido la reserva. Es un CONTADOR, y por eso
          `noteStockCount` no es idempotente por naturaleza: aplicarla dos veces se ve. Es lo
          que hace observable la única guarda que le queda a una suscripción sin transición
          de lifecycle — el registro de procesados.
      reserveStockAwaitingSince:
        type: timestamp
        description: >-
          Cuándo entró la reserva en espera del almacén; lo estampa confirmReservation al
          encargar el bloqueo. Es el campo sobre el que consulta el barrido, y tiene que ser
          propio: createdAt dice cuándo nació la reserva (puede confirmarse horas después) y
          un updatedAt rejuvenecería con cualquier otra escritura, dejándola invisible al
          barrido para siempre. El nombre lleva delante la activación que se espera
          (`reserveStock`) porque una entidad puede acabar esperando dos desenlaces a la vez,
          y entonces una marca compartida deja que el segundo encargo pise la del primero.
      createdAt:
        type: timestamp
        generated: true
    lifecycle:
      field: status
      transitions:
        # `released` es terminal y no aparece en ningún `from`: es lo que hace
        # IRREPETIBLE la compensación por construcción — aplicarla dos veces la
        # rechaza el propio agregado, sin depender de ninguna guarda del borde.
        # Y una reserva pendiente no tiene stock encargado todavía: no hay nada que
        # compensar, así que tampoco hay arista pending → released.
        pending: [awaitingStock]
        # Desde la espera se sale por tres sitios, y esa es toda la historia del
        # encargo asíncrono: el almacén confirma (confirmed), el almacén rechaza o el
        # barrido se rinde (released), o no pasa NADA y la reserva se queda aquí —
        # que es justo lo que `reconciledBy` existe para detectar.
        awaitingStock: [confirmed, released]
        confirmed: [released]
        released: []

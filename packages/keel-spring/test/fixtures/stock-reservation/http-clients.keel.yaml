clients:
  inventory:
    purpose: Anular el bloqueo de stock de los encargos que se dieron por perdidos.
    calls:
      cancelStock:
        contract: DELETE /stock/reservations/{orderId} anula el bloqueo y devuelve { cancelled }.
        method: DELETE
        path: /stock/reservations/{orderId}
        request:
          pathParams:
            orderId:
              type: uuid
              required: true
        response:
          fields:
            cancelled:
              type: boolean
              required: true
        timeoutMs: 3000
        # La cara SALIENTE de la idempotencia, y aquí está especialmente bien traída: el
        # barrido cancela un bloqueo que puede no existir, sobre un encargo del que ya no
        # sabemos nada. Con `retry` y sin esto, un timeout de red haría que el almacén
        # recibiera dos cancelaciones — y la segunda podría anular un bloqueo NUEVO del
        # mismo pedido, creado entretanto.
        idempotency:
          keyFrom: payload-hash
        retry:
          maxAttempts: 3
          backoff: exponential
          initialDelayMs: 200
          retryOn: [timeout, connection]
        circuitBreaker:
          failureRateThreshold: 50
          slidingWindowSize: 10
          waitDurationMs: 20000
        fallback: Dejar la reserva liberada de todos modos; el bloqueo huérfano lo resolverá el almacén por su cuenta.

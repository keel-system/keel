findings:
  - flow: FL-EVT-003
    step: "Then 2"
    kind: other
    artifact: domain.Payment.invariants
    evidence: >-
      El Then afirma que getPayment sobre ch-013 responde status failed, o sea, que el cobro se
      registró. Según el YAML, por la suscripción el cobro con un medio de otro titular se registra
      en pending y se le aplica markFailed (rule de requestCharge), y otra rule de requestCharge
      dice, sin excepción, que «con paymentMethodRef queda anotado en savedPaymentMethodId». Así
      ch-013 nacería con payerId cli-2 y savedPaymentMethodId <m1>, cuyo titular es cli-1: justo lo
      que prohíbe el invariante de Payment «si hay savedPaymentMethodId, el payerId de ese medio es
      el payerId del cobro». Pasa lo mismo con el medio que no existe (un savedPaymentMethodId sin
      medio detrás). O la escritura se rechaza y no hay cobro failed ni PaymentFailed, o la
      anotación se omite en esa rama, y nada en el diseño dice cuál de las dos.
    proposal: >-
      Decir en la rule de la rama de la suscripción que, con un medio inexistente o de otro titular,
      savedPaymentMethodId queda vacío, y afirmar en el Then 2 savedPaymentMethodId null; o acotar
      el invariante a los cobros que no están en failed.
    resolution: accepted
    reason: "Aceptado a sabiendas, con el presupuesto de careo agotado: el invariante de Payment (el medio
      guardado es del pagador) manda sobre la rule de anotación, así que en la rama de rechazo por
      evento savedPaymentMethodId no se anota y el cobro nace sin medio. La rule de requestCharge se
      reescribe en la próxima minor para decirlo, igual que se hizo con FL-DSP-001 en el par del
      MVP."
  - flow: FL-REC-002-B
    step: "Then 1"
    kind: carried-state
    artifact: use-cases.sweepPendingPayments.rules
    evidence: >-
      El Then espera que el ciclo del When consulte ch-034 porque está «en capturing desde hace más
      del umbral». Pero el barrido no mira el tiempo en capturing, mira awaitingSince, y según su
      rule cada candidato se reclama «volviendo a estampar awaitingSince». El barrido corre cada 5
      minutos y el umbral es de 900 s, así que un cobro que lleva más de 900 s en capturing ya lo ha
      reclamado y consultado un ciclo anterior (el primero tras cruzar el umbral), que le reestampó
      awaitingSince: en el ciclo del When ya no es candidato y la pasarela no recibe ninguna
      consulta para ch-034 en ese ciclo. El Given, tal como está escrito, no es un estado en el que
      el Then se deduzca.
    proposal: >-
      Escribir el Given en términos de awaitingSince («ch-034 cuyo awaitingSince superó el umbral y
      que ningún ciclo ha reclamado todavía») o afirmar en el Then que la consulta llega en el
      primer ciclo tras cruzar el umbral, en vez de «corre un ciclo».
    resolution: scenario
    sealAfter: 23d73ec15d9c8ba7bdb5b20047c757ec4605cadeeeab1a22d80a87a97d219c60

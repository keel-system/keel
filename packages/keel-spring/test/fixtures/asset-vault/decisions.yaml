# Obligaciones de diseño que esta fixture deja abiertas a sabiendas.
# Ver docs/design-obligations.md — el «aceptado» del análisis de huecos, por escrito.
decisions:
  - id: OBL-IDEM-RACE-CODE
    scope: use-cases
    reason: >
      El contrato público de uploadAsset para la carrera de la clave es el canónico
      409 IDEMPOTENCY_KEY_IN_PROGRESS. No hay un code de dominio que lo describa mejor.
    since: 1.0.0
  - id: OBL-IDEM-REUSE-CODE
    scope: use-cases
    reason: >
      Misma clave con otro cuerpo devuelve el canónico 409 IDEMPOTENCY_KEY_REUSED.
      El bucket no distingue ese caso de ningún otro conflicto de negocio.
    since: 1.0.0
  - id: OBL-CALLER-IDENTITY
    scope: security
    reason: >
      Quien llama no participa en el trabajo. El único cliente máquina declarado
      (rendering-service) solo LEE: no sube ni publica nada, así que no hay campo que el
      servidor deba estampar desde su credencial. El ownerId de uploadAsset es un dato de
      negocio —de quién es el archivo—, no la identidad de quien hace la petición, y
      confundirlos habría atado la propiedad del activo a la credencial que lo subió.
    since: 1.0.0

coverage:
  - gapClass: 4
    units: [uploadAsset]
    result: findings

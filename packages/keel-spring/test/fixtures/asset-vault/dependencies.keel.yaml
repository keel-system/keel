# Las dos mitades de la capa, con la superficie mínima: se LEE un dato ajeno (need
# on-demand) y se PIDE trabajo (activación con onFailure: fail). Sin réplica: eso ya
# lo prueba `catalog-extended`, y aquí solo alargaría la corrida.
dependencies:
  rendering:
    description: Servicio de renderizado, dueño de las miniaturas de los archivos custodiados.
    needs:
      thumbnail:
        description: Miniatura que acompaña a la ficha del archivo.
        strategy: on-demand
        usedBy: [getAsset]
        fetchedFrom:
          client: rendering
          call: getThumbnail
    activations:
      # La ACTIVACIÓN DE VUELTA de la compensación. Sin ella, poner el archivo en
      # cuarentena solo devuelve el estado propio y el renderizador sigue sirviendo la
      # miniatura de un binario infectado: deshacer a medias deja al proveedor y a
      # nosotros contando historias distintas. Es también lo que hace exigente la familia
      # `compensation` del gate — con este `via.client`, el handler de `quarantineAsset`
      # tiene que llegar al proveedor y no basta con mover el estado.
      purgeThumbnail:
        description: Retirada de la miniatura del archivo que pasó a cuarentena.
        triggeredBy: [quarantineAsset]
        via:
          client: rendering
          call: purgeThumbnail
        effect: La miniatura del archivo deja de estar publicada en el renderizador.
        # Ignorar y seguir: la cuarentena es lo que protege, y no se puede quedar sin
        # aplicar porque el renderizador no responda. Lo que queda es una miniatura
        # huérfana del lado ajeno, que es un coste menor que un archivo infectado
        # publicado.
        onFailure:
          action: ignore

  security-scanner:
    description: Escáner antimalware, obligatorio antes de publicar un archivo.
    activations:
      scanAsset:
        description: Análisis del binario antes de darlo por publicable.
        # El barrido vuelve a pedir el análisis: preguntar otra vez «¿este binario es
        # seguro?» no tiene efecto acumulable —a diferencia de reencargar un bloqueo de
        # stock, que reservaría dos veces—, así que reintentar el encargo es aquí la
        # salida natural. Es lo que enlaza el barrido con lo que reconcilia.
        triggeredBy: [publishAsset, reconcileScans]
        via:
          client: scanner
          call: scanAsset
        effect: El binario queda analizado y con veredicto del escáner.
        awaits: outcome
        # Sin esto, la compensación de abajo solo existe si el escáner se acuerda de
        # publicar su hallazgo. Cuando no lo hace, nada lo detecta.
        reconciledBy: reconcileScans
        onFailure:
          action: fail
          error: SCANNER_UNAVAILABLE
    compensations:
      - onEvent: MalwareDetected
        undoes: scanAsset
        description: El escáner marcó el archivo como infectado después de publicarlo; pasa a cuarentena.

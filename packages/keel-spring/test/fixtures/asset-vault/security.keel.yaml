# La capa que `audit.authorship: all` exige: sin principal autenticado no hay autor
# que estampar en @CreatedBy/@LastModifiedBy.
authentication:
  protocol: oidc
  tokenLocation: header
  serviceAuth:
    protocol: client-credentials
    description: El servicio de renderizado consulta fichas para generar sus miniaturas.
    # La única fixture que lo declara, y por eso la única que compila el filtro de audiencia,
    # su cableado en la cadena de seguridad, los dos clientes de prueba que aprovisiona
    # (test-m2m-bad-aud y test-m2m-none) y la variante propia de Cognito, que mira el scope en
    # vez del claim `aud`. Sin esto, todo ese Java se generaba a ciegas.
    #
    # Y es una decisión de diseño, no de relleno: este servicio convive con otros que comparten
    # servidor de autenticación, así que sin validar la audiencia un token emitido PARA OTRO
    # valdría aquí con solo tener el scope.
    validateAudience: true
    # Declarada a propósito en vez de dejarla al default (el artifactId): así se compila también
    # la rama en la que el identificador NO coincide con el nombre del servicio, que es la que
    # tiene un servicio publicado con otro nombre ante el proveedor.
    audience: asset-vault-api
  # Alcance por recurso. Es la única fixture que lo declara, y por eso la única que compila
  # el mapper de Keycloak, el atributo por usuario de init-keycloak.sh, su gemelo del
  # realm-export.json de deploy/ y el scopedResource() del arnés: hasta ahora esos veintitrés
  # sitios del generador solo los miraban asserts de cadenas sobre modelos parcheados.
  #
  # Roles y permisos son GLOBALES: `vault-reader` alcanza a todos los archivos custodiados de
  # todos los propietarios. Lo que acota al propietario concreto es este claim, y sin
  # declararlo el 403 del contrato no lo produce nada.
  scoping:
    claim: vaults
    over: Owner.code
    error: ASSET_OUT_OF_SCOPE
    # La exención va rol a rol porque es la parte peligrosa: quien la tiene ve todo.
    exemptRoles: [vault-admin]
    description: Cada custodio opera sobre los archivos de los propietarios que su token enumera.

roles:
  vault-admin:
    description: Custodia archivos y decide qué se publica.
  vault-reader:
    description: Solo consulta los archivos custodiados.

permissions:
  asset:write:
    description: Custodiar archivos y publicarlos.
  asset:read:
    description: Consultar los archivos custodiados.

roleGrants:
  vault-admin: [asset:write, asset:read]
  vault-reader: [asset:read]

serviceClients:
  rendering-service:
    description: Genera las miniaturas de los archivos publicados.
    scopes: [asset:read]

cors:
  # La única fixture que declara política CORS, y por eso la única que renderiza los
  # helpers `preflight`/`exchangeWithHeaders` del arnés: sin ella ese Java no lo compila
  # ni lo tokeniza ningún test, que es justo cómo se cuela un template literal mal cerrado.
  description: El back-office del vault es una SPA de otro origen y sube archivos desde el navegador.
  # `false` porque el token viaja en Authorization y no en cookie; con `cookie` el schema
  # de keel-core exigiría `true`.
  allowCredentials: false
  allowedHeaders: [Authorization, Content-Type, Idempotency-Key]
  exposedHeaders: [X-Correlation-Id]

access:
  default: { level: required }
  rules:
    uploadAsset: { level: required, permissions: [asset:write] }
    publishAsset: { level: required, permissions: [asset:write] }
    getAsset: { level: required, permissions: [asset:read], scopes: [asset:read] }
    listAssets: { level: required, permissions: [asset:read] }

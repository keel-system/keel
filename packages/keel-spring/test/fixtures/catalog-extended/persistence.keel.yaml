default:
  model: relational
entities:
  Product:
    naturalKey: [sku]
    indexes:
      - [status]
      # El predicado del barrido `reconcileWithdrawals`: estado + cuánto lleva esperando la
      # inscripción. Compuesto y en este orden —igualdad primero, rango después—, que es lo
      # único que un B-tree aprovecha entero; con el de `status` a solas la base filtra por
      # estado y evalúa la marca fila a fila, cada minuto y en cada réplica.
      - [status, recordWithdrawalAwaitingSince]
      # Índice sobre una relación: la columna real es category_id, no category.
      - [category, status]
  Category:
    naturalKey: [slug]
  SupplierPrice:
    # Clave con la que el proveedor identifica el recurso: es la clave natural de
    # la copia, y lo que garantiza el finder por sku del repositorio.
    naturalKey: [sku]
  ProductImage:
    indexes:
      # Índice sobre una relación y sobre un campo que es palabra reservada.
      - [product, position, primary]
audit:
  # Product y Category declaran createdAt en domain porque su ficha lo devuelve:
  # la auditoría de tiempos es parte del contrato, no solo de la tabla.
  timestamps: declared

consistency:
  transactionalBoundary: per-operation

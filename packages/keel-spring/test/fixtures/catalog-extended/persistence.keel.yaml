default:
  model: relational
entities:
  Product:
    naturalKey: [sku]
    indexes:
      - [status]
      # Índice sobre una relación: la columna real es category_id, no category.
      - [category, status]
  Category:
    naturalKey: [slug]
  ProductImage:
    indexes:
      # Índice sobre una relación y sobre un campo que es palabra reservada.
      - [product, position, primary]
audit:
  # Product y Category declaran createdAt en domain porque su ficha lo devuelve:
  # la auditoría de tiempos es parte del contrato, no solo de la tabla.
  timestamps: declared

consistency:
  transactionalBoundary: per-operation

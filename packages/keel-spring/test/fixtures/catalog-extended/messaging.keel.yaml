publishing:
  reliability: outbox
  events:
    ProductCreated:
      description: Se publicó un producto nuevo en el catálogo.
      payload:
        productId:
          type: uuid
          required: true
        sku:
          type: string
          required: true
        occurredAt:
          type: timestamp
          required: true
    ProductUpdated:
      description: Cambió el estado o los datos de un producto.
      payload:
        productId:
          type: uuid
          required: true
        status:
          type: ProductStatus
          required: true

subscriptions:
  # Alimenta la copia local del precio de proveedor (dependencies: pricing.supplierPrice).
  SupplierPriceChanged:
    description: El servicio de precios cambió el precio de proveedor de un producto.
    source: pricing
    payload:
      sku:        { type: string, required: true }
      amount:     { type: decimal, required: true, constraints: { scale: 2 } }
      currency:   { type: string, required: true }
      occurredAt: { type: timestamp, required: true }
    triggers: projectSupplierPrice

  # Compensación: deshace a posteriori el trabajo que se delegó en compliance.
  WithdrawalRejected:
    description: El registro regulatorio rechazó una retirada ya inscrita.
    source: compliance
    payload:
      productId: { type: uuid, required: true }
      reason:    { type: string, required: true }
    triggers: reactivateWithdrawnProduct
    # Una compensación puede llegar antes del hecho que compensa: entre que se confirma
    # la retirada y que compliance publica su rechazo no hay orden garantizado. Los
    # reintentos absorben esa carrera solos; la DLQ es la red por si no se resuelve.
    onFailure:
      retry: { maxAttempts: 5, backoff: exponential, initialDelayMs: 500, maxDelayMs: 30000 }
      deadLetter: true

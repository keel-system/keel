operations:
  createProduct:
    description: Da de alta un producto en estado draft dentro de una categoría.
    kind: command
    input:
      entity: Product
    output:
      entity: Product
    errors:
      - code: SKU_ALREADY_EXISTS
        when: Ya existe un producto con ese sku.
        http: 409
      - code: CATEGORY_NOT_FOUND
        when: La categoría referenciada no existe.
        http: 422
      # Los dos desenlaces del mecanismo de idempotencia, NOMBRADOS por el diseño. Esta
      # fixture cubre el camino del override —el generador usa estos codes en vez de los
      # canónicos de framework-errors.md—; `stock-reservation` se queda sin declararlos y
      # cubre el otro, que es el que recorrieron las tres corridas del pipeline.
      - code: PRODUCT_KEY_IN_PROGRESS
        when: Otra petición con la misma clave de idempotencia está en curso.
        http: 409
      - code: PRODUCT_KEY_REUSED
        when: La misma clave de idempotencia llegó con un contenido distinto.
        http: 409
    emits: [ProductCreated]
    idempotency:
      keySource: client-key
      ttlSeconds: 86400

  getProductBySlug:
    description: Recupera un producto público por el slug de su categoría.
    kind: query
    input:
      fields:
        slug:
          type: string
          required: true
    output:
      entity: Product
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese slug.
        http: 404
      - code: PRICE_UNAVAILABLE
        when: El servicio de precios no responde y el último precio conocido ya es demasiado viejo para servirlo.
        http: 503
    cache:
      ttlSeconds: 300
      keyFields: [slug]
      invalidatedBy: [ProductUpdated]

  updateProduct:
    description: Actualiza parcialmente los datos comerciales de un producto.
    kind: command
    input:
      fields:
        id:
          type: uuid
          required: true
        name:
          type: string
          constraints: { maxLength: 200 }
        categoryId:
          type: uuid
        expectedVersion:
          type: long
    output:
      entity: Product
      embed: [category]
    rules:
      - Un campo ausente de la entrada conserva su valor; un campo presente con valor nulo vacía el campo.
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404
    emits: [ProductUpdated]

  listProducts:
    description: Lista los productos del catálogo de forma paginada.
    kind: query
    input: "void"
    output:
      entity: Product
      paginated: true

  getProductsByIds:
    description: Recupera en lote los productos indicados por sus identificadores.
    kind: query
    input:
      fields:
        ids:
          type: uuid
          list: true
          required: true
    output:
      entity: Product
      list: true

  retireProduct:
    description: Retira un producto del catálogo de forma definitiva.
    kind: command
    input:
      fields:
        id:
          type: uuid
          required: true
    output:
      entity: Product
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404
      - code: COMPLIANCE_UNAVAILABLE
        when: El registro regulatorio no responde y la retirada no puede darse por inscrita.
        http: 502
      # El rechazo de la transición inválida. Sin declararlo, el guard del agregado
      # rechaza igual —eso no depende del contrato— pero el cliente recibe un código
      # que el diseño no conoce, y ningún escenario puede afirmar sobre él: era el
      # hueco que dejaba FL-PRD-004-D sin ejercitar.
      - code: PRODUCT_NOT_RETIRABLE
        when: El producto no está en un estado desde el que pueda retirarse (ya está retirado).
        http: 409
    emits: [ProductUpdated]
    transitions:
      - entity: Product
        from: [draft, active]
        to: retired

  addProductImage:
    description: Añade una imagen al producto subiendo el archivo binario.
    kind: command
    input:
      fields:
        productId:
          type: uuid
          required: true
        image:
          type: file
          required: true
          bucket: productImages
        position:
          type: int
          required: true
    # Devuelve el AGREGADO, no la imagen creada: es la silueta de "añadir X a la
    # colección de Y", donde el 201 y el id de la respuesta hablan de cosas
    # distintas. Fija la regla de Location del caso sub-recurso → padre.
    output:
      entity: Product
      embed: [category]
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404

  removeProductImage:
    description: Elimina una imagen concreta de un producto del catálogo.
    kind: command
    input:
      fields:
        productId:
          type: uuid
          required: true
        imageId:
          type: uuid
          required: true
    output: "void"
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404
      - code: CATEGORY_NOT_FOUND
        when: La categoría del producto ya no existe.
        http: 404
    # El otro origen de clave: aquí el cliente no genera ningún identificador de intento
    # —borra una imagen concreta—, pero el mismo par (producto, imagen) es la misma
    # intención. Es el caso que distingue `payload-hash` de `client-key`: no hay cabecera
    # que pueda faltar, así que no hay camino "sin clave".
    idempotency:
      keySource: payload-hash
      ttlSeconds: 600

  # Operaciones de proyección: sin trigger externo, las dispara la suscripción al
  # evento del proveedor. La copia solo se escribe por aquí.
  projectSupplierPrice:
    description: Aplica a la copia local el precio de proveedor que informa el servicio de precios.
    kind: command
    internal: true
    input:
      fields:
        sku:
          type: string
          required: true
        amount:
          type: decimal
          required: true
        currency:
          type: string
          required: true
        occurredAt:
          type: timestamp
          required: true
    output: "void"

  # La pata del SILENCIO de la compensación: si el registro regulatorio nunca
  # publica su rechazo —cae, pierde el mensaje, o ni sabe que hay que deshacerlo—
  # no llega ningún evento y el producto se queda retirado para siempre. Lo que no
  # pasa solo lo detecta un barrido, y por eso esta operación la dispara el reloj.
  reconcileWithdrawals:
    description: Revisa las retiradas inscritas que siguen sin desenlace del registro regulatorio.
    kind: command
    internal: true
    input: "void"
    output: "void"
    schedule:
      cron: "0 * * * *"

  reactivateWithdrawnProduct:
    description: Devuelve a activo un producto cuya retirada rechazó el registro regulatorio.
    kind: command
    internal: true
    input:
      fields:
        productId:
          type: uuid
          required: true
        reason:
          type: string
          required: true
    output: "void"
    # La transición de vuelta de la compensación, y a la vez lo que impide aplicarla dos
    # veces: 'active' no está entre sus orígenes, así que la reentrega del evento la
    # rechaza el guard en vez de reactivar dos veces.
    transitions:
      - entity: Product
        from: [retired]
        to: active
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404

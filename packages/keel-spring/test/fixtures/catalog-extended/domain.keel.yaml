types:
  ProductStatus:
    description: Estados de publicación de un producto.
    values: [draft, active, retired]

  # Value type con formato: describe el sku YA normalizado (el diseño lo pasa a
  # mayúsculas antes de validar unicidad). Replicarlo como @Pattern en el DTO de
  # entrada rechaza el valor crudo antes de que el handler normalice nada.
  SKU:
    description: Referencia comercial única del producto.
    base: string
    constraints: { pattern: "^[A-Z0-9][A-Z0-9-]{3,19}$" }

entities:
  Category:
    description: Categoría del catálogo, raíz de su propio agregado.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      slug:
        type: string
        required: true
        unique: true
      name:
        type: string
        required: true
      createdAt:
        type: timestamp
        generated: true
      # La marca de espera del barrido `reconcileWithdrawals`, declarada en
      # `dependencies.compliance.activations.recordWithdrawal.awaitingSince`. Tiene que ser
      # propia: `createdAt` es cuándo nació el producto —puede retirarse meses después— y
      # `version` no es tiempo. La estampa `retireProduct` al encargar la inscripción, y no
      # la toca nadie más; es un marcador operativo, así que sale de las respuestas con
      # `exclude`.
      recordWithdrawalAwaitingSince:
        type: timestamp
        description: >-
          Cuándo se encargó al registro regulatorio la inscripción de la retirada, y desde
          cuándo cuenta el silencio que el barrido tolera.
    relations:
      parent:
        entity: Category
        cardinality: many-to-one
        description: Categoría padre, si la hay.

  Product:
    description: Producto publicable del catálogo.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      sku:
        type: SKU
        required: true
        unique: true
      name:
        type: string
        required: true
      status:
        type: ProductStatus
        required: true
        default: draft
      version:
        type: long
        generated: true
        description: Contador de cambios del producto declarado por el diseño; lo incrementa el dominio y viaja en la API y en los eventos.
      createdAt:
        type: timestamp
        generated: true
      # La marca de espera del barrido `reconcileWithdrawals`, declarada en
      # `dependencies.compliance.activations.recordWithdrawal.awaitingSince`. Tiene que ser
      # propia: `createdAt` es cuándo nació el producto —puede retirarse meses después— y
      # `version` no es tiempo. La estampa `retireProduct` al encargar la inscripción, y no
      # la toca nadie más; es un marcador operativo, así que sale de las respuestas con
      # `exclude`.
      recordWithdrawalAwaitingSince:
        type: timestamp
        description: >-
          Cuándo se encargó al registro regulatorio la inscripción de la retirada, y desde
          cuándo cuenta el silencio que el barrido tolera.
    relations:
      category:
        entity: Category
        cardinality: many-to-one
        required: true
        description: Categoría a la que pertenece el producto.
      images:
        entity: ProductImage
        cardinality: one-to-many
        description: Imágenes del producto.
    lifecycle:
      field: status
      transitions:
        draft: [active, retired]
        active: [retired]
        # No es terminal: el registro regulatorio puede rechazar la retirada a posteriori,
        # y esa es la arista por la que vuelve la compensación de `compliance`.
        retired: [active]

  ProductImage:
    description: Imagen de un producto, entidad interna de su agregado.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      storageKey:
        type: file
        required: true
        bucket: productImages
      position:
        type: int
        required: true
      primary:
        type: boolean
        default: false
        description: Nombre de campo que es palabra reservada SQL; sin quoting el DDL no compila.
    relations:
      product:
        entity: Product
        cardinality: many-to-one
        required: true
        description: Producto al que pertenece la imagen.

  # Copia local de un dato ajeno (dependencies: pricing.supplierPrice). NO es
  # fuente de verdad: sus invariantes las garantiza el servicio de precios, y
  # aquí solo se mantiene al día con sus eventos.
  SupplierPrice:
    description: Precio de proveedor de un producto, propiedad del servicio de precios.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      sku:
        type: string
        required: true
        unique: true
      amount:
        type: decimal
        required: true
        constraints: { min: 0, scale: 2 }
      currency:
        type: string
        required: true
      occurredAt:
        type: timestamp
        required: true
        description: Instante del cambio en el origen; ordena las reentregas para que un hecho viejo no pise a uno nuevo.

aggregates:
  Catalog:
    root: Product
    entities: [ProductImage]

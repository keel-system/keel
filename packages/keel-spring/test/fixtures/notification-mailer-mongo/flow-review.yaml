findings:
  - flow: FL-TPL-011
    step: "Then 1"
    kind: other
    artifact: use-cases.publishTemplate.errors
    evidence: >-
      El Then (a) dice que el perdedor recibe 409 CONCURRENT_MODIFICATION o TEMPLATE_ALREADY_ACTIVE,
      y que «cuál de los dos depende de qué escritura del perdedor llegue antes a la base». Esa
      explicación es la del modelo relacional: allí el perdedor espera el bloqueo de fila de <t1> y
      después falla el control de versión (CONCURRENT_MODIFICATION) o el índice parcial
      (TEMPLATE_ALREADY_ACTIVE). Con `default.model: document` y `consistency.transactionalBoundary:
      per-operation`, publishTemplate es una transacción multidocumento (retirar <t1> y activar
      <t2>/<t3>), y en ese motor dos transacciones que escriben el mismo documento, o la misma
      entrada de un índice único con escrituras sin confirmar, no esperan: el perdedor aborta al
      momento con un conflicto de escritura del motor (transitorio). Ese conflicto no lo produce ni
      el control de versión que declara `optimisticLocking: all` (la versión que leyó el perdedor
      coincide en su instantánea) ni el índice parcial, que son los dos mecanismos a los que el
      diseño ata los dos codes. Nada en el diseño dice qué code sale de ese tercer camino, así que
      el 409 con uno de los dos codes no se deduce en esta gemela: sale un 5xx si nadie lo traduce,
      o el desenlace (b) si alguien lo reintenta.
    proposal: >-
      En el diseño: ampliar el `when` de CONCURRENT_MODIFICATION para que cubra cualquier conflicto
      de escritura concurrente sobre la misma plantilla, venga del control de versión o del motor,
      lo que fija el code en las dos gemelas. En el escenario (que tiene que valer igual para las
      dos): quitar la explicación de «qué escritura llega antes», que solo es verdad en relacional,
      y dejar la disyunción de codes.
    resolution: accepted
    reason: "El diseño declara el conflicto (409 CONCURRENT_MODIFICATION y la unicidad con su code), y el
      escenario afirma ese contrato. Con el modelo documental y una transacción por operación, el
      perdedor recibe del motor un write conflict transitorio (error 112, TransientTransactionError)
      que ni el bloqueo optimista ni el índice traducen solos. Traducirlo al 409 declarado, o
      reintentar la transacción, es del generador: hoy ningún handler de keel-spring lo trata, y
      queda anotado como hallazgo del método. Un servidor que responda 500 falla este escenario, que
      es lo que tiene que pasar."
  - flow: FL-TPL-003
    step: "Then 1"
    kind: other
    artifact: use-cases.registerTemplate.errors.TEMPLATE_VERSION_ALREADY_EXISTS
    evidence: >-
      El Then admite que el segundo registro simultáneo responda 409
      TEMPLATE_VERSION_ALREADY_EXISTS, que el diseño ata a la `naturalKey` [application, key,
      locale, version] de Template. En el modelo documental, con la transacción por operación, la
      segunda inserción que choca con la entrada del índice único que la primera aún no ha
      confirmado no recibe una violación de clave duplicada sino el mismo conflicto de escritura
      transitorio que en FL-TPL-011. Solo es clave duplicada si la primera ya confirmó. Nada en el
      diseño asigna un code a ese conflicto, así que el 409 con TEMPLATE_VERSION_ALREADY_EXISTS solo
      se deduce en parte de las carreras. Es la misma causa que el hallazgo de FL-TPL-011, en la
      unicidad no condicionada.
    proposal: >-
      En el diseño: que el `when` de TEMPLATE_VERSION_ALREADY_EXISTS («otra petición registró esa
      misma versión a la vez») cubra también el conflicto del motor sobre esa misma clave. O
      aceptarlo a sabiendas y hacerlo junto con FL-TPL-011, porque la decisión es la misma.
    resolution: accepted
    reason: "El diseño declara el conflicto (409 CONCURRENT_MODIFICATION y la unicidad con su code), y el
      escenario afirma ese contrato. Con el modelo documental y una transacción por operación, el
      perdedor recibe del motor un write conflict transitorio (error 112, TransientTransactionError)
      que ni el bloqueo optimista ni el índice traducen solos. Traducirlo al 409 declarado, o
      reintentar la transacción, es del generador: hoy ningún handler de keel-spring lo trata, y
      queda anotado como hallazgo del método. Un servidor que responda 500 falla este escenario, que
      es lo que tiene que pasar."
  - flow: FL-TPL-001
    step: "Casos borde 1"
    kind: other
    artifact: domain.entities.Template.relations.variables
    evidence: >-
      El caso borde dice «Sin `variables` → `201` con `variables: []`». El diseño declara
      `conventions.nulls: include` («un campo sin valor viaja como null»), y el propio documento de
      escenarios lo repite. Nada fija que una relación one-to-many sin hijas sea una lista vacía y
      no un campo sin valor. En relacional la diferencia no se ve: las hijas son otra tabla y la
      colección sale de una consulta, que sin filas da []. En la gemela documental TemplateVariable
      va anidada en el documento de Template, así que `variables` es un campo de ese documento, y
      una petición que lo omite puede guardarlo ausente o nulo, y proyectarlo como `variables: null`
      cumpliendo la convención al pie de la letra.
    proposal: >-
      En el escenario: añadir a las Convenciones de determinación que una colección (relación o
      `list: true`) sin elementos viaja como `[]` y nunca como null, si eso es lo que se quiere. O
      fijarlo en el diseño, junto a `conventions.nulls`. Las dos opciones cubren también
      `copyRecipients` y `variables` de Notification.
    resolution: accepted
    reason: "Una lista sin elementos es un valor, no una ausencia: conventions.nulls rige la ausencia de
      los escalares, y el caso borde afirma []. Que el mapeo documental rehidrate un array ausente
      como [] y no como null es del generador. Si devuelve null, este escenario falla, que es lo que
      se busca. El DSL no tiene dónde declarar la forma de una colección vacía, y queda anotado como
      hallazgo del método."

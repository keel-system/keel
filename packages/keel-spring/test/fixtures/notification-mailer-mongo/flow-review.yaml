findings:
  - flow: FL-TPL-003
    step: "Then 1"
    kind: other
    artifact: use-cases.registerTemplate.errors
    evidence: >-
      El Then dice que «los desenlaces admisibles son exactamente dos»: 201/201 con versiones 1 y 2,
      o 201 y 409 TEMPLATE_VERSION_ALREADY_EXISTS. Con `default.model: document` y la transacción
      por operación, la segunda inserción que choca con la entrada del índice único de la
      `naturalKey` [application, key, locale, version] que la primera aún no ha confirmado recibe un
      conflicto de escritura transitorio; la transacción se reintenta y el perdedor acaba en uno de
      los dos desenlaces del Then, salvo que se agoten los reintentos, y entonces responde 409
      CONCURRENT_MODIFICATION. registerTemplate no declara ese code y el Then no lo admite, así que
      el «exactamente dos» no se deduce en esta gemela: hay un tercer desenlace posible, aunque sea
      improbable con solo dos peticiones. En FL-TPL-011 el mismo tercer camino sí cabe, porque su
      Then ya admite CONCURRENT_MODIFICATION.
    proposal: >-
      En el escenario, que vale igual para las dos gemelas: admitir también 409
      CONCURRENT_MODIFICATION para el perdedor (en relacional no aparece nunca, así que no estorba),
      manteniendo el Then 2 como la aserción que importa. O en el diseño: declarar
      CONCURRENT_MODIFICATION en registerTemplate. O aceptarlo a sabiendas, porque con dos
      contendientes el reintento del perdedor no debería agotarse.
    resolution: accepted
    reason: "Aceptado: el tercer desenlace existe solo si la transacción perdedora agota sus tres
      reintentos contra el conflicto transitorio del modelo documental, y con dos peticiones
      simultáneas la segunda pasa en el primer reintento sobre lo ya confirmado, con el error
      declarado (MONGO-10 lo mide contra un mongod real). Si llegara a pasar, saldría como 409
      CONCURRENT_MODIFICATION, el code de framework. El escenario es común a las dos gemelas y no
      nombra motores."
  - flow: FL-DSP-001
    step: "Then 3"
    kind: unobservable
    artifact: domain.entities.Notification.lifecycle
    evidence: >-
      El Then dice «Un segundo ciclo del barrido no lo vuelve a intentar: failed es terminal». El
      YAML ya lo garantiza por construcción: failed no tiene transiciones de salida en el lifecycle
      de Notification y queueAcceptedNotifications solo reclama filas en accepted. Pero como prueba
      de caja negra no discrimina nada: el Given deja el relay rechazando con un 550 y las notas
      dicen que ese rechazo es global mientras está activo, y ningún paso lo levanta antes del
      segundo ciclo. Un reintento sería rechazado igual, no llegaría nada al buzón y el estado
      seguiría en failed (la transición de vuelta no existe), así que el Then pasa tanto si se
      reintenta como si no.
    proposal: >-
      En el escenario: devolver el relay a su comportamiento normal antes del segundo ciclo y
      afirmar que, pasado ese ciclo, el buzón no tiene ningún correo para rebota@cliente.example y
      el envío sigue en failed. O reducir el Then a lo que se observa («sigue en failed tras otro
      ciclo») y dejar el «no se reintenta» a la terminalidad del lifecycle.
    resolution: accepted
    reason: >-
      Cierto, y sin presupuesto de careo en la v2.0.x: reescribir el Then ahora dejaría el careo
      caducado y agotado. Se decide la prueba, no el escenario: antes del segundo ciclo el agente de
      pruebas llama a relayAccepts(), y entonces «no lo vuelve a intentar» sí es observable (el buzón
      sigue sin correo para rebota@cliente.example y el envío sigue en failed con el mismo
      sendingSince). Reescribir el Given/Then en ese sentido queda para la próxima minor.

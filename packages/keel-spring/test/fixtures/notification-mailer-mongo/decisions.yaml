# Lo que este diseño decidió y por qué. Es la fixture del par del MVP y está CERRADA:
# `keel validate --ready` sale en verde (lo fija test/mvp-ready.test.js). Dos secciones:
# `decisions` son las obligaciones y avisos que se dejan abiertos a sabiendas, con su motivo;
# `structural` es el registro de las decisiones del catálogo § 3 que sí se escribieron en el DSL.
decisions:
  - id: OBL-GUARD-UNOBSERVABLE
    scope: mail.sendAcceptedNotification
    reason: >-
      Aceptada a sabiendas y MEDIDA. sendAcceptedNotification no tiene puerta propia a
      propósito: separar «registrar la petición» de «mandar el correo» es lo que le da a la
      guarda un estado intermedio donde apoyarse, y darle un endpoint expondría un efecto
      irreversible a cualquiera que sepa el id. La consecuencia se comprobó rompiendo el
      mecanismo en la corrida notification-mailer-mongo: con la guarda rota la suite entera
      sigue en verde, porque quien impide el segundo envío en caja negra es el reclamo de lote
      de queueAcceptedNotifications; rompiendo ese, tres correos al mismo destinatario. Lo que
      la guarda sostiene —la caída entre el correo aceptado por el relay y el commit de la
      transición— no lo puede provocar ningún arnés de caja negra, así que su verificación es
      estática: infra/check-idempotency.sh, familia mailDelivery, que exige la llamada al
      reclamo ANTES del envío. Queda dicho en validation-scenarios.md, para que el contrato no
      prometa medir lo que no mide.
    since: 1.0.0
  - id: OBL-IDEM-KEY-REQUIRED
    scope: use-cases
    reason: La cabecera es opcional para los integradores actuales; sin ella la peticion se ejecuta sin deduplicar y se acepta a sabiendas.
    since: 1.0.0
  - id: CHK-PERSIST-BOUNDARY-DEFAULT
    scope: persistence.consistency.transactionalBoundary
    reason: >-
      Elegido, no heredado de la plantilla. publishTemplate retira la versión activa y activa
      la nueva: son dos raíces del agregado Template que tienen que confirmar JUNTAS, o entre
      las dos escrituras hay una ventana sin ninguna versión activa y requestNotification
      responde TEMPLATE_NOT_FOUND a peticiones legítimas. Ninguna operación escribe dos
      agregados de TIPO distinto (requestNotification lee Application y Template y solo
      escribe Notification), así que la transacción por operación no ensancha la frontera
      que el dominio declara: solo la hace atómica donde el negocio lo necesita.
    since: 1.0.0
  - id: CHK-USECASES-CODE-MULTI-STATUS
    scope: use-cases.errors.TEMPLATE_NOT_FOUND
    reason: >-
      Deliberado: el mismo hecho, dos lugares del error. 404 cuando lo que no existe es el
      recurso que nombra la RUTA (publishTemplate y getTemplate, por templateId): la URL está
      mal. Una plantilla de OTRA aplicación responde igual, para no revelar que existe. 422
      cuando la referencia viaja en el CUERPO o en el mensaje (requestNotification,
      acceptNotificationRequest): la petición está bien dirigida y apunta a una plantilla
      activa que no hay. Partirlo en dos codes
      cambiaría el contrato público sin darle al integrador un hecho nuevo: el status ya le
      dice qué parte de su llamada corregir, y el `when` de cada operación lo describe.
    since: 1.0.0
  - id: CHK-PERSIST-AUDIT-NESTED
    scope: persistence.audit.TemplateVariable
    reason: >-
      Con el modelo documental TemplateVariable va anidada en el documento de su Template, y la
      auditoría automática solo estampa la raíz. Basta: una variable no cambia nunca por su cuenta
      (se declara al registrar la versión y la versión no se edita), así que sus marcas serían
      siempre las de su Template. Declararlas en el dominio repetiría un dato que ya está.
    since: 1.0.0

structural:
  - section: '3.1'
    scope: messaging.publishing.reliability
    chosen: outbox
    discarded: best-effort
    reason: >-
      NotificationSent confirma que salió un correo real, y el consumidor lo usa para marcar
      su propio estado (el pedido notificado). Si se perdiera con el broker caído, el
      consumidor creería que no salió y podría volver a pedirlo: un segundo correo real al
      mismo destinatario. El outbox cuesta una tabla y un relay, y el servicio ya tiene
      persistencia propia.
    since: 1.0.0
  - section: '3.2'
    chosen: >-
      requestNotification con keySource client-key (cabecera Idempotency-Key, opcional:
      OBL-IDEM-KEY-REQUIRED aceptada); la suscripción deduplica por metadata.eventId de la
      envoltura keel
    discarded: payload-hash en requestNotification
    reason: >-
      Dos peticiones con el mismo cuerpo pueden ser dos intenciones legítimas (dos
      restablecimientos de contraseña seguidos al mismo destinatario): un hash del cuerpo se
      tragaría el segundo correo. Solo el llamante sabe si está reintentando, así que la
      clave la pone él. En el canal de eventos quien repite es el broker, y ahí la clave ya
      existe sin declarar nada.
    since: 1.0.0
  - section: '3.3'
    chosen: sin caché en getTemplate ni en getNotification
    discarded: cache con ttlSeconds en las dos queries
    reason: >-
      getNotification se sondea precisamente para ver el envío avanzar (accepted → sent): una
      respuesta de hace N segundos le mentiría a quien no escucha eventos, que es para quien
      existe. getTemplate lo lee el pipeline justo después de publicar para comprobarlo. Las
      dos son lecturas por clave primaria: la caché no ahorraría nada que valga su invalidación.
    since: 1.0.0
  - section: '3.4'
    chosen: defaultAudience services en todos los endpoints; ninguna operación de usuario
    discarded: audience both, u operaciones separadas para una consola humana
    reason: >-
      Todos los consumidores son sistemas con credencial máquina (orders-service,
      orders-service-ci, platform-admin) y la aplicación se deriva del token. No hay pantalla
      que servir: el día que la haya, tendrá sus operaciones propias, no estas con otro público.
    since: 1.0.0
  - section: '3.5'
    scope: messaging.subscriptions.NotificationRequested.onFailure
    chosen: retry exponencial de 5 intentos (1 s a 30 s) y deadLetter true
    discarded: sin retry (fallar al primer error) o descartar tras agotar los intentos
    reason: >-
      Dos clases de fallo y un solo destino. El pasajero (la base no responde) se reintenta con
      backoff; el rechazo de negocio (plantilla inexistente, variable requerida sin valor) no
      mejora en un segundo y no se reintenta. Los dos acaban en la cola de descarte, que mira
      quien opera la plataforma: una petición de correo perdida en silencio es un cliente sin su
      correo y un consumidor que cree haberlo pedido. La aplicación desconocida no llega al
      handler (onUnresolved: discard). Reintentar no duplica: la guarda es metadata.eventId.
    since: 1.0.0
  - section: '3.7'
    scope: persistence.consistency.transactionalBoundary
    chosen: per-operation
    discarded: per-aggregate
    reason: >-
      publishTemplate toca dos raíces de Template (la que se retira y la que se activa) y
      tienen que confirmar juntas: con per-aggregate habría una ventana sin versión activa, o
      dos activas si la segunda escritura fallara. El evento del outbox comparte esta frontera.
    since: 1.0.0
  - section: '3.9'
    scope: persistence.consistency.optimisticLocking
    chosen: all
    discarded: none (último gana)
    reason: >-
      Dos publicaciones simultáneas de la misma plantilla no pueden acabar las dos en éxito:
      la segunda recibe 409 CONCURRENT_MODIFICATION, declarado en publishTemplate. En
      Notification, el reclamo del barrido y el envío transicionan la misma fila y el último
      que gana podría deshacer un sent. Ningún agregado del servicio tolera perder una escritura.
    since: 1.0.0
  - section: '3.9b'
    scope: persistence.audit.timestamps
    chosen: all
    discarded: declared o none
    reason: >-
      Quien opera un envío que no llegó pregunta primero cuándo se escribió cada fila, así que
      las marcas existen. Ningún cliente las lee: las que importan al contrato (requestedAt,
      sentAt, publishedAt) ya son campos del dominio, y por eso van invisibles y no declared.
    since: 1.0.0
  - section: '3.9b'
    scope: persistence.audit.authorship
    chosen: none
    discarded: all
    reason: >-
      Todos los autores son sistemas, y la atribución con valor de negocio ya es dato del
      dominio: applicationKey en Notification y la relación a Application en Template. Un
      createdBy con el client_id repetiría eso con peor nombre, y en el camino por evento sería
      el centinela system en todas las filas.
    since: 1.0.0

# Modelo A: la plantilla nace y vive aquí. La base de datos es el único sitio del
# mundo donde está, y por eso Template es una entidad del dominio y no un recurso.

types:
  TemplateStatus:
    description: Momento del ciclo de vida de una versión de plantilla.
    values: [draft, active, retired]

  NotificationStatus:
    description: En qué punto está el envío pedido.
    # `sending` no es un estado de adorno: es la GUARDA de un efecto que no se deshace. Un
    # correo que sale no lo retira ningún rollback, así que la marca de «esta ejecución se
    # llevó el envío» tiene que existir para todo el mundo ANTES de mandarlo. Sin un estado
    # intermedio, dos ciclos que se solapen mandan dos correos reales.
    values: [accepted, queued, sending, sent, failed]

  # Las variables de un envío, cerradas en el diseño (R9): hasta aquí el correo se renderizaba
  # con «las variables del envío» y ni la petición ni el evento las traían, y registerTemplate
  # no dejaba declarar las TemplateVariable — declaredVariables era un contrato sin datos.
  TemplateVariableDeclaration:
    description: Una variable que la plantilla declara aceptar, tal como la escribe quien la registra.
    fields:
      name: { type: string, required: true, constraints: { maxLength: 64 } }
      required: { type: boolean, required: true }
      description: { type: string, constraints: { maxLength: 255 } }

  TemplateVariableValue:
    description: El valor de una variable de plantilla para un envío concreto.
    fields:
      name: { type: string, required: true, constraints: { maxLength: 64 } }
      value: { type: string, required: true, constraints: { maxLength: 1000 } }

  EmailAddress:
    base: string
    description: Dirección de correo, con la longitud que admite el estándar.
    constraints:
      maxLength: 254

entities:
  Application:
    description: Sistema consumidor autorizado a mandar correo. No es un usuario; es un sistema.
    fields:
      id: { type: uuid, id: true, generated: true }
      key:
        type: string
        required: true
        unique: true
        constraints: { maxLength: 64 }
        description: >-
          Identificador estable del sistema, y la clave de negocio con la que se le atribuyen sus
          plantillas y sus envíos. NO es un client_id: un mismo sistema puede tener varias
          credenciales (la que envía y la de su pipeline), y todas apuntan aquí.
      name: { type: string, required: true, constraints: { maxLength: 120 } }
      credentialKeys:
        type: string
        list: true
        required: true
        constraints: { maxItems: 5, maxLength: 64 }
        description: >-
          Los `client_id` que resuelven a este sistema. Es la relación que faltaba: con una sola
          credencial por Application, un sistema con dos —una que envía y otra que publica
          plantillas desde su pipeline, con scopes disjuntos— dejaba a la segunda sin Application
          activa, y toda operación suya respondía 403 aunque el sistema estuviera dado de alta.
      defaultSender:
        type: string
        required: true
        constraints: { maxLength: 320 }
        description: Dirección verificada desde la que salen sus correos.
      defaultLocale: { type: string, required: true, constraints: { maxLength: 10 } }
      active:
        type: boolean
        required: true
        description: >-
          A false, sus envíos se cortan al instante sin revocar credenciales ni desplegar. Ninguna
          operación de esta versión lo pone a false: nace activa y la baja no tiene operación todavía,
          así que hoy APPLICATION_INACTIVE solo lo ve una credencial que no resuelve a ninguna aplicación.

  Template:
    description: Una versión concreta del contenido de un correo, propiedad de una aplicación.
    lifecycle:
      field: status
      transitions:
        draft:   [active]
        active:  [retired]
        retired: []
    fields:
      id: { type: uuid, id: true, generated: true }
      key: { type: string, required: true, constraints: { maxLength: 64 } }
      locale: { type: string, required: true, constraints: { maxLength: 10 } }
      status: { type: TemplateStatus, required: true }
      version: { type: int, required: true, constraints: { min: 1 } }
      subject:
        type: string
        required: true
        constraints: { maxLength: 200 }
        description: Asunto con sus llaves sin procesar, tal cual lo escribió quien lo registró.
      # Cota de contrato, no de almacén: un correo de más de 100 000 caracteres no lo muestra
      # bien ningún cliente, y sin ella cada generador elegiría la suya (o ninguna).
      bodyHtml: { type: text, required: true, constraints: { maxLength: 100000 } }
      bodyText: { type: text, required: true, constraints: { maxLength: 100000 } }
      publishedAt: { type: timestamp }
    relations:
      application: { entity: Application, cardinality: many-to-one }
      variables: { entity: TemplateVariable, cardinality: one-to-many }

  TemplateVariable:
    description: Variable que la plantilla declara aceptar; es contrato y se consulta en cada envío para validar.
    fields:
      id: { type: uuid, id: true, generated: true }
      name: { type: string, required: true, constraints: { maxLength: 64 } }
      required: { type: boolean, required: true }
      description: { type: string, constraints: { maxLength: 255 } }

  Notification:
    description: Un envío pedido, con lo que se envió de verdad congelado dentro.
    lifecycle:
      field: status
      transitions:
        accepted: [queued]
        queued:   [sending]
        sending:  [sent, failed]
        sent:     []
        failed:   []
    fields:
      id: { type: uuid, id: true, generated: true }
      applicationKey: { type: string, required: true, constraints: { maxLength: 64 } }
      templateKey: { type: string, required: true, constraints: { maxLength: 64 } }
      status: { type: NotificationStatus, required: true }
      sendingSince:
        type: timestamp
        description: >-
          Cuándo esta ejecución se llevó el envío. Lo estampa el propio reclamo, en la misma
          escritura que pone el estado en sending. Es lo que le dice a quien consulta un envío parado
          en sending desde cuándo lo está: ningún barrido lo rescata, porque reintentarlo podría
          mandar dos veces un correo real (aceptado en gaps.yaml, clase 13).
      templateVersion:
        type: int
        required: true
        description: Congelada. Con la plantilla ya en la v4, la traza sigue diciendo qué se envió.
      locale: { type: string, required: true, constraints: { maxLength: 10 } }
      recipient: { type: string, required: true, constraints: { maxLength: 320 } }
      renderedSubject:
        type: string
        required: true
        constraints: { maxLength: 200 }
        description: Congelado y ya interpolado — es lo que leyó quien lo recibió.
      # Colección de valores sin identidad: en el modelo relacional vive en su tabla
      # de elementos, y la longitud del value type tiene que llegar hasta ALLÍ.
      copyRecipients:
        type: EmailAddress
        list: true
        description: Direcciones en copia, congeladas con el envío.
        constraints: { maxItems: 10 }
      variables:
        type: TemplateVariableValue
        list: true
        constraints: { maxItems: 50 }
        description: >-
          Congeladas con el envío: el asunto se renderiza al aceptar y el cuerpo al enviar, y los
          dos tienen que salir de los MISMOS valores aunque pase un ciclo entre medias.
      dedupeKey: { type: string, required: true, constraints: { maxLength: 128 } }
      requestedAt: { type: timestamp, generated: true }
      sentAt: { type: timestamp }

aggregates:
  Application: { root: Application }
  Template: { root: Template, entities: [TemplateVariable] }
  Notification: { root: Notification }

# Análisis de huecos de notification-mailer-mongo v1.0.0, hecho por keel-gap-sweep en contexto
# limpio. Unidades copiadas del criterio `gaps` de `keel validate --ready`. Todo lo encontrado queda
# `open` salvo lo que el propio diseño ya cierra por escrito (decided/accepted, con la cita).
reviewedBy: keel-gap-sweep
reviewedAt: 2.0.0

coverage:
  - class: 1
    units: [ Template, Notification ]
    result: findings
  - class: 2
    units:
      [
        registerApplication,
        publishTemplate,
        registerTemplate,
        requestNotification,
        acceptNotificationRequest,
        queueAcceptedNotifications,
        sendAcceptedNotification
      ]
    result: findings
  - class: 3
    units: [ Application, Template, TemplateVariable, Notification ]
    result: findings
  - class: 4
    units:
      [
        registerApplication,
        publishTemplate,
        registerTemplate,
        requestNotification,
        acceptNotificationRequest,
        queueAcceptedNotifications,
        sendAcceptedNotification
      ]
    result: findings
  - class: 5
    units: [ getTemplate, getNotification ]
    result: findings
  - class: 6
    units: [ Application, Template, TemplateVariable, Notification ]
    result: findings
  - class: 7
    units: [ publishing.NotificationSent, subscriptions.NotificationRequested ]
    result: findings
  - class: 8
    units: [ subscriptions.NotificationRequested ]
    result: findings
  - class: 9
    units:
      [
        registerApplication,
        publishTemplate,
        registerTemplate,
        requestNotification,
        acceptNotificationRequest,
        queueAcceptedNotifications,
        sendAcceptedNotification,
        getTemplate,
        getNotification
      ]
    result: findings
  - class: 11
    units:
      [
        registerApplication,
        publishTemplate,
        registerTemplate,
        requestNotification,
        getTemplate,
        getNotification,
        serviceClients.orders-service,
        serviceClients.orders-service-ci,
        serviceClients.billing-service,
        serviceClients.billing-service-ci,
        serviceClients.platform-admin
      ]
    result: findings
  - class: 12
    units: [ service ]
    result: findings
  - class: 13
    units: [ queueAcceptedNotifications ]
    result: findings
  - class: 14
    units: [ Application, Template, TemplateVariable, Notification ]
    result: findings
  - class: 15
    units:
      [
        registerApplication,
        publishTemplate,
        registerTemplate,
        requestNotification,
        getTemplate,
        getNotification
      ]
    result: findings
  - class: 16
    units: [ '3.1', '3.2', '3.3', '3.4', '3.5', '3.7', '3.9', '3.9b' ]
    result: findings
  - class: 17
    units: [ sendAcceptedNotification ]
    result: findings

findings:
  # --- 1. Alcanzabilidad del ciclo de vida
  - class: 1
    unit: Template
    what: >-
      `retired` es terminal y no hay vuelta atrás: el diseño no dice cómo se revierte una
      publicación errónea (reactivar la versión anterior o registrarla de nuevo como versión nueva).
    severity: risk
    state: accepted
    reason: "Aceptado en v2.0.0: una versión activa solo se sustituye publicando otra y un borrador se
      queda en borrador. Deshacer una publicación es publicar la anterior como versión nueva; no
      hace falta una transición de vuelta para eso."
  - class: 1
    unit: Notification
    what: >-
      `failed` es terminal y ninguna operación permite reenviar un envío fallido; el diseño no dice
      si el llamante debe pedir uno nuevo (con otra clave) o si el servicio ofrece reintento.
    severity: risk
    state: accepted
    reason: "Aceptado: failed es terminal. Reenviar es pedir otro envío, con otra clave. Reintentar el
      mismo no distingue «no salió» de «salió y el relay no contestó»."

  # --- 2. Guardas ↔ errores
  - class: 2
    unit: publishTemplate
    what: >-
      TEMPLATE_ALREADY_ACTIVE («ya hay otra versión activa») contradice la regla de que publicar
      retira la activa: solo es alcanzable en la carrera, donde compite con CONCURRENT_MODIFICATION
      por el mismo desenlace y el cliente recibe uno u otro sin criterio de diseño.
    severity: risk
    state: accepted
    reason: "Aceptado: los dos codes son 409 y los dos dicen que otra publicación ganó la carrera.
      FL-TPL-011 admite los dos desenlaces y afirma lo que importa: queda exactamente una versión
      activa."
  - class: 2
    unit: acceptNotificationRequest
    what: >-
      La precondición «registrada y activa» no tiene error ni desenlace para una aplicación que
      existe pero con `active: false`: onUnresolved solo cubre la que no resuelve, y por HTTP la
      misma situación es APPLICATION_INACTIVE.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: un mensaje de una aplicación dada de baja se descarta igual que el de
      una desconocida (regla de acceptNotificationRequest)."

  # --- 3. Determinación del estado
  - class: 3
    unit: Notification
    what: >-
      El estado inicial de Notification no tiene `default` en el campo ni regla en
      requestNotification/acceptNotificationRequest.
    severity: risk
    state: decided
    reason: >-
      Lo fija validation-scenarios.md, FL-NTF-001 Then 2-3: el envío nace en `status: "accepted"`
      con sendingSince y sentAt nulos.

  # --- 4. Concurrencia y unicidad
  - class: 4
    unit: registerApplication
    what: >-
      Nada impide que un `credentialKey` ya asignado a una aplicación se asigne a otra: no hay
      unicidad sobre credentialKeys ni error de colisión, y entonces un client_id resuelve a dos
      aplicaciones.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: índice único sobre credentialKeys y 409 CREDENTIAL_ALREADY_ASSIGNED
      (FL-APP-001-B)."
  - class: 4
    unit: requestNotification
    what: >-
      No dice si la Idempotency-Key es por aplicación o global: si orders y billing usan la misma
      clave, el diseño no fija si la segunda es un envío nuevo o IDEMPOTENCY_KEY_REUSED; ni durante
      cuánto tiempo se recuerda una clave.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: la Idempotency-Key se acota a la aplicación del llamante (regla). Su
      vida es el ttl por defecto del mecanismo."
  - class: 4
    unit: registerTemplate
    what: >-
      Sin idempotencia, un pipeline que reintenta tras un timeout registra una segunda versión en
      borrador del mismo contenido; el diseño no dice si eso es aceptable.
    severity: gap
    state: accepted
    reason: "Aceptado: el PUT versiona a propósito, porque registrar nunca pisa una versión que alguien
      pudo publicar. Un reintento tras un timeout deja un borrador más, que nadie usa hasta
      publicarlo por id."

  # --- 5. Consultas
  - class: 5
    unit: getNotification
    what: >-
      Devuelve recipient, copyRecipients, variables y dedupeKey (datos personales y la clave de
      idempotencia del llamante) sin ningún campo marcado `sensitive` ni decisión sobre qué expone.
    severity: risk
    state: accepted
    reason: "Aceptado: getNotification solo devuelve envíos de la aplicación del llamante (404 si es de
      otra), y los datos que devuelve son los que esa misma aplicación mandó."

  # --- 6. Fronteras del agregado y cascadas
  - class: 6
    unit: Application
    what: >-
      No hay operación de baja: `active` nunca pasa a false y una aplicación no se puede retirar ni
      borrar; qué pasa con sus plantillas y envíos al darla de baja queda sin decidir.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en la prosa del diseño: domain.keel.yaml, Application.active — «Ninguna operación de
      esta versión lo pone a false: nace activa y la baja no tiene operación todavía», y la regla de
      registerApplication «Darla de baja es otra operación, no un campo de esta».

  # --- 7. Contrato de eventos
  - class: 7
    unit: publishing.NotificationSent
    what: >-
      El payload no lleva nada que correlacione con la petición por evento (ni el metadata.eventId
      del NotificationRequested ni la dedupeKey): quien pide por el canal no recibe nunca el
      notificationId y no puede saber cuál de sus peticiones salió.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: NotificationSent lleva dedupeKey (la Idempotency-Key, o event:<eventId>)
      para correlacionar con la petición."
  - class: 7
    unit: publishing.NotificationSent
    what: >-
      Un envío `failed` no emite nada: el consumidor que escucha eventos no se entera nunca del
      fallo, y el que pidió por evento tampoco puede sondear getNotification sin notificationId.
    severity: gap
    state: accepted
    reason: "Aceptado en v2.0.0: un envío failed no emite evento. Hoy ningún consumidor reacciona a un
      fallo, y quien lo necesita lo lee con getNotification. NotificationSent lleva ya dedupeKey
      para correlacionar lo que sí salió."
  - class: 7
    unit: publishing.NotificationSent
    what: >-
      Un solo canal para todos los inquilinos: cada consumidor recibe el recipient de los envíos de
      las demás aplicaciones; el diseño no dice si es aceptable ni si se filtra por applicationKey.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: el destinatario ya no viaja en NotificationSent, porque el canal lo leen
      todos los inquilinos."
  - class: 7
    unit: subscriptions.NotificationRequested
    what: >-
      El payload no admite copyRecipients mientras requestNotification sí: el canal por evento no
      puede pedir copias y el diseño no dice si la asimetría es deliberada.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: copyRecipients en el payload de NotificationRequested y en el input de
      acceptNotificationRequest."

  # --- 8. Fallo de dependencias externas
  - class: 8
    unit: subscriptions.NotificationRequested
    what: >-
      La cola de descarte recibe a la vez los agotados por fallo pasajero y los rechazos de negocio,
      y no hay vía de reproceso ni forma declarada de distinguirlos: lo que pasa con un mensaje una
      vez descartado queda sin decidir.
    severity: risk
    state: accepted
    reason: "Aceptado: la cola de descarte mezcla agotados y rechazos, y los distingue la cabecera de
      excepción que añade el broker. El reproceso es una operación de quien opera la plataforma,
      fuera de este diseño."

  # --- 9. Autorización a nivel de dato
  - class: 9
    unit: registerApplication
    what: >-
      Quien da de alta puede poner en credentialKeys el client_id de otro sistema ya registrado y
      pasar a operar sobre sus plantillas y envíos: el diseño no dice que una credencial pertenece a
      una sola aplicación.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: un client_id ya asignado a otra aplicación se rechaza con 409
      CREDENTIAL_ALREADY_ASSIGNED (índice único sobre credentialKeys, FL-APP-001-B), así que nadie
      se apropia de los datos de otro sistema."
  - class: 9
    unit: acceptNotificationRequest
    what: >-
      La aplicación sale de metadata.source, que pone el propio emisor sin comprobación: un sistema
      de la organización puede pedir envíos en nombre de otro.
    severity: risk
    state: decided
    reason: >-
      Decidido en messaging.keel.yaml,
      subscriptions.NotificationRequested.identity.trustedPublishers: la asunción (el broker
      autentica a los emisores, cada uno pone su nombre), la alternativa evaluada (location header,
      inviable en SNS→SQS) y el disparador de revisión.

  # --- 11. Superficie servidor-a-servidor
  - class: 11
    unit: getTemplate
    what: >-
      El pipeline solo puede leer una plantilla por templateId: no hay consulta de la versión activa
      por clave e idioma ni listado de versiones, así que quien pierde el id no puede averiguar qué
      está publicado.
    severity: risk
    state: accepted
    reason: "Aceptado en v2.0.0: el pipeline guarda el templateId que devuelve registerTemplate. Consultar
      por clave e idioma, o listar versiones, es una operación nueva que ningún consumidor ha pedido
      todavía."
  - class: 11
    unit: registerApplication
    what: >-
      Dar de alta una aplicación no provisiona su credencial: los clientes máquina están fijados en
      security.serviceClients, así que un sistema nuevo exige editar el diseño, en contra de lo que
      promete messaging («el sistema número doce entra sin tocar nada»).
    severity: risk
    state: accepted
    reason: "Aceptado, y es un límite del DSL: security.serviceClients enumera las credenciales para que
      build las aprovisione en el proveedor de identidad. Un sistema nuevo es una edición del
      diseño, a diferencia del canal de peticiones, que es genérico."

  # --- 12. Zonas grises de la equivalencia
  - class: 12
    unit: service
    what: >-
      No fija si Application.key, templateKey, locale y las direcciones de correo distinguen
      mayúsculas: `Orders`/`orders` o `ES`/`es` pueden ser la misma clave o dos distintas según el
      stack.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: las claves, el idioma y las direcciones se comparan exactos (el compare
      por defecto), y las convenciones de los escenarios lo fijan."
  - class: 12
    unit: service
    what: >-
      El formato de locale (y de defaultLocale) no está fijado: solo maxLength 10, sin decir si es
      BCP 47 ni si `es` y `es-ES` son el mismo idioma.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: el value type Locale (dos letras y región opcional); es y es-ES son
      idiomas distintos."
  - class: 12
    unit: service
    what: >-
      Las direcciones no tienen formato ni error de validación declarados, y sus cotas no coinciden
      (recipient y defaultSender 320, EmailAddress 254): una dirección mal formada se acepta con 202
      y solo falla en el relay.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: el value type EmailAddress, con patrón y cota de 254, en todas las
      direcciones."

  # --- 13. Ejecuciones programadas
  - class: 13
    unit: queueAcceptedNotifications
    what: >-
      Si el ciclo cae después de pasar el lote a `queued` y antes de invocar
      sendAcceptedNotification, esas filas quedan en `queued` para siempre: el barrido solo reclama
      `accepted` y nada rescata `queued`.
    severity: gap
    state: accepted
    reason: "Aceptado: una fila en queued no ha mandado ningún correo, así que rescatarla sería seguro,
      pero exige su propio reloj y un barrido más. Se queda visible por getNotification. El
      disparador para cerrarlo es el primer envío que se quede ahí en producción."
  - class: 13
    unit: queueAcceptedNotifications
    what: >-
      Un envío que se queda en `sending` tras una caída no lo rescata ningún ciclo.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en la prosa del diseño: domain.keel.yaml, Notification.sendingSince — «ningún barrido
      lo rescata, porque reintentarlo podría mandar dos veces un correo real»; sendingSince queda
      para que quien consulte sepa desde cuándo.

  # --- 14. Estado persistido
  - class: 14
    unit: Notification
    what: >-
      Los envíos (destinatarios, variables, asunto renderizado) se guardan para siempre: no hay
      retención ni purga declaradas para datos personales.
    severity: gap
    state: accepted
    reason: "Aceptado en v2.0.0, como seguimiento antes de producción: el DSL no tiene dónde declarar
      retención y hace falta una operación explícita de purga. Las variables pueden llevar datos
      personales."
  - class: 14
    unit: Notification
    what: >-
      Los índices [recipient, requestedAt] y [copyRecipients] no sostienen ninguna consulta del
      diseño: o falta la operación que busca por destinatario, o sobran.
    severity: risk
    state: accepted
    reason: "Aceptado: los índices por destinatario existen para la cobertura del generador (el índice
      sobre una colección, en su tabla hija) y para las consultas de quien opera la base. Ninguna
      operación los usa."

  # --- 15. Superficie HTTP
  - class: 15
    unit: registerTemplate
    what: >-
      Es un PUT que crea una versión nueva en cada llamada: repetirlo no es idempotente, contra la
      semántica que un cliente HTTP espera de PUT, y el diseño no lo razona.
    severity: risk
    state: accepted
    reason: "Aceptado: el PUT versiona a propósito, porque registrar nunca pisa una versión que alguien
      pudo publicar. Un reintento tras un timeout deja un borrador más, que nadie usa hasta
      publicarlo por id."

  # --- 16. Decisiones estructurales sin dueño
  - class: 16
    unit: '3.2'
    what: >-
      El registro de idempotencia solo nombra requestNotification y la suscripción: no consta que se
      preguntara por registerApplication, registerTemplate ni publishTemplate, que no la llevan.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: la entrada 3.2 de decisions.yaml razona también registerApplication,
      publishTemplate y registerTemplate."

  # --- 17. Correo saliente
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      Solo el rechazo del relay tiene desenlace (`failed`): no dice qué pasa si el relay no responde
      o no se alcanza (¿failed, reintento, se queda en sending?).
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: un relay que no se alcanza o no contesta a tiempo deja el envío en
      failed (regla)."
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      mail.delivery.attachments es true, pero ninguna operación ni el payload del evento aceptan
      adjuntos: no dice de dónde salen ni con qué cotas.
    severity: gap
    state: accepted
    reason: "Aceptado: attachments está a true para que el generador compile esa rama, porque es la única
      capa mail del corpus. Ningún correo de esta versión lleva adjuntos, y DESIGN.md lo dice."
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      Nada impide volver a mandar a una dirección que el relay ya rechazó: no hay supresión
      declarada, y la reputación del remitente es compartida por todas las aplicaciones.
    severity: risk
    state: accepted
    reason: "Aceptado: sin canal de rebotes no hay de dónde saber qué dirección rebotó, y el rebote
      diferido está fuera de alcance a propósito. La lista de supresión llegará con ese canal."
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      El rebote diferido (el relay acepta y el destino devuelve el correo después) no tiene canal
      por el que llegue.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en la prosa del diseño: regla de sendAcceptedNotification en use-cases.keel.yaml —
      «Un rebote posterior … llega por un canal que este diseño NO declara, así que queda
      explícitamente fuera de alcance», repetido en la nota de FL-DSP-001.
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      replyTo es fijo (soporte@ejemplo.com) para todas las aplicaciones: las respuestas de los
      clientes de cada inquilino llegan al mismo buzón, y el diseño no dice si es deliberado.
    severity: risk
    state: accepted
    reason: "Aceptado: todas las aplicaciones comparten el buzón de soporte de la plataforma. Un replyTo
      por aplicación es un campo nuevo que ningún sistema ha pedido."

# La revisión semántica de este diseño (/keel-validate): qué se miró y con qué resultado. Los
# `fixed` se corrigieron en el diseño durante el cierre de R9; los `accepted` son hallazgos que se
# dejan a sabiendas, con su porqué.
reviewedAt: 1.0.0
findings:
  - id: REV-DOMAIN-PROMISED-STATE
    scope: domain.entities
    verdict: fixed
    note: >-
      Dos promesas sin nada que las sostuviera. `sendingSince` decía que sin él «el rescate» no
      encontraba la fila, y ningún barrido rescata envíos: ahora dice para qué sirve de verdad
      (saber desde cuándo está parado un envío) y remite al riesgo aceptado en gaps.yaml.
      `Application.active` prometía cortar los envíos al ponerlo a false, y ninguna operación lo
      pone: ahora lo dice, y dice por qué hoy APPLICATION_INACTIVE solo lo ve una credencial sin
      aplicación. Template (retired, publishedAt) y Notification (failed, sentAt) sí sostienen lo
      que su prosa promete.
  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations.registerTemplate
    verdict: accepted
    note: >-
      registerTemplate no declara idempotencia y un pipeline que reintenta tras un timeout crea
      una versión más, en borrador. Se acepta: el efecto no sale del proceso ni llega a nadie,
      porque un borrador no se usa hasta que publishTemplate lo publica, y eso va por id. El resto
      de los commands expuestos tiene guarda: registerApplication la clave natural (409),
      publishTemplate su transición (409 INVALID_STATE_TRANSITION) y requestNotification su
      Idempotency-Key.
  - id: REV-USECASES-GUARD-ORDER
    verdict: ok
    note: >-
      Los órdenes que fijan los escenarios son implementables. En registerTemplate y
      requestNotification la aplicación se resuelve antes que todo lo demás, y es de lo que
      dependen la búsqueda de la plantilla activa y la de sus variables. En publishTemplate, el
      404 por plantilla ajena necesita la aplicación del token, que llega resuelta en el input.
  - id: REV-SEC-M2M-AUDIENCE
    verdict: accepted
    note: >-
      serviceAuth no valida la audiencia. Se acepta porque todos los scopes que este servicio
      exige (notification:*, template:*, application:admin) son suyos: ningún otro servicio del
      realm los concede, así que un token emitido para otro servicio no pasa ninguna regla de
      acceso de aquí. El disparador para revisarlo es que otro servicio adopte un scope con el
      mismo nombre.
  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: fixed
    note: >-
      Ni NotificationSent ni NotificationRequested tenían canal, y el servicio vive de
      integrarse: un sistema que quería pedir un correo no tenía dónde publicar. Se declararon
      notificationEvents (lo que sale) y notificationRequests (lo que entra, genérico), y los
      escenarios los nombran.
  - id: REV-MSG-IDENTITY-FROM-FIELD
    scope: messaging.subscriptions.NotificationRequested
    verdict: accepted
    note: >-
      Releída la asunción de trustedPublishers, con el agravante que marca la checklist: el
      trabajo pedido es un correo, que no se puede retirar. Sigue en pie, porque todos los
      emisores son sistemas propios y el broker los autentica, y lo que queda vivo (un sistema
      propio pidiendo en nombre de otro) está escrito ahí mismo. Se verificó que `header` no es
      viable en SNS→SQS, así que la salida el día que un emisor quede fuera del perímetro es un
      destino por emisor. El alcance por inquilino que añadió R9 cierra la otra mitad: por HTTP,
      un sistema ya no ve ni publica lo de otro.
  - id: REV-MSG-DEDUPE-WINDOW
    scope: messaging.subscriptions.NotificationRequested
    verdict: ok
    note: >-
      El efecto del handler se acumula (otro correo), pero no depende de la retención de
      procesados. dedupeKey es el metadata.eventId y forma la naturalKey con applicationKey, así
      que una reentrega posterior a la retención choca con esa unicidad y no inserta un segundo
      envío.
  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities
    verdict: fixed
    note: >-
      Faltaban dos índices en consultas que corren siempre. Cada petición resuelve su aplicación
      buscando el client_id entre los credentialKeys: se añadió un índice sobre esa colección. El
      barrido reclama por estado cada minuto: se añadió [status, requestedAt]. La plantilla
      activa ya la cubría el índice condicionado, y las dos queries van por clave primaria.
  - id: REV-MAIL-SENTBY-NO-GUARD
    scope: mail.sentBy
    verdict: ok
    note: >-
      sendAcceptedNotification tiene guarda: la transición queued → sending, confirmada antes de
      entregar. Su límite en caja negra está aceptado aparte, en OBL-GUARD-UNOBSERVABLE.
  - id: REV-MAIL-TEMPLATE-ERRORS
    scope: use-cases.operations.registerTemplate
    verdict: fixed
    note: >-
      «No hay plantilla» y «falta una variable» están declarados donde se aceptan los envíos
      (TEMPLATE_NOT_FOUND y TEMPLATE_VARIABLE_MISSING), y la versión y los valores se congelan,
      así que al enviar no pueden faltar. Lo que quedaba sin error era una plantilla que no
      compila: se registraba y reventaba al renderizar, con el envío ya aceptado. Se añadió
      TEMPLATE_SYNTAX_INVALID (422) al registrar. Se quitó el TEMPLATE_NOT_FOUND de
      sendAcceptedNotification, que ningún camino podía producir.
  - id: REV-MAIL-ASYNC-OUTCOME
    scope: use-cases.operations.requestNotification
    verdict: accepted
    note: >-
      requestNotification responde 202 antes de enviar, y el envío que falla después queda en
      failed, sin evento. Quien sondea getNotification lo ve; quien solo escucha
      NotificationSent no se entera nunca. Se acepta porque hoy ningún consumidor reacciona a un
      fallo de envío. El disparador para revisarlo es el primero que lo haga, y la salida es un
      NotificationFailed en notificationEvents.
  - id: REV-MAIL-BOUNCE-CHANNEL
    scope: use-cases.operations.sendAcceptedNotification
    verdict: ok
    note: >-
      Ninguna regla depende de un rebote posterior. El diseño dice expresamente que el único
      fallo observable es el rechazo del relay, y que el rebote diferido llega por un canal no
      declarado y queda fuera de alcance. Es el hueco declarado que pide la checklist.

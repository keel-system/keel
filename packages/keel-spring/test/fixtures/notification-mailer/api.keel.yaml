style: rest
basePath: /v1
auto: false
# Todos los consumidores son sistemas con credencial máquina: la aplicación se
# deriva del token, y por eso ningún endpoint es de audiencia humana.
defaultAudience: services
endpoints:
  registerApplication:
    method: POST
    path: "/applications"
    successStatus: 201
  registerTemplate:
    method: PUT
    path: "/templates/{templateKey}/{locale}"
    # Declarado, no supuesto: un PUT que CREA una versión nueva responde 201, y build no
    # puede adivinarlo — sin esto asumía 200 y el escenario que exigía 201 fallaba.
    successStatus: 201
  publishTemplate: { method: POST, path: "/templates/{templateId}/publish" }
  requestNotification:
    method: POST
    path: "/notifications"
    # Acepta y rastrea: la disponibilidad del proveedor SMTP no entra en la
    # transacción de quien llama. Un proveedor lento no puede hacer que fallen los pedidos.
    successStatus: 202
  getTemplate: { method: GET, path: "/templates/{templateId}" }
  getNotification: { method: GET, path: "/notifications/{notificationId}" }

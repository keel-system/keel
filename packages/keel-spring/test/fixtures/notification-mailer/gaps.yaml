findings:
  # --- Clase 1 ---
  - class: 1
    unit: Template
    what: >-
      Una versión activa solo sale de active publicando otra que la sustituya, y un borrador no
      tiene salida: el diseño no dice si una aplicación puede retirar su plantilla sin reemplazo ni
      descartar un borrador que no va a publicar.
    severity: risk
    state: accepted
    reason: "Aceptado en v2.0.0: una versión activa solo se sustituye publicando otra y un borrador se
      queda en borrador. Deshacer una publicación es publicar la anterior como versión nueva; no
      hace falta una transición de vuelta para eso."

  # --- Clase 2 ---
  - class: 2
    unit: publishTemplate
    what: >-
      La precondición «está en borrador» no tiene error en `errors`: el code y el http de publicar
      una versión active o retired (INVALID_STATE_TRANSITION, 409) solo existen en los escenarios.
    severity: gap
    state: accepted
    reason: "Aceptado: publicar algo que no está en borrador responde 409 INVALID_STATE_TRANSITION, que es
      el code de framework del lifecycle (framework-errors.md) y no se declara en errors.
      FL-TPL-010-B lo afirma."
  - class: 2
    unit: requestNotification
    what: >-
      No hay guarda ni error para dos valores con el mismo `name` en `variables` (tampoco en
      acceptNotificationRequest): el diseño no dice si se rechaza o cuál de los dos se congela.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: dos variables con el mismo nombre en la petición se rechazan con
      TEMPLATE_VARIABLE_DUPLICATED (422), por HTTP y por evento."
  - class: 2
    unit: registerApplication
    what: >-
      La descripción de `credentialKeys` dice «al menos una», pero no hay `minItems` ni error: una
      aplicación con la lista vacía se da de alta y no la resuelve ninguna credencial.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: credentialKeys con minItems 1, en el dominio y en la entrada."

  # --- Clase 3 ---
  - class: 3
    unit: Notification
    what: >-
      El estado con el que nace una notificación (accepted) no lo fija ni un `default` del campo
      `status` ni una regla de requestNotification o acceptNotificationRequest: solo lo dicen los
      escenarios.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: status con default accepted."
  - class: 3
    unit: Notification
    what: >-
      En el camino por evento (acceptNotificationRequest) no se declara que el `locale` omitido tome
      el defaultLocale de la aplicación, ni que se congelen templateVersion y renderedSubject, ni
      que las variables no declaradas se ignoren: esas reglas solo las tiene requestNotification.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: acceptNotificationRequest tiene las mismas reglas que la vía HTTP
      (idioma por defecto, congelación, variables no declaradas y repetidas)."

  # --- Clase 4 ---
  - class: 4
    unit: registerApplication
    what: >-
      `credentialKeys` no es único entre aplicaciones (su índice no es `unique` y no hay error): dos
      aplicaciones pueden reclamar el mismo client_id y la resolución de identidad queda ambigua.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: índice único sobre credentialKeys y 409 CREDENTIAL_ALREADY_ASSIGNED en
      registerApplication (FL-APP-001-B). Un client_id resuelve a un solo sistema."
  - class: 4
    unit: publishTemplate
    what: >-
      La carrera de dos publicaciones termina en CONCURRENT_MODIFICATION o en
      TEMPLATE_ALREADY_ACTIVE según qué escritura llegue antes, y el `when` de
      TEMPLATE_ALREADY_ACTIVE describe una condición secuencial que la regla «publicar retira la
      activa» hace inalcanzable: dos codes para un mismo desenlace.
    severity: risk
    state: accepted
    reason: "Aceptado: los dos codes son 409 y los dos dicen que otra publicación ganó la carrera.
      FL-TPL-011 admite los dos desenlaces y afirma lo que importa: queda exactamente una versión
      activa."
  - class: 4
    unit: acceptNotificationRequest
    what: >-
      El `dedupeKey` comparte espacio (naturalKey [applicationKey, dedupeKey]) entre la
      Idempotency-Key HTTP y el metadata.eventId del evento: el diseño no dice qué pasa si coinciden
      entre las dos puertas de la misma aplicación.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: por evento, dedupeKey es event: seguido del eventId, así que no comparte
      espacio con las Idempotency-Key de la vía HTTP."

  # --- Clase 6 ---
  - class: 6
    unit: Application
    what: >-
      Ninguna operación da de baja ni borra una aplicación: `active` nunca pasa a false y sus
      plantillas y envíos no tienen política de baja.
    severity: risk
    state: accepted
    reason: >-
      Lo dice el propio diseño en la descripción de Application.active («nace activa y la baja no
      tiene operación todavía») y en la regla de registerApplication («Darla de baja es otra
      operación»).

  # --- Clase 7 ---
  - class: 7
    unit: publishing.NotificationSent
    what: >-
      Quien pide por el canal de eventos nunca recibe el notificationId, y NotificationSent no lleva
      nada que lo correlacione con su petición (ni el eventId de origen ni una referencia del
      cliente); como failed no emite nada, ese consumidor tampoco puede saber que su envío falló.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: NotificationSent lleva dedupeKey (la Idempotency-Key, o
      event:<eventId>), con el que quien pidió por evento reconoce su petición (FL-EVT-001)."
  - class: 7
    unit: subscriptions.NotificationRequested
    what: >-
      El payload de NotificationRequested y el input de acceptNotificationRequest no traen
      `copyRecipients`: por evento no se puede pedir copia, y el diseño no dice si es deliberado.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: copyRecipients en el payload de NotificationRequested y en el input de
      acceptNotificationRequest."

  # --- Clase 9 ---
  - class: 9
    unit: acceptNotificationRequest
    what: >-
      Por el canal de eventos la aplicación sale de metadata.source, que nada comprueba: un emisor
      del perímetro puede pedir un envío en nombre de otra aplicación y desde su remitente.
    severity: gap
    state: decided
    reason: >-
      Decidido y materializado en
      messaging.subscriptions.NotificationRequested.identity.trustedPublishers, con la alternativa
      `location: header` evaluada y descartada para SNS→SQS y el disparador de revisión escrito.

  # --- Clase 11 ---
  - class: 11
    unit: getTemplate
    what: >-
      No hay consulta por clave e idioma ni listado: un pipeline que perdió el templateId no puede
      saber qué versión está activa ni cuáles existen.
    severity: risk
    state: accepted
    reason: "Aceptado en v2.0.0: el pipeline guarda el templateId que devuelve registerTemplate. Consultar
      por clave e idioma, o listar versiones, es una operación nueva que ningún consumidor ha pedido
      todavía."
  - class: 11
    unit: registerApplication
    what: >-
      Los serviceClients están enumerados en el diseño, así que dar de alta un sistema nuevo exige
      editar security.keel.yaml, aunque el comentario de messaging promete que «el sistema número
      doce entra sin tocar nada».
    severity: risk
    state: accepted
    reason: "Aceptado, y es un límite del DSL: security.serviceClients enumera las credenciales para que
      build las aprovisione en el proveedor de identidad. Un sistema nuevo es una edición del
      diseño, a diferencia del canal de peticiones, que es genérico."

  # --- Clase 12 ---
  - class: 12
    unit: service
    what: >-
      Las direcciones de correo no tienen formato validado ni cota común: `recipient` y
      `defaultSender` admiten 320 caracteres y `copyRecipients` (EmailAddress) 254, y ninguna
      comprueba que sea una dirección.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: el value type EmailAddress, con patrón y cota de 254, en todas las
      direcciones (recipient, copias y defaultSender)."
  - class: 12
    unit: service
    what: >-
      No se fija la forma de `locale` (es, es-ES, es_ES) ni si `locale`, `templateKey` y la `key` de
      la aplicación distinguen mayúsculas al buscar la plantilla activa o comprobar unicidad.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: el value type Locale (dos letras y región opcional). Las claves, el
      idioma y las direcciones se comparan exactos (el compare por defecto), y lo fijan las
      convenciones de los escenarios."

  # --- Clase 13 ---
  - class: 13
    unit: queueAcceptedNotifications
    what: >-
      Si el ciclo confirma el paso a queued y cae antes de invocar sendAcceptedNotification, la fila
      se queda en queued para siempre: el barrido solo reclama accepted y nada rescata queued.
    severity: gap
    state: accepted
    reason: "Aceptado: una fila en queued no ha mandado ningún correo, así que rescatarla sería seguro,
      pero exige su propio reloj y un barrido más. Se queda visible por getNotification. El
      disparador para cerrarlo es el primer envío que se quede ahí en producción."
  - class: 13
    unit: queueAcceptedNotifications
    what: >-
      Un envío parado en sending (caída entre el reclamo y el desenlace) no lo rescata ningún
      barrido.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en la prosa del diseño: la descripción de Notification.sendingSince dice que ningún
      barrido lo rescata porque reintentarlo podría mandar dos veces un correo real, y la obligación
      OBL-GUARD-UNOBSERVABLE está aceptada en decisions.yaml.

  # --- Clase 14 ---
  - class: 14
    unit: Notification
    what: >-
      Las notificaciones guardan destinatario, copias y variables (datos personales) para siempre:
      no hay retención ni purga declarada.
    severity: gap
    state: accepted
    reason: "Aceptado en v2.0.0, como seguimiento antes de producción: el DSL no tiene dónde declarar
      retención y hace falta una operación explícita de purga. Las variables pueden llevar datos
      personales."

  # --- Clase 15 ---
  - class: 15
    unit: registerTemplate
    what: >-
      Es un PUT que crea una versión nueva en cada llamada (no idempotente), y su Location
      (/v1/templates/{key}/{locale}/{id}) apunta a una ruta que ningún endpoint sirve.
    severity: gap
    state: accepted
    reason: "Aceptado: el PUT versiona a propósito, porque registrar nunca pisa una versión que alguien
      pudo publicar. Un reintento tras un timeout deja un borrador más, que nadie usa hasta
      publicarlo por id. Aceptado: la Location la emite el generador (URI de la petición más el id)
      y el diseño no puede declararla ni negarla. No hay getApplication, y la de una plantilla no es
      la ruta de getTemplate. Anotado como hallazgo del método."
  - class: 15
    unit: registerApplication
    what: >-
      Responde 201 con Location /v1/applications/{id}, pero no hay ninguna operación que lea una
      aplicación.
    severity: risk
    state: accepted
    reason: "Aceptado: la Location la emite el generador (URI de la petición más el id) y el diseño no
      puede declararla ni negarla. No hay getApplication, y la de una plantilla no es la ruta de
      getTemplate. Anotado como hallazgo del método."

  # --- Clase 16 ---
  - class: 16
    unit: '3.2'
    what: >-
      La entrada 3.2 solo razona requestNotification y la suscripción: no consta que se preguntara
      por registerTemplate (un reintento del pipeline crea otra versión), registerApplication ni
      publishTemplate (un reintento tras perder la respuesta ve un 409 de un éxito).
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: la entrada 3.2 de decisions.yaml razona ahora también
      registerApplication, publishTemplate y registerTemplate."

  # --- Clase 17 ---
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      mail.delivery.attachments es true, pero ningún input, payload ni campo de Notification trae
      adjuntos: el diseño no dice de dónde salen.
    severity: gap
    state: accepted
    reason: "Aceptado: attachments está a true para que el generador compile esa rama, porque es la única
      capa mail del corpus. Ningún correo de esta versión lleva adjuntos, y DESIGN.md lo dice."
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      Solo se declara el desenlace del relay que RECHAZA (failed); con el relay caído o un timeout
      —que no distingue «no llegó» de «llegó»— no se dice si el envío pasa a failed, se reintenta o
      queda en sending.
    severity: gap
    state: decided
    reason: "Corregido en v2.0.0: un relay que no se alcanza o no contesta a tiempo deja el envío en
      failed, sin reintentar dentro de la operación, porque no se sabe si el correo salió."
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      El rebote tardío (el relay acepta y el destino devuelve el correo después) no tiene canal por
      el que llegue.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en una regla de sendAcceptedNotification: ese rebote «llega por un canal que este
      diseño NO declara, así que queda explícitamente fuera de alcance», repetido en la nota de
      FL-DSP-001.
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      Nada impide volver a enviar a una dirección que rebotó o se quejó, y la reputación del
      remitente es compartida por todos los consumidores.
    severity: risk
    state: accepted
    reason: "Aceptado: sin canal de rebotes no hay de dónde saber qué dirección rebotó, y el rebote
      diferido está fuera de alcance a propósito. La lista de supresión llegará con ese canal."
  - class: 17
    unit: sendAcceptedNotification
    what: >-
      No se declara si los valores de las variables se escapan al interpolarlos en bodyHtml: un
      valor con marcado puede inyectar HTML en el correo.
    severity: risk
    state: decided
    reason: "Corregido en v2.0.0: los valores se escapan como HTML en la parte html y van tal cual en la
      de texto (regla, y caso borde en FL-NTF-001)."

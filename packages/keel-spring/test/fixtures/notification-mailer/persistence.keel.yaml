default:
  model: relational

entities:
  Application:
    persisted: true
    naturalKey: [key]
    # Dos unicidades con codes que no siguen la forma de sus campos: sin nombrarlos, el generador
    # no puede saber cuál de los dos 409 es de cuál (CHK-PERSIST-UNIQUE-ERROR-UNDECLARED).
    naturalKeyError: APPLICATION_ALREADY_EXISTS
    indexes:
      # Cada petición resuelve su aplicación buscando el client_id ENTRE los credentialKeys: sin
      # índice sobre la colección, esa búsqueda recorre todas las credenciales de todos los sistemas.
      - fields: [credentialKeys]
        unique: true
        error: CREDENTIAL_ALREADY_ASSIGNED
        description: Un client_id resuelve a una sola aplicación.

  Template:
    persisted: true
    naturalKey: [application, key, locale, version]
    naturalKeyError: TEMPLATE_VERSION_ALREADY_EXISTS
    indexes:
      # «Como máximo una activa» NO es una unicidad de columnas: es una unicidad
      # condicionada al estado. Sin la condición habría que elegir entre no poder
      # tener nunca dos versiones o no garantizar nada.
      - fields: [application, key, locale]
        unique: true
        when: { field: status, equals: active }
        error: TEMPLATE_ALREADY_ACTIVE
        description: Como máximo una versión activa por aplicación, clave e idioma.

  TemplateVariable:
    persisted: true

  Notification:
    persisted: true
    naturalKey: [applicationKey, dedupeKey]
    indexes:
      - [recipient, requestedAt]
      # El barrido reclama por estado cada minuto: sin índice, el lote de «aceptados» se busca
      # recorriendo todos los envíos que ya salieron, que es casi toda la tabla.
      - [status, requestedAt]
      # Índice sobre un campo de COLECCIÓN. No cabe en la tabla de la entidad —los
      # elementos viven en la tabla hija—, pero build genera esa hija entera, así que
      # lo materializa en su @CollectionTable. Sin él, «¿a esta dirección le llegó
      # algo en copia?» recorre una tabla que crece con cada envío.
      - [copyRecipients]

# Tiempos, sí: saber cuándo se escribió cada fila es lo primero que pregunta quien opera un
# envío que no llegó. Pero no los lee ningún cliente —las marcas que importan al contrato
# (requestedAt, sentAt, publishedAt) ya son campos del dominio—, así que van invisibles.
# Autoría, no: todos los autores son sistemas, y la atribución que tiene valor de negocio ya es
# un dato del dominio (applicationKey en Notification, la relación a Application en Template).
# Un createdBy con el client_id repetiría eso con peor nombre, y en el camino por evento sería
# el centinela 'system' en todas las filas.
audit:
  timestamps: all
  authorship: none

consistency:
  transactionalBoundary: per-operation
  optimisticLocking: all

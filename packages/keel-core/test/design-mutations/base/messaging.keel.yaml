channels:
  ticketEvents:
    description: Hechos del ciclo de vida de los tickets.

publishing:
  reliability: best-effort
  events:
    TicketClosed:
      channel: ticketEvents
      description: Un ticket se cerró.
      payload:
        ticketId: { type: uuid, required: true }

subscriptions:
  TicketEscalated:
    description: El equipo de guardia pide que se anote la escalada de un ticket.
    source: oncall
    nature: request
    channel: ticketEvents
    payload:
      ticketId: { type: uuid, required: true }
      level: { type: int, required: true }
    contract:
      envelope: keel
    triggers: noteEscalation
    input:
      ticketId: ticketId
      level: level
    # Sin reintentos: noteEscalation no tiene guarda en el dominio, así que el listener reclama el
    # mensaje antes de despacharlo y reintentar no ejecutaría nada (CHK-MSG-RETRY-AFTER-CLAIM).
    onFailure:
      deadLetter: true

# Capa dependencies — de qué otros servidores depende este servicio.
#
# Hay DOS formas de depender de otro, y se declaran por separado:
#   needs        → le LEO un dato: qué dato, quién lo necesita (usedBy), dónde vive la
#                  verdad que se lee (strategy) y qué pasa cuando falta (onMiss).
#   activations  → le PIDO que haga algo: qué trabajo, quién lo dispara (triggeredBy),
#                  por qué canal (via), qué efecto tiene y qué pasa si no sale.
# El corte: "¿me llevo un dato suyo, o le dejo un trabajo?". Al leer, el proveedor no
# sabe que existimos; al activarlo, somos NOSOTROS los que nos acoplamos a su firma de
# entrada. Un mismo proveedor puede aparecer de las dos formas en un solo bloque.
#
# Regla de la capa: REFERENCIA, nunca redeclara.
#   - el método, la ruta, el timeout y la resiliencia de la llamada → http-clients
#   - el payload, el contrato de recepción y el retry/DLQ del evento → messaging
#   - los campos de la copia local → domain;  dónde se guarda → persistence
#   - el error de negocio en sí → use-cases (errors de la operación)
#
# Recuerda declarar la capa en service.keel.yaml → layers.dependencies.

dependencies:
  # catalog:
  #   description: Fuente de verdad de productos y precios.
  #   contract:
  #     version: "0.2.0"                     # versión del contrato del proveedor a la que nos acoplamos
  #     source: contracts/catalog/INTEGRATION.md
  #   needs:
  #     productPricing:
  #       description: Precio y estado del producto al construir un pedido.
  #       usedBy: [createOrder, repriceOrder]      # operaciones de use-cases que lo necesitan
  #       strategy: replicated                     # on-demand | replicated
  #       fetchedFrom:                             # llamada de http-clients que resuelve el dato
  #         client: catalog                        # obligatorio con on-demand y con onMiss: fetch
  #         call: getProductsByIds
  #       replica:                                 # obligatorio y exclusivo de replicated
  #         entity: ProductSnapshot                # entidad de domain que materializa la copia
  #         keyField: productId                    # correlaciona la copia con el id del proveedor
  #         fedBy: [ProductCreated, ProductUpdated]  # suscripciones que la mantienen al día
  #         freshness: Un precio de hasta cinco minutos vale para cotizar; para cobrar, no.
  #         onMiss:
  #           action: fetch                        # fetch | fail | degrade
  #           # error: PRICE_UNAVAILABLE           # obligatorio y exclusivo de action: fail
  #           # degradedTo: Se cotiza sin descuento y se marca el pedido para revisión.
  #   compensations:
  #     - onEvent: OrderPaymentFailed              # suscripción existente en messaging
  #       description: Al fallar el cobro se revierte la reserva hecha contra catalog.
  #       # undoes: reserveStock                   # activación de este proveedor que se deshace
  #     # La operación que la ejecuta vive en messaging: subscriptions.<evento>.triggers, y
  #     # tiene dos obligaciones que `keel validate` comprueba: NO poder aplicarse dos veces
  #     # (contract.messageId, idempotency, o una transición de lifecycle irrepetible —
  #     # deshacer dos veces el mismo trabajo no es deshacerlo) y devolver con `transitions`
  #     # el estado propio que movió el trabajo que se encargó.
  #
  # notifications:
  #   description: Servicio de avisos. No le leemos nada: le pedimos que envíe.
  #   contract:
  #     version: "1.2.0"
  #     source: contracts/notifications/INTEGRATION.md
  #   activations:
  #     sendOrderConfirmation:
  #       description: El aviso al comprador es trabajo de notifications, no nuestro.
  #       triggeredBy: [confirmOrder]              # operaciones de use-cases que lo disparan
  #       via: { publishes: DeliveryRequested }    # evento propio de messaging: publishing…
  #       # via: { client: notifications, call: sendEmail }   # …o llamada de http-clients
  #       effect: Sale un correo de confirmación hacia el comprador.
  #       awaits: nothing                          # outcome | acknowledgement | nothing
  #       # onFailure:                             # obligatorio solo con via de http-clients
  #       #   action: degrade                      # fail | degrade | ignore
  #       #   degradedTo: El pedido se confirma y el aviso se reintenta aparte.

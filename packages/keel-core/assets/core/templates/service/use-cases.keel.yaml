  #   description: Recupera un producto por su id.
  #   kind: query
  #   input:
  #     fields:
  #       id: { type: uuid, required: true }
  #   output: { entity: Product }
  #   # exclude admite dot-path para no exponer campos de una entidad hija o value object:

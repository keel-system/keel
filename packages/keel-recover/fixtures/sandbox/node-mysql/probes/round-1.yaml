# Ronda 1 del legacy de fixture con MySQL: las sondas de node-postgres y dos más de lo que solo tiene MySQL.
# La puerta (scripts/probe-check.js --database=mysql) sabe qué tiene que grabar cada una.
x-steps:
  create: &create { name: alta, request: { method: POST, path: /items, body: { sku: a, quantity: 2 } } }
probes:
  - id: Q-001
    why: lectura sin efectos
    steps: [ { name: listado, request: { method: GET, path: /items } } ]
  - id: Q-002
    why: "alta: el artículo, su movimiento, la fila del trigger en movement_log y los tres AUTO_INCREMENT"
    steps: [ *create, { name: lectura, request: { method: GET, path: /items/a } } ]
  - id: Q-003
    why: alta inválida, sin nada en la base
    steps: [ { name: alta-sin-sku, request: { method: POST, path: /items, body: { quantity: 1 } } } ]
  - id: Q-004
    class: repeat
    why: "el mismo sku dos veces: la UNIQUE rechaza el segundo, que aun así consume un AUTO_INCREMENT (M-03)"
    steps: [ *create, *create ]
  - id: Q-005
    class: lifecycle
    why: "agotar el artículo lo pasa a SOLD (el ENUM lo declara) y rellena la fecha que era cero; sacar más se rechaza"
    steps:
      - *create
      - { name: sacar-todo, request: { method: POST, path: /items/a/take, body: { n: 2 } } }
      - { name: sacar-mas, request: { method: POST, path: /items/a/take, body: { n: 1 } } }
      - { name: lectura, request: { method: GET, path: /items/a } }
  - id: Q-006
    class: concurrency
    why: "dos salidas de una unidad a la vez (lee, comprueba y escribe sin bloqueo: con las dos juntas se pierde una)"
    repeat: 10
    outcome: quantity
    steps: [ *create ]
    then_parallel:
      - { name: sacar-1, request: { method: POST, path: /items/a/take, body: { n: 1 } } }
      - { name: sacar-2, request: { method: POST, path: /items/a/take, body: { n: 1 } } }
    after:
      - { name: lectura, request: { method: GET, path: /items/a } }
  - id: Q-007
    class: collation
    why: "el mismo sku con otra caja: la collation _ci de la UNIQUE los hace iguales y el segundo es un 409 (M-07)"
    steps:
      - *create
      - { name: alta-mayusculas, request: { method: POST, path: /items, body: { sku: A, quantity: 1 } } }
      - { name: lectura-mayusculas, request: { method: GET, path: /items/A } }
  - id: Q-008
    why: "una salida de un artículo que ya estaba: la fila cambia, y updated_at con ella sin que el flujo la nombre (M-09)"
    steps: [ { name: sacar-uno, request: { method: POST, path: /items/seed-1/take, body: { n: 1 } } } ]
  - id: Q-009
    class: overflow
    why: "un sku de 70 caracteres en una columna de 64: con el sql_mode del servidor (sin STRICT_TRANS_TABLES) se trunca, el alta sale 201 con el sku entero y luego no se encuentra (M-08)"
    steps:
      - { name: alta-larga, request: { method: POST, path: /items, body: { sku: oooooo-012345678901234567890123456789012345678901234567890123456789abc, quantity: 1 } } }
      - { name: lectura-larga, request: { method: GET, path: /items/oooooo-012345678901234567890123456789012345678901234567890123456789abc } }

# Paso 0c: sandbox del legacy de fixture con PostgreSQL. Red interna: el runtime no sale a internet.
name: rec-fixture-pg
services:
  app:
    container_name: rec-fixture-pg-app
    # la imagen la construye build.sh (con red); aquí solo se ejecuta
    image: localhost/recover/fixture-pg:sandbox
    environment:
      DATABASE_URL: postgres://postgres:postgres@stock-db:5432/stock
      NODE_V8_COVERAGE: /coverage
      RECOVER_ROUTES_OUT: /coverage/keel-recover-routes.json
      NODE_OPTIONS: --require /recover/v8-coverage-exit.cjs --require /recover/express-routes.cjs
    volumes: ["cov:/coverage", "./instrument:/recover:ro,Z"]
    networks: { sandbox: { aliases: [stock] } }
    depends_on: [stock-db]
  stock-db:
    # postgres 16.6, la de su CI (.github/workflows/ci.yml)
    container_name: rec-fixture-pg-db
    image: docker.io/library/postgres:16.6@sha256:2c70671424b21cc706545c364bc96d12ea1526d6080e29abf7e25b50b28ba97b
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock
    networks: { sandbox: { aliases: [stock-db] } }
  tool:
    container_name: rec-fixture-pg-tool
    image: docker.io/curlimages/curl:8.10.1@sha256:fcff5cf7a4b895da7bd2933c914938db2b05d2113fa0d6c55b6d29930408f661
    command: ["sleep", "infinity"]
    networks: [sandbox]
networks:
  sandbox: { internal: true }
volumes:
  cov: {}

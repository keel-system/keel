kind: sandbox
schema: 1
compose: compose.yaml
app:
  service: app
  base: http://orders:4100
  startup_seconds: 120
tool:
  service: tool
database:
  service: orders-db
  tech: mongodb
  name: shop
broker:
  service: rabbitmq
  tech: rabbitmq
  api: http://rabbitmq:15672/api
stubs:
  service: payment
  admin: http://payment:8080/__admin
  hosts: [http://payment:8080]
mail:
  service: mail
  api: http://mail:8025/api/v1
  smtp: mail:1025
coverage:
  kind: v8
  dir: /coverage
  include: /app/src/
introspection:
  routes: { kind: express, file: /coverage/keel-recover-routes.json }
judge:
  read: { method: GET, path: /api/orders, expect: [200] }
  write: { method: POST, path: /api/orders, body: { customer: verify, email: "verify-{{nonce}}@shop.invalid", amount: 1 }, expect: [201] }

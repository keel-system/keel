    observable: "POST /reservations con 5 asientos → 400; dos peticiones de 4 → 200 las dos"
    expect: "la regla con su parámetro y sus dos escenarios"
    status: read
  - id: ST-RULE-02
    category: rule
    fact: "Solo se reservan asientos libres de la función indicada: si alguno está reservado, es de otra función o no existe, se rechaza la petición entera con 400."
    evidence: "service/ReservationService.java:46-52; resources/mybatis/mappers/SeatMapper.xml:28-36"
    observable: "POST /reservations con un asiento ya reservado o de otra función → 400"
    expect: "regla e invariante con su escenario"
    status: read
  - id: ST-RULE-03
    category: rule
    fact: "Cancelar exige que todas las reservas indicadas sean del usuario y de esa función y espectáculo; libera los asientos y borra las reservas."
    evidence: "service/ReservationService.java:57-72; resources/mybatis/mappers/ReservationMapper.xml:11-28; SeatMapper.xml:37-49"
    observable: "DELETE /reservations con una reserva ajena → 400; con las propias → 200 y asientos libres"

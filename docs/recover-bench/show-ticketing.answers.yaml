  # ── Errores ─────────────────────────────────────────────────────────────────
  - id: ST-ERR-01
    category: error
    fact: "El cuerpo de error de negocio es `{message, content}`, donde `content` es `uri=<ruta>` (WebRequest.getDescription(false)). Las validaciones de Bean Validation caen en el manejador por defecto de Boot (otra forma de cuerpo)."
    evidence: "model/responses/ExceptionResponse.java:6-14; tool/advice/*.java"
    observable: "cualquier 4xx de negocio frente a un 400 de validación"
    expect: "dos formas de error grabadas; el contrato del cable las reescribe como fix declarado"
    status: read
  - id: ST-ERR-02
    category: error
    fact: "Casi todo el negocio responde 400: no existe, ya existe (salvo el usuario), solape, cupo superado, sin precios. Solo el usuario duplicado y la sesión ya abierta dan 409, y la falta de sesión o de rol dan 401."
    evidence: "tool/advice/PerformanceExceptionAdvice.java:20-80; VenueExceptionAdvice.java:20-53; ReservationExceptionAdvice.java:18-37; PickExceptionAdvice.java:16-21; AuthenticationExceptionAdvice.java:16-56"
    observable: "un 404 de negocio llega como 400"
    expect: "códigos medidos por flujo; cambiarlos a 404/409 es fix con su flujo"
    status: read
  - id: ST-ERR-03
    category: error
    fact: "GET /performances sin espectáculos (o con un showType sin ninguno) responde 400 «no existe» en vez de una lista vacía: antes de listar comprueba que exista alguno."
    evidence: "service/PerformanceService.java:312-321; resources/mybatis/mappers/PerformanceMapper.xml:130-144"
    observable: "GET /performances con la base vacía → 400"
    expect: "keep a sabiendas o fix con su flujo; el juez de verify no puede usarla de lectura con la base vacía (ST-ENV-07)"
    status: read
  - id: ST-ERR-04
    category: error
    fact: "hipótesis: un valor de enumerado desconocido (userType 3, showType=9 en la query, ratingType 4) lanza AssertionError, que es un Error y no una Exception: ningún manejador lo recoge y responde 500."
    evidence: "model/enumerations/UserType.java:17-27; ShowType.java:18-30; tool/converter/StringToShowTypeConverter.java:10-14"
    observable: "GET /performances?showType=9 → 500"
    expect: "fix declarado (400) con su flujo"
    status: read
  - id: ST-ERR-05
    category: error
    fact: "hipótesis: una ruta inexistente responde 500 y no 404. El interceptor de sesión hace `(HandlerMethod) handler` sin comprobar el tipo, y para una ruta sin controlador el handler es el de recursos estáticos: ClassCastException."
    evidence: "tool/interceptor/LoginCheckInterceptor.java:27-29; config/WebMvcConfig.java:25-28"
    observable: "GET /no-existe → 500"
    expect: "fix declarado con su flujo; la superficie de introspección no ve rutas fantasma"
    status: read
  - id: ST-ERR-06
    category: error
    fact: "hipótesis: las entradas sin validar acaban en 500: POST /reservations sin seatIds (NPE) o con [] (`WHERE id IN ()`, error de sintaxis de MySQL); POST /performances sin venueId o hallId (int a 0, violación de FK sin manejador)."
    evidence: "model/reservation/ReservationRequest.java:8-16; controller/ReservationController.java:22-26; model/performance/PerformanceRequest.java:35-39; resources/mybatis/mappers/SeatMapper.xml:28-36"
    observable: "esas tres peticiones → 500"
    expect: "fix declarados (400) con sus flujos"
    status: read

  # ── Seguridad ───────────────────────────────────────────────────────────────
  - id: ST-SEC-01
    category: security
    fact: "Sesión de servidor guardada en Redis (Spring Session), por cookie; una anotación por método exige sesión y, opcionalmente, rol GENERAL o MANAGER. Los roles son excluyentes: un MANAGER no puede reservar ni marcar favoritos, y un GENERAL no gestiona."
    evidence: "config/RedisSessionConfig.java:14-37; tool/interceptor/LoginCheckInterceptor.java:26-51; tool/annotation/UserAuthenticationNecessary.java:10-16"
    observable: "POST /reservations con sesión de MANAGER → 401"
    expect: "roles del diseño con su matriz; las credenciales del contract-map son `la propia API` (login con cookie)"
    status: read
  - id: ST-SEC-02
    category: security
    fact: "Escalada de privilegios en el alta: el cliente elige `userType` en POST /users, así que cualquiera se registra como MANAGER."
    evidence: "kotlin/model/user/UserRequest.kt:37-38; resources/mybatis/mappers/UserMapper.xml:6-9"
    observable: "POST /users con userType 2 y login → {\"userType\":2} (si el alta funciona: ST-DEF-01)"
    expect: "fix decidido con su flujo, o keep a sabiendas; nunca en silencio"
    status: read
  - id: ST-SEC-03

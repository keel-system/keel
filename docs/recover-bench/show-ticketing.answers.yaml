# Hoja de respuestas de show-ticketing. Ver README.md: qué es cada campo y cómo se puntúa.
# Escrita leyendo el código el 2026-10-26; todas las filas en `read` hasta que una corrida las mida.
# Es el legacy del banco para MySQL (PLAN-KEEL-RECOVER-MYSQL.md, incremento M0): las filas M-* de ese plan
# se contestan aquí con id ST-*, y la columna `note` de cada una dirá con qué versión se midió.
# Rutas de evidencia relativas a src/main/java/com/show/showticketingservice/ salvo que empiecen por:
#   kotlin/…    → src/main/kotlin/com/show/showticketingservice/…
#   resources/… → src/main/resources/…
#   la raíz del repo (pom.xml, Jenkinsfile, etc/…, src/test/…)

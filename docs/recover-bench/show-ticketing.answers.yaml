  - id: ST-ENV-06
    category: environment
    fact: "No hay seed: el DDL de etc/ no trae INSERT, la app no crea el esquema (MyBatis, sin ORM) y nada carga datos. El esquema lo tiene que cargar el sandbox desde etc/, y los datos de partida solo salen de la API (ST-SEC-02, ST-DEF-01)."
    evidence: "etc/show_ticketing_service.sql:1-116 (solo CREATE); resources/application.properties:1-12"

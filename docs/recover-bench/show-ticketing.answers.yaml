  # ── Concurrencia ────────────────────────────────────────────────────────────
  - id: ST-CONC-01
    category: concurrency
    fact: "hipótesis: doble venta. Reservar cuenta los asientos libres y después hace `UPDATE seat SET reserved = TRUE` sin `FOR UPDATE` y sin condición sobre `reserved`; con REPEATABLE READ (default de InnoDB) y sin transacciones (ST-ENV-09), dos reservas simultáneas del mismo asiento pasan las dos y dejan dos filas de reserva."
    evidence: "service/ReservationService.java:39-52; resources/mybatis/mappers/SeatMapper.xml:21-36"
    observable: "sonda repetida: N peticiones paralelas del mismo asiento con el pool caliente; desenlaces y diff"
    expect: "la distribución medida (outcomes); la decisión §3.9 se pregunta; el regenerado no la reproduce si se decide fix"
    status: read
  - id: ST-CONC-02
    category: concurrency
    fact: "hipótesis: carrera de alta de usuario. La unicidad de userId es un SELECT EXISTS antes del INSERT y no hay UNIQUE: dos altas simultáneas del mismo id crean dos usuarios, y el login de ese id falla después (getUserByUserId espera una fila)."
    evidence: "kotlin/service/UserService.kt:23-31; resources/mybatis/mappers/UserMapper.xml:6-20; etc/show_ticketing_service.sql:2-12"
    observable: "altas paralelas del mismo id; después POST /login → 500 (TooManyResultsException)"
    expect: "la carrera medida y su consecuencia; fix con unicidad en la base"
    status: read
  - id: ST-CONC-03
    category: concurrency
    fact: "hipótesis: carreras iguales en favoritos (pick duplicado) y en nombres de recinto o de espectáculo: comprobación y escritura separadas, sin restricción."
    evidence: "service/PickService.java:22-36; service/VenueService.java:31-44; service/PerformanceService.java:51-60"
    observable: "POST /picks paralelos del mismo espectáculo → dos filas"
    expect: "medidas; fix con unicidad declarada"
    status: read

  # ── Defectos ────────────────────────────────────────────────────────────────
  - id: ST-DEF-01
    category: defect
    fact: "hipótesis: el alta de usuario no funciona. UserRequest es una data class de Kotlin sin constructor vacío, el pom no trae jackson-module-kotlin ni kotlin-reflect, y kotlinc no emite los nombres de parámetro sin `-java-parameters`: Jackson no puede construirla y POST /users responde 400 siempre. Se pasó a Kotlin cinco días antes del último commit (#129) y la prueba que lo cubría (UserControllerTest) está excluida del build."
    evidence: "kotlin/model/user/UserRequest.kt:10-40; pom.xml:94-104,123-168; src/test/java/com/show/showticketingservice/controller/UserControllerTest.java:57-60; git log: «[#129] 자바와 코틀린 코드를 별도 디렉토리로 분리» (2021-08-19)"
    observable: "POST /users con un cuerpo válido → 400 (HttpMessageNotReadableException en el log)"
    expect: "si se mide: frontera o fix decidido, y los usuarios de las sondas sembrados en la base (con el hash BCrypt) como adaptación con motivo; nadie da por buena el alta sin grabarla"
    status: read
  - id: ST-DEF-02
    category: defect
    fact: "Borrar un usuario borra en cascada sus reservas y favoritos, pero sus asientos se quedan con `reserved = TRUE` para siempre."
    evidence: "kotlin/service/UserService.kt:54-63; etc/show_ticketing_service.sql:107-116 (reservation → user ON DELETE CASCADE; seat.reserved sin tocar)"
    observable: "diff de POST /my-infos/unregister de un usuario con reservas; GET /seats sigue dándolos por ocupados"
    expect: "fix con su flujo"
    status: read
  - id: ST-DEF-03
    category: defect
    fact: "Colisión de claves en la caché de plazas libres: la clave es `#performanceId + #perfTimeId`, una SUMA de enteros, así que (1,5) y (2,4) comparten entrada durante el TTL de 3 s."
    evidence: "service/PerformanceService.java:356-361; service/ReservationService.java:53-60"
    observable: "GET /performances/1/times/5 y, antes de 3 s, GET /performances/2/times/4 → la respuesta de la primera"
    expect: "fix con su flujo (la caché del diseño lleva la clave compuesta)"
    status: read
  - id: ST-DEF-04
    category: defect
    fact: "La duración máxima de 24 h se calcula restando los números yyyyMMddHHmmss (MAX_SCHEDULE_TIME = 24_00_00): una función que cruza la medianoche (23:00 → 01:00) da 780000 y se rechaza como «más de 24 h»."
    evidence: "service/PerformanceService.java:30,182-200"
    observable: "POST /performances/{id}/times con 20210824230000 → 20210825010000 → 400"
    expect: "fix con su flujo"
    status: read
  - id: ST-DEF-05
    category: defect
    fact: "La ventana de ±1 día contra las funciones guardadas es aritmética de enteros sobre DATE en MySQL (`DATE(x) - 1`, `DATE(x) + 1`): el 1 de agosto da 20210800 y no ve el 31 de julio, así que en el borde de mes no detecta un solape."
    evidence: "resources/mybatis/mappers/PerformanceTimeMapper.xml:19-33"
    observable: "una función el 31 a las 23:00-02:00 y otra el 1 a las 00:30 en la misma sala → la segunda se acepta"
    expect: "fix con su flujo; solo se ve contra MySQL real (la semántica es del motor)"
    status: read
  - id: ST-DEF-06
    category: defect
    fact: "Reservar no invalida la caché de asientos ni la de plazas libres (cancelar sí): hasta 3 s después, GET /seats y las plazas libres siguen mostrando libres los asientos recién reservados."
    evidence: "service/ReservationService.java:39-49 (sin @CacheEvict) frente a 53-60; service/SeatService.java:19-23"
    observable: "GET /seats, POST /reservations y GET /seats antes de 3 s"

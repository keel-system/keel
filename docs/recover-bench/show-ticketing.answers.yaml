  - id: ST-ENV-07
    category: environment
    fact: "No hay actuator ni endpoint de salud; la lectura pública más barata es GET /performances, que con la base vacía NO da 200 (ST-ERR-03). El juez necesita una lectura de negocio que sí conteste con base vacía, o sembrar antes."
    evidence: "pom.xml:22-107 (sin actuator); controller/PerformanceController.java:62-66"
    observable: "GET /actuator/health → 404"
    expect: "sandbox.yaml con una sonda de lectura que dé 200 en el estado de partida"

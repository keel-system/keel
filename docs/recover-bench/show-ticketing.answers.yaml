    fact: "Las funciones de un mismo envío no pueden solaparse entre sí ni empezar antes de terminar; tampoco con las ya guardadas en la misma sala en una ventana de ±1 día; y una función no puede durar más de 24 h (ver ST-DEF-04 y ST-DEF-05)."
    evidence: "service/PerformanceService.java:93-200; resources/mybatis/mappers/PerformanceTimeMapper.xml:19-33"
    observable: "POST /performances/{id}/times con solapes → 400 con su mensaje"

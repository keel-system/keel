  - id: ST-ENV-08
    category: environment
    fact: "hipótesis: el driver 8.0.x de Boot 2.4.2 habla caching_sha2_password, el default de MySQL 8, así que no hace falta el plugin nativo (pregunta M-12 del plan de MySQL)."
    evidence: "pom.xml:5-10,53-56"
    observable: "arranque contra mysql:8.0 sin tocar el plugin de autenticación"
    expect: "environment.yaml no lleva la adaptación del plugin si no hace falta"
    status: read
  - id: ST-ENV-09
    category: environment
    fact: "hipótesis: no hay gestor de transacciones. Hay cuatro beans DataSource (master, slave, routing y lazyRouting) y ninguno es @Primary, así que DataSourceTransactionManagerAutoConfiguration (@ConditionalOnSingleCandidate) no crea ninguno, TransactionAutoConfiguration no activa la gestión de transacciones y todos los @Transactional se ignoran: cada sentencia de MyBatis se confirma sola."
    evidence: "config/DataSourceConfig.java:20-58; config/MyBatisConfig.java:20-30; ausencia de @Primary y de TransactionManager en src/main"
    observable: "log del arranque (ningún DataSourceTransactionManager) y los efectos parciales de ST-EFF-02 y ST-EFF-03"
    expect: "la herramienta no asume atomicidad por leer @Transactional: la atomicidad que entra en el diseño es la que el diff de las sondas muestra"
    status: read
  - id: ST-ENV-10
    category: environment
    fact: "hipótesis: la réplica nunca se usa. El enrutado elige SLAVE solo si la transacción en curso es de solo lectura (RoutingDataSource), y sin gestor de transacciones (ST-ENV-09) nunca hay una; además MyBatis usa `routingDataSource` directo y no el proxy perezoso. El sandbox puede apuntar las dos URL a la misma base sin cambiar lo observable, pero solo si se mide."
    evidence: "tool/util/datasource/RoutingDataSource.java:20-28; config/MyBatisConfig.java:21; config/DataSourceConfig.java:55-58"
    observable: "con réplica real y replicación parada: una lectura después de una escritura ve el dato (va al maestro)"
    expect: "environment.yaml justifica una sola base con la medida, o monta la réplica; no la quita sin decirlo"
    status: read


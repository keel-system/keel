# Hoja de respuestas de shop-api. Ver README.md: qué es cada campo y cómo se puntúa.
# Escrita leyendo el código el 2026-10-23; todas las filas en `read` hasta que una corrida las mida.
# El legacy es SOLO `backend/` (el `frontend/` Angular del mismo repo es un activo: un cliente de la API).
# Rutas de evidencia relativas a backend/src/main/java/me/zhulin/shopapi/ salvo que digan otra cosa
# (`backend/…` o `frontend/…` cuando salen del árbol de Java).
legacy: shop-api
repo: https://github.com/zhulinn/SpringBoot-Angular7-Online-Shopping-Store

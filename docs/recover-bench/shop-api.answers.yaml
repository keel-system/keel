  # ── Modelo (introspección relacional) ──────────────────────────────────────
  - id: SA-MODEL-01
    category: model
    fact: "Hibernate crea 6 tablas (users, cart, product_info, product_category, order_main, product_in_order) y UNA secuencia compartida, hibernate_sequence, para todos los @GeneratedValue."
    evidence: "entity/*.java (GenerationType.AUTO); backend/src/main/resources/application.yml:15"
    observable: "information_schema.tables y pg_sequences"
    expect: "surface.yaml → data.tables con las 6; la secuencia se ve y no se confunde con una entidad"
    status: measured
    note: "information_schema: las 6 tablas y una sola secuencia, hibernate_sequence, con incremento 1"
  - id: SA-MODEL-02
    category: model
    fact: "cart comparte la clave primaria con users (@MapsId): su PK es user_id y a la vez FK a users(id). Uno a uno, el carrito nace con el usuario."
    evidence: "entity/Cart.java:20-29; service/impl/UserServiceImpl.java:48-53"
    observable: "information_schema: PK y FK sobre la misma columna; diff de /register: una fila en users y otra en cart"
    expect: "persistence/domain: el carrito es parte del usuario (o hija 1:1), no un agregado independiente con id propio"
    status: measured
    note: "cart.user_id es a la vez PRIMARY KEY y FOREIGN KEY a users(id) (NO ACTION); el registro de prueba creó users.id=1 y cart.user_id=1"
  - id: SA-MODEL-03
    category: model
    fact: "product_in_order es a la vez línea de carrito y línea de pedido: FK cart_user_id → cart y FK order_id → order_main, las dos anulables; el checkout la MUEVE de una a otra."
    evidence: "entity/ProductInOrder.java:25-33; service/impl/CartServiceImpl.java:93-98"
    observable: "information_schema (dos FK anulables); diff del checkout: UPDATE de cart_user_id a NULL y de order_id"
    expect: "el diseño separa línea de carrito y línea de pedido (o lo decide por escrito); la tabla compartida no se copia sin decisión"
    status: measured
    note: "S1-030: las dos líneas del carrito acaban con cart_user_id null y order_id del pedido nuevo"
  - id: SA-MODEL-04
    category: model
    fact: "product_in_order.product_id y product_info.category_type son referencias por valor SIN clave foránea: borrar un producto o una categoría no toca nada más."
    evidence: "entity/ProductInOrder.java:36-37,59-60; entity/ProductInfo.java:52-54"
    observable: "information_schema (sin FK); diff de DELETE /seller/product/{id}/delete"
    expect: "referencias entre agregados sin integridad referencial, `measured` por el diff"
    status: measured
    note: "information_schema: sin FK en product_id ni category_type. S1-045: borrar F0001 no toca ninguna línea, y cancelar el pedido que la contiene se salta su stock sin error"
  - id: SA-MODEL-05
    category: model
    fact: "La línea copia nombre, descripción, icono, categoría, precio y stock del producto en el momento de AÑADIRLA al carrito (instantánea), no al pagar."
    evidence: "entity/ProductInOrder.java:78-87; api/CartController.java:60-62"
    observable: "cambiar el precio tras añadir al carrito y antes del checkout: el pedido usa el viejo"
    expect: "regla de instantánea explícita en el diseño, con su momento; decisión keep/fix"
    status: measured
    note: "S1-031: añadir B0001 a 30, subir el precio a 99 y pagar: el pedido sale de 30"
  - id: SA-MODEL-06
    category: model
    fact: "Unicidades: users.email (@NaturalId) y product_category.category_type (@NaturalId) llevan restricción única; product_info.product_id es la PK y es un código de negocio que pone el cliente (B0001), no generado."
    evidence: "entity/User.java:28-30; entity/ProductCategory.java:26-27; entity/ProductInfo.java:24-25"
    observable: "information_schema (UNIQUE); registro duplicado (SA-ERR-03)"
    expect: "naturalKey/indexes únicos en persistence; el id de producto como clave asignada por el cliente"
    status: measured
    note: "UNIQUE en users.email y en product_category.category_type; product_info.product_id es la PK (varchar 255)"
  - id: SA-MODEL-07
    category: model
    fact: "Las columnas de estado son enteros sin CHECK ni ENUM: order_main.order_status (0 NEW, 1 FINISHED, 2 CANCELED, default 0) y product_info.product_status (0 UP, 1 DOWN, default 0). Los significados solo están en el código."
    evidence: "enums/OrderStatusEnum.java:6-9; enums/ProductStatusEnum.java:9-11; entity/OrderMain.java:59-61; entity/ProductInfo.java:46-49"
    observable: "information_schema (int4 con default 0, sin CHECK); valores distintos en el seed: {0,1,2} y {0,1}"
    expect: "introspección los marca como columnas de estado por su forma; el lifecycle sale de los flujos, y los NOMBRES de estado son `read` (del enum), no `measured`"
    status: measured
    note: "order_status integer NOT NULL default 0, product_status integer anulable default 0, ninguna de las dos con CHECK; valores en el seed {0,1,2} y {0,1}"
  - id: SA-MODEL-08
    category: model
    fact: "hipótesis: tipos por defecto de Hibernate: varchar(255) para todo texto, numeric(19,2) para precios e importes, timestamp sin zona, bool para users.active."
    evidence: "entity/*.java (sin @Column)"
    observable: "information_schema.columns"
    expect: "persistence con escala 2 en dinero; varchar(255) NO se convierte en una regla de negocio de longitud máxima sin decisión"
    status: measured
    note: "confirmado: varchar(255), numeric(19,2), timestamp without time zone, boolean. Ver SA-MODEL-11 para la nulabilidad"
  - id: SA-MODEL-09
    category: model
    fact: "El pedido copia los datos del comprador (email, nombre, teléfono, dirección) al crearse: cambiar el perfil después no cambia los pedidos."
    evidence: "entity/OrderMain.java:69-73"
    observable: "PUT /profile tras un checkout y GET /order/{id}"
    expect: "regla de instantánea del comprador en el diseño"
    status: measured
    note: "S1-021: tras cambiar nombre y dirección, GET /order/2147483642 sigue con customer1 y 3200 West Road"
  - id: SA-MODEL-10
    category: model
    fact: "Los ids del seed están junto a 2^31 (2147483640-2147483649) y la secuencia empieza en 1: las filas nuevas tienen ids pequeños y, al ser una sola secuencia, no correlativos dentro de una tabla."
    evidence: "backend/src/main/resources/import.sql:6-13,67-70; entity/OrderMain.java:30-33"
    observable: "dos registros seguidos y un checkout: ids 1, 2, 3… repartidos entre users, cart, order_main y product_in_order"
    expect: "la normalización trata los ids generados como volátiles; restaurar el snapshot devuelve también la secuencia (si no, la segunda ejecución da otros ids)"
    status: measured
    note: "los registros de prueba recibieron ids 1, 2, 3 junto a los del seed (2147483641…); pg_restore --clean devuelve hibernate_sequence a last_value=1 y la misma sonda vuelve a dar el mismo id"
  - id: SA-MODEL-11
    category: model
    fact: "Hibernate lleva Bean Validation al DDL de forma desigual: @Min se convierte en CHECK (product_info.product_stock >= 0, product_in_order.product_stock >= 0, product_in_order.count >= 1) y @NotNull en NOT NULL, pero @NotEmpty no deja rastro: users.email, buyer_email y el resto de textos @NotEmpty son anulables en la base."
    evidence: "entity/ProductInfo.java:36-38; entity/ProductInOrder.java:71-75; entity/User.java:28-30; information_schema"
    observable: "pg_constraint (contype c) e information_schema.columns.is_nullable"
    expect: "el diseño toma la obligatoriedad de los textos de la validación (o de los flujos), no de la nulabilidad de la columna; los CHECK son evidencia measured de cotas"
    status: measured
    note: "medido el 2026-10-23 en el esquema que crea Hibernate 5.4.6"
    found_by: operator

  # ── Reglas ──────────────────────────────────────────────────────────────────
  - id: SA-RULE-01
    category: rule
    fact: "Checkout: una transacción crea el pedido (estado 0, importe = Σ precio×cantidad de las líneas), mueve las líneas del carrito al pedido y descuenta el stock de cada producto; responde 200 sin cuerpo y sin el id del pedido."
    evidence: "service/impl/CartServiceImpl.java:85-100; api/CartController.java:84-89"
    observable: "diff: INSERT order_main, UPDATE product_in_order, UPDATE product_info"
    expect: "operación checkout con sus tres efectos y la respuesta vacía (decisión: keep o devolver el pedido)"
    status: measured
    note: "S1-030: checkout 200 con cuerpo vacío; pedido NEW de 170 (5×30 + 2×10), stock de B0001 y C0001 descontado, carrito vacío después"
  - id: SA-RULE-02
    category: rule
    fact: "Ciclo de vida del pedido: solo desde NEW se pasa a FINISHED (finish) o a CANCELED (cancel); cualquier otra transición lanza ORDER_STATUS_ERROR."
    evidence: "service/impl/OrderServiceImpl.java:67-101; backend/src/test/java/me/zhulin/shopapi/service/impl/OrderServiceImplTest.java:63-130"
    observable: "finish y cancel sobre pedidos del seed en los tres estados"
    expect: "lifecycle de Order con NEW → FINISHED | CANCELED, estados terminales, `measured`"
    status: measured
    note: "S1-043: finish de NEW 200 y luego cancel 500; finish de FINISHED y cancel de CANCELED 500 «Status is not correct». S1-042: el cliente cancela su propio pedido NEW (200)"
  - id: SA-RULE-03
    category: rule
    fact: "Cancelar devuelve al stock la cantidad de cada línea cuyo producto todavía existe; si el producto se borró, la línea se salta en silencio."
    evidence: "service/impl/OrderServiceImpl.java:92-98"
    observable: "diff de cancel: UPDATE product_info.product_stock; y cancel tras borrar un producto"
    expect: "compensación del stock en el diseño, con el caso del producto borrado decidido"
    status: measured
    note: "S1-044: cancelar 2147483649 sube en 1 el stock de C0001, C0002, F0001 y F0002. S1-045: con F0001 borrado, las otras tres"
  - id: SA-RULE-04
    category: rule
    fact: "Añadir al carrito un producto que ya está suma las cantidades en la misma línea."
    evidence: "service/impl/CartServiceImpl.java:55-59"
    observable: "POST /cart/add dos veces con el mismo productId"
    expect: "regla de fusión en el diseño"
    status: measured
    note: "S1-030: añadir B0001 ×2 y ×3 deja una línea con count 5"
  - id: SA-RULE-05
    category: rule
    fact: "Los listados incluyen los productos en DOWN (findAll, no findUpAll; el filtro está comentado) y GET /product/{id} también los devuelve: el estado DOWN no oculta nada."
    evidence: "service/impl/ProductServiceImpl.java:41-44; api/ProductController.java:37-48"
    observable: "GET /api/product incluye B0003 (DOWN en el seed)"
    expect: "el diseño NO filtra por estado en las lecturas salvo decisión `fix`"
    status: measured
    note: "S1-001: la primera página es B0001, B0002 y B0003 (en DOWN); S0-015: GET /product/B0003 → 200 con el producto"
  - id: SA-RULE-06
    category: rule
    fact: "Ni añadir al carrito ni el checkout miran product_status: se puede comprar un producto en DOWN."
    evidence: "api/CartController.java:58-67; service/impl/CartServiceImpl.java:85-100"
    observable: "añadir B0003 y pagar"

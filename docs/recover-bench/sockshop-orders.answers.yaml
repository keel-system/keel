  - id: OR-OUT-04
    category: effect
    fact: "El timeout es de http.timeout (5 s) POR cada Future.get, no total. RestTemplate no tiene timeout propio, así que un saliente colgado retiene un hilo para siempre. El executor de @Async es el SimpleAsyncTaskExecutor por defecto (un hilo nuevo por tarea, sin límite)."
    evidence: "controllers/OrdersController.java:46, OrderApplication.java:8, config/RestProxyTemplate.java:24-26"
    observable: "WireMock con un retraso de 6 s da 500 \"...due to timeout from one of the services.\""

  # ── Concurrencia y repetición ───────────────────────────────────────────────
  - id: OR-CONC-01
    category: concurrency
    fact: "POST /orders no es idempotente. Repetirlo cobra dos veces, crea dos envíos y guarda dos pedidos."
    evidence: "controllers/OrdersController.java:50-125"
    observable: "la sonda de repetición deja dos llamadas a payment y dos a shipping en WireMock y dos documentos"
    expect: "decisión estructural `observed` (sin idempotencia) → pregunta `omitted` con su riesgo"
    status: measured
    note: "recordings/round-1/O1-008 y O1-009: dos pedidos y 12 llamadas salientes (dos cobros, dos envíos)"
  - id: OR-CONC-02
    category: concurrency
    fact: "No hay campo de versión. PUT/PATCH concurrentes sobre /orders/{id}: gana el último."
    evidence: "entities/CustomerOrder.java"
    observable: "la sonda de concurrencia da 200 y 200"
    expect: "decisión `observed`"
    status: refuted
    note: "PUT y PATCH dan 400 siempre (recordings/round-1/O1-005): no hay escritura concurrente posible que «gane»"

  # ── Defectos (candidatos a `fix`) ───────────────────────────────────────────
  - id: OR-DEF-01
    category: defect
    fact: "El envío se pide ANTES de guardar el pedido y sin compensación. Si el save falla, queda un envío (y un cobro) sin pedido. Tampoco se compensa el cobro si shipping falla."
    evidence: "controllers/OrdersController.java:100-117"
    observable: "la sonda con Mongo parado tras el pago deja la llamada a shipping hecha y ningún pedido"
    expect: "`fix` (orden o compensación decididos); escenario de caracterización del comportamiento actual"
    status: measured
    note: "recordings/round-1/O1-016: base caída → paymentAuth y shipping llamados y 500 sin pedido; O1-014: shipping 500 con el pago ya hecho, sin compensación"
  - id: OR-DEF-02
    category: defect
    fact: "Guarda y DEVUELVE el número de tarjeta completo (longNum) y el CCV en el pedido."
    evidence: "entities/Card.java:10-12, entities/CustomerOrder.java"
    observable: "la respuesta del POST y del GET /orders/{id} llevan ccv"
    expect: "`fix` obligado (PCI); nunca `keep`"
    status: measured
    note: "recordings/round-1/O1-001: la respuesta lleva longNum y ccv"
  - id: OR-DEF-03
    category: defect
    fact: "PUT/PATCH/DELETE /orders/{id} expuestos sin autenticación permiten reescribir o borrar cualquier pedido."
    evidence: "repositories/CustomerOrderRepository.java:11"
    observable: "ver OR-SURF-02 y OR-SEC-01"
    expect: "`fix` (quitar las operaciones o protegerlas)"
    status: refuted
    note: "PUT/PATCH no reescriben (400 siempre); sí se puede BORRAR sin autenticación: ver OR-DEF-07"
  - id: OR-DEF-04
    category: defect
    fact: "SSRF. El servicio hace GET a cualquier URL que mande el cliente."
    evidence: "controllers/OrdersController.java:60-75"
    observable: "customer apuntando a un host interno del compose"
    expect: "`fix`"
    status: measured
    note: "recordings/round-1/O1-017"
  - id: OR-DEF-05
    category: defect
    fact: "Importes en float."
    evidence: "entities/CustomerOrder.java (total), entities/Item.java (unitPrice)"
    observable: "ver OR-RULE-01"
    expect: "`fix` a decimal"
    status: measured
    note: "ver OR-RULE-01"


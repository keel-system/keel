    expect: "input con los cuatro obligatorios; la @URL sin aplicar, como hecho"
    status: measured
    note: "recordings/round-1/O1-002: 406; O1-003: un campo que no es URL da 500 \"unspecified IO error\", no 406"
  - id: OR-RULE-05

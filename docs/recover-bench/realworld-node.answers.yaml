    category: model
    fact: "User tiene username (minúsculas, único, obligatorio, ^[a-zA-Z0-9]+$), email (minúsculas, único, obligatorio, /\\S+@\\S+\\.\\S+/), bio, image, favorites[Article], following[User], hash, salt y timestamps."
    evidence: "models/User.js:7-17"
    observable: "índices únicos en la colección users; documentos tras POST /api/users"
    expect: "entidad User con sus constraints; hash y salt nunca expuestos en api"

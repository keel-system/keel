    note: "índices únicos username_1 y email_1 en users; recordings/round-1/R1-002: username y email inválidos → 422"
  - id: RW-MODEL-02
    category: model
    fact: "Article tiene slug (minúsculas, único), title, description y body (ninguno obligatorio), favoritesCount (default 0), comments[Comment], tagList[String], author→User y timestamps."
    evidence: "models/Article.js:6-15"
    observable: "POST /api/articles con body vacío crea un artículo (sin 422)"
    expect: "entidad Article; title/description/body opcionales (o decisión `fix` si se exigen)"

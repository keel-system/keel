# Hoja de respuestas de realworld-node. Ver README.md: qué es cada campo y cómo se puntúa.
# Escrita leyendo el código el 2026-10-22; todas las filas en `read` hasta que el inc. 1 las mida.
legacy: realworld-node
repo: https://github.com/gothinkster/node-express-realworld-example-app
commit: ba04b70c31af81ca7935096740a6e083563b3a4a
assets:          # entrada: está en el repo y la herramienta la ve
  - tests/api-tests.postman.json   # 31 peticiones, newman; env en tests/env-api-tests.postman.json
external_oracles: # fuera del repo: la herramienta no la ve
  - especificación RealWorld de enero de 2018

facts:
  # ── Entorno (paso 0) ────────────────────────────────────────────────────────
  - id: RW-ENV-01
    category: environment
    fact: "Fuera de producción la URI de Mongo está fija en `mongodb://localhost/conduit`; solo con NODE_ENV=production se lee MONGODB_URI."
    evidence: "app.js:33-37"
    observable: "arrancar sin NODE_ENV=production en un contenedor sin Mongo en localhost no conecta"
    expect: "environment.yaml registra NODE_ENV=production + MONGODB_URI como adaptación, con motivo"
    status: read
    note: "no probado: el sandbox fijó NODE_ENV=production desde el principio (RW-ENV-02 obligó a dar SECRET); el modo desarrollo queda en unobserved.yaml (U-RW-01)"
  - id: RW-ENV-02
    category: environment
    fact: "El secreto del JWT es 'secret' fuera de producción y process.env.SECRET en producción; en producción sin SECRET el middleware no tiene secreto."
    evidence: "config/index.js:2"
    observable: "con NODE_ENV=production y sin SECRET, toda ruta autenticada falla (hipótesis: error al montar express-jwt o 500 por petición)"
    expect: "environment.yaml fija SECRET de prueba; nunca uno de producción"
    status: measured
    note: "NODE_ENV=production sin SECRET: el proceso muere al arrancar con \"secret should be set\" (express-jwt)"
  - id: RW-ENV-03
    category: environment
    fact: "El modo cambia el cuerpo del error. Fuera de producción `error` lleva el objeto y se imprime el stack (errorhandler); en producción `error` es {}."
    evidence: "app.js:29-31, app.js:58-79"
    observable: "el mismo 500 o 401 da cuerpos distintos según NODE_ENV"
    expect: "las sondas se graban en un único modo, declarado en environment.yaml; los escenarios no afirman el campo `error`"
    status: measured
    note: "en producción el cuerpo del error lleva error:{} (recordings/round-1/R1-003, R1-007); el modo desarrollo no se ejecutó (U-RW-01)"
  - id: RW-ENV-04
    category: environment
    fact: "No hay lockfile. Las dependencias directas están en versión exacta, pero las transitivas y las devDependencies (^) flotan."
    evidence: "package.json"
    observable: "dos builds en fechas distintas resuelven árboles distintos"
    expect: "el sandbox genera y conserva un lockfile y lo declara como adaptación"
    status: refuted
    note: "hay yarn.lock en la raíz; la hoja solo buscó *.js. yarn install --frozen-lockfile funciona con node 8.5.0"
  - id: RW-ENV-05
    category: environment
    fact: "No declara versión de Node (ni engines, ni .nvmrc). Las dependencias son de 2016 (express 4.13, mongoose 4.4), así que el candidato es Node 6 u 8."
    evidence: "package.json"
    observable: "solo por lectura de las fechas de las dependencias, o probando versiones"
    expect: "runtime.yaml con la versión elegida y su motivo (`read`), o `asked`"
    status: refuted
    note: "la versión está en la CI del repo: .circleci/config.yml (circleci/node:8.5.0, circleci/mongo:3.4.9) y .travis.yml (node_js 8)"
  - id: RW-ENV-06
    category: environment
    fact: "hipótesis: mongoose 4.4.10 (driver mongodb 2.1) solo funciona entero contra MongoDB 3.4 o anterior. En 3.6 se retiró $pushAll, que mongoose 4.4 usa en push() de arrays, y en 5.1+/6.0 se retiró OP_QUERY."
    evidence: "models/User.js:62-65, routes/api/articles.js:257-259"
    observable: "contra Mongo ≥3.6 la app arranca y las lecturas responden, pero favorite, follow y comment dan 500. Solo lo destapa una sonda que escriba en un array"
    expect: "environment.yaml fija la imagen de Mongo con motivo; si la herramienta elige Mongo moderno, las sondas de esas rutas tienen que salir en rojo, no grabarse como comportamiento"
    status: measured
    note: "mongo:3.6 → app arriba, lecturas y altas bien, favorite 500 \"Unknown modifier: $pushAll\"; mongo:7.0 → todo 500 (OP_QUERY); 3.4.9 funciona"
  - id: RW-ENV-07
    category: environment
    fact: "No hay endpoint de salud."
    evidence: "routes/"
    observable: "ninguna ruta de salud en la tabla del router"
    expect: "verify (0f) usa una ruta de lectura sin efectos (GET /api/tags) y lo declara"
    status: measured
    note: "la tabla del router no tiene ruta de salud; el juez usó GET /api/tags"
  - id: RW-ENV-08
    category: environment
    fact: "express-session con MemoryStore está montado y ninguna ruta lo usa. En producción avisa por consola de que MemoryStore no es para producción."
    evidence: "app.js:27"
    observable: "aviso en el log de arranque; ninguna respuesta pone cookie (saveUninitialized false)"
    expect: "no aparece en el diseño (código muerto); como mucho, en las notas del sandbox"
    status: measured
    note: "aviso de MemoryStore en el log de arranque"

  # ── Superficie ──────────────────────────────────────────────────────────────
  - id: RW-SURF-01
    category: surface
    fact: "Diecinueve rutas bajo /api. users (4) POST /users, POST /users/login, GET /user, PUT /user; profiles (3) GET /profiles/:username, POST /profiles/:username/follow, DELETE /profiles/:username/follow; articles (11) GET /articles, GET /articles/feed, POST /articles, GET/PUT/DELETE /articles/:slug, POST/DELETE /articles/:slug/favorite, GET/POST /articles/:slug/comments, DELETE /articles/:slug/comments/:id; tags (1) GET /tags."
    evidence: "routes/api/*.js"
    observable: "tabla del router de Express (app._router.stack)"
    expect: "surface.yaml con las 19; cada una con su operación en use-cases y su endpoint en api"
    status: measured
    note: "tabla del router leída del proceso (tools/express-routes.js): las 19 rutas"
  - id: RW-SURF-02
    category: surface
    fact: "method-override acepta la cabecera X-HTTP-Method-Override, así que un POST puede actuar como PUT o DELETE en cualquier ruta."
    evidence: "app.js:24"
    observable: "POST /api/articles/:slug con X-HTTP-Method-Override DELETE borra el artículo"
    expect: "hallazgo de la frontera o decisión `fix` (el DSL no tiene sobreescritura de método); nunca ignorado en silencio"
    status: measured
    note: "recordings/round-1/R1-035: POST con X-HTTP-Method-Override DELETE da 204 y el artículo desaparece (404)"
  - id: RW-SURF-03
    category: surface
    fact: "CORS abierto a cualquier origen."
    evidence: "app.js:17"
    observable: "Access-Control-Allow-Origin * en toda respuesta"
    expect: "registrado en security o como decisión"
    status: measured
    note: "access-control-allow-origin * en todas las respuestas, también con Origin ajeno (recordings/round-1/R1-036)"


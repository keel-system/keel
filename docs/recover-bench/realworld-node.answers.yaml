    expect: "dos documentos en una operación; la no atomicidad, como hecho del legacy"
    status: measured
    note: "diff de recordings/round-1/R1-013"
  - id: RW-EFF-02
    category: effect
    fact: "Favorite y unfavorite escriben en User.favorites y después en Article.favoritesCount."
    evidence: "routes/api/articles.js:197-225"
    observable: "diff con dos colecciones"
    expect: "operación con dos efectos"
    status: measured
    note: "recordings/round-1/R1-023"

  # ── Concurrencia y repetición ───────────────────────────────────────────────
  - id: RW-CONC-01
    category: concurrency
    fact: "La unicidad la comprueba primero mongoose-unique-validator (lee y luego escribe), así que dos registros iguales en paralelo hacen que uno caiga en E11000 del índice, que NO se traduce a 422 y da 500."
    evidence: "models/User.js:19"
    observable: "la sonda de concurrencia con dos POST /api/users iguales da 200 y 500"
    expect: "decisión estructural `observed` (unicidad con carrera mal traducida) → `fix`"
    status: measured
    note: "recordings/round-1/R1-022 repetida: un registro gana siempre y el otro sale 500 (E11000) o 422 según la tanda; distribución inestable"
  - id: RW-CONC-02
    category: concurrency
    fact: "hipótesis: dos favorite en paralelo de usuarios distintos pueden dejar un favoritesCount desfasado (cada uno cuenta y guarda, y gana la última escritura)."
    evidence: "models/Article.js:33-38"
    observable: "sonda de concurrencia y después leer el artículo"
    expect: "decisión `observed`/`omitted` sobre concurrencia en el contador"
    status: refuted
    note: "recordings/round-1/R1-023: 20 de 20 con favoritesCount correcto en el sandbox (sin latencia app-base); queda en unobserved.yaml como carrera posible no observada (U-RW-02)"
  - id: RW-CONC-03
    category: concurrency
    fact: "No hay bloqueo optimista en las rutas (ni __v comprobado en PUT). Dos PUT en paralelo sobre el mismo artículo: gana el último."
    evidence: "routes/api/articles.js:153-179"
    observable: "la sonda de concurrencia da 200 y 200"
    expect: "decisión estructural `observed` de último-gana"
    status: read
    note: "no se sondearon dos PUT en paralelo"
  - id: RW-CONC-04

    note: "recordings/round-1/R1-033: un artículo solo con title se crea (200)"
  - id: RW-MODEL-03
    category: model
    fact: "Comment tiene body (no obligatorio), author→User, article→Article y timestamps. La relación es bidireccional, porque Article.comments guarda también los ids."
    evidence: "models/Comment.js:2-6, models/Article.js:12"
    observable: "diff de la base tras POST comment, con dos documentos tocados"
    expect: "Comment como hija del agregado Article o agregado propio, decidido y con su motivo; la doble referencia, como hecho del legacy"
    status: measured
    note: "diff de recordings/round-1/R1-013: un documento en comments y su id en articles.comments"
  - id: RW-MODEL-04
    category: model
    fact: "favoritesCount es un dato desnormalizado; la verdad está en User.favorites."
    evidence: "models/Article.js:33-38"
    observable: "diff tras favorite, con dos colecciones tocadas"
    expect: "regla o invariante que lo diga; decisión de si el servicio nuevo lo deriva o lo guarda"
    status: measured
    note: "recordings/round-1/R1-023: favoritesCount cambia con los favoritos de los usuarios"

  # ── Reglas ──────────────────────────────────────────────────────────────────
  - id: RW-RULE-01
    category: rule
    fact: "El slug es slug(title) + '-' + seis caracteres base36 aleatorios, y solo se genera al crear. Cambiar el título con PUT no cambia el slug."
    evidence: "models/Article.js:22-29"
    observable: "PUT con title nuevo devuelve el mismo slug"
    expect: "regla del slug en el diseño; el sufijo aleatorio, normalizado en las grabaciones"
    status: measured
    note: "recordings/round-1/R1-030: el slug no cambia al cambiar el título"
  - id: RW-RULE-02
    category: rule
    fact: "favoritesCount se RECALCULA contando los usuarios que lo tienen en favorites; no se incrementa."
    evidence: "models/Article.js:33-38"
    observable: "solo distinguible del incremento con la sonda de concurrencia (RW-CONC-02)"
    expect: "regla con referencia al código"
    status: read
    note: "recalcular o incrementar dan la misma respuesta en todas las sondas (recordings/round-1/R1-020: el favorito repetido no suma): no distinguible desde fuera"
  - id: RW-RULE-03
    category: rule
    fact: "favorite y follow son idempotentes (indexOf antes del push), y unfavorite y unfollow de algo ausente no fallan."
    evidence: "models/User.js:61-91"
    observable: "la sonda de repetición devuelve lo mismo dos veces"
    expect: "decisión estructural `observed` de idempotencia natural en esas cuatro operaciones"
    status: measured
    note: "recordings/round-1/R1-020: favorite y follow repetidos, y unfavorite/unfollow de algo ausente, todos 200"
  - id: RW-RULE-04
    category: rule
    fact: "Un usuario puede seguirse a sí mismo y marcar como favorito su propio artículo."
    evidence: "routes/api/profiles.js:29-39, routes/api/articles.js:197-209"
    observable: "POST /api/profiles/<yo>/follow da 200 con following true"
    expect: "escenario de caracterización, candidato a `fix`"
    status: measured
    note: "recordings/round-1/R1-034"
  - id: RW-RULE-05
    category: rule
    fact: "Listado con filtros tag, author y favorited, limit (20) y offset (0) por defecto y sin máximo, y orden createdAt desc. articlesCount es el total sin paginar."
    evidence: "routes/api/articles.js:31-87"
    observable: "GET /api/articles?limit=1000 devuelve todo"
    expect: "query con filtros y paginación; falta de límite máximo como hecho o `fix`"
    status: measured
    note: "recordings/round-1/R1-031: limit=1000 aceptado; tag filtra"
  - id: RW-RULE-06
    category: rule
    fact: "Si `author` nombra un usuario que no existe, el filtro se IGNORA y devuelve todos los artículos. Con `favorited` de un usuario inexistente, en cambio, devuelve lista vacía."
    evidence: "routes/api/articles.js:51-64"
    observable: "GET /api/articles?author=nadie devuelve todos"
    expect: "escenario de caracterización; candidato a `fix` (RW-DEF-04)"
    status: measured
    note: "recordings/round-1/R1-031: author=nadie → todos (articlesCount 1); favorited=nadie → 0"
  - id: RW-RULE-07
    category: rule
    fact: "El feed son los artículos de los autores seguidos, paginado igual que el listado pero SIN orden."
    evidence: "routes/api/articles.js:89-123"
    observable: "orden no determinista entre ejecuciones (lo absorbe la normalización o se declara)"
    expect: "query feed; el orden ausente, declarado"
    status: read
    note: "el feed sin orden no se sondeó con más de un artículo"
  - id: RW-RULE-08
    category: rule
    fact: "Los tags son el distinct de tagList sobre todos los artículos; no hay entidad Tag."
    evidence: "routes/api/tags.js:6-10"
    observable: "borrar el último artículo con un tag lo hace desaparecer"
    expect: "query derivada, sin entidad"
    status: measured
    note: "recordings/round-2/R2-002: tras cambiar tagList a [t9], GET /api/tags devuelve solo t9"
  - id: RW-RULE-09
    category: rule
    fact: "Los comentarios se listan por createdAt desc."
    evidence: "routes/api/articles.js:227-246"
    observable: "dos comentarios, el último primero"
    expect: "orden en la query"
    status: measured
    note: "recordings/round-2/R2-003: [\"dos\",\"uno\"]"
  - id: RW-RULE-10
    category: rule
    fact: "La contraseña es pbkdf2 sha512 con 10000 iteraciones, 512 bytes y sal de 16 bytes. El login busca por email SIN pasarlo a minúsculas."
    evidence: "models/User.js:20-28, config/passport.js:10"
    observable: "registrar A@x.com y entrar con A@x.com da 422 (guardado como a@x.com)"
    expect: "el algoritmo, como hecho (`read`) para migrar credenciales; el login sensible a mayúsculas, como defecto (RW-DEF-01)"
    status: measured
    note: "recordings/round-1/R1-006: registro con Carol@X.io; login con Carol@X.io → 422, con carol@x.io → 200"
  - id: RW-RULE-11
    category: rule
    fact: "PUT /api/user actualiza solo los campos presentes, incluida la contraseña, y devuelve un token nuevo."
    evidence: "routes/api/users.js:15-40"
    observable: "PUT con solo bio no toca el resto"
    expect: "operación de actualización parcial"
    status: measured
    note: "recordings/round-1/R1-036 (bio, image, password) y recordings/round-2/R2-004 (username)"
  - id: RW-RULE-12
    category: rule
    fact: "Un perfil sin imagen se devuelve con la URL por defecto https://static.productionready.io/images/smiley-cyrus.jpg, pero el usuario autenticado (toAuthJSON) devuelve image null."
    evidence: "models/User.js:42-58"
    observable: "GET /api/profiles/x frente a GET /api/user del mismo usuario"
    expect: "escenario de caracterización con las dos formas"
    status: refuted
    note: "recordings/round-1/R1-010: GET /api/user NO devuelve image:null, el campo no viene (undefined no se serializa). Ver RW-RULE-14"
  - id: RW-RULE-13
    category: rule
    fact: "La búsqueda de perfil por username distingue mayúsculas, pero el username se guarda en minúsculas."
    evidence: "routes/api/profiles.js:7-14, models/User.js:8"
    observable: "registrar Alice y pedir GET /api/profiles/Alice da 404"
    expect: "escenario de caracterización"
    status: measured
    note: "recordings/round-1/R1-008: registrar Dave; /api/profiles/Dave → 404, /api/profiles/dave → 200"

  # ── Errores ─────────────────────────────────────────────────────────────────
  - id: RW-ERR-01
    category: error
    fact: "Un error de validación de mongoose da 422 {errors:{<campo>:<mensaje>}}, con los mensajes \"can't be blank\", \"is invalid\", \"is already taken.\" (usuario) e \"is already taken\" (slug, sin punto)."
    evidence: "routes/api/index.js:8-18, models/User.js:19, models/Article.js:17"
    observable: "registro duplicado o con username inválido"
    expect: "errors con code, http 422 y mensaje exacto"
    status: measured
    note: "recordings/round-1/R1-001 (\"is already taken.\"), R1-002 (\"is invalid\"); recordings/round-2/R2-004 (email repetido en PUT → 422)"
  - id: RW-ERR-02
    category: error
    fact: "Un login fallido da 422 {errors:{\"email or password\":\"is invalid\"}}, y uno sin email o sin password, 422 con \"can't be blank\"."
    evidence: "routes/api/users.js:42-61, config/passport.js:11-13"
    observable: "login con contraseña mala"
    expect: "error declarado"
    status: measured
    note: "recordings/round-1/R1-005"
  - id: RW-ERR-03
    category: error
    fact: "Hay dos formas de 404. Un slug, comentario o perfil inexistente da 404 con cuerpo de TEXTO \"Not Found\" (sendStatus); una ruta desconocida, 404 JSON {errors:{message:\"Not Found\",error:{}}}."
    evidence: "routes/api/articles.js:13, app.js:48-52"
    observable: "GET /api/articles/nope frente a GET /api/nope"
    expect: "los dos registrados; el de texto, conflicto con el contrato del cable de Keel → frontera o `fix`"
    status: measured
    note: "recordings/round-1/R1-007: \"Not Found\" text/plain frente a {errors:{message:\"Not Found\",error:{}}}"
  - id: RW-ERR-04
    category: error
    fact: "Sin token en una ruta auth.required da 401 JSON con message \"No authorization token was found\". Un token válido de un usuario que ya no existe da 401 de texto \"Unauthorized\"."
    evidence: "routes/auth.js:13-25, routes/api/users.js:9"
    observable: "sonda sin token, y sonda con el token de un usuario borrado en la base"
    expect: "security + errors"
    status: measured
    note: "recordings/round-1/R1-010 (sin token → 401 JSON) y R1-011 (token de usuario inexistente → 401 text/plain \"Unauthorized\")"
  - id: RW-ERR-05
    category: error
    fact: "Una petición sin el envoltorio esperado (sin `user`, `article` o `comment` en el cuerpo) revienta con TypeError, que da 500 o se queda colgada (RW-DEF-05)."
    evidence: "routes/api/users.js:63-71, routes/api/articles.js:158-170"
    observable: "POST /api/users con {} da 500"
    expect: "escenario de caracterización con `fix` (debería ser 422)"
    status: measured
    note: "recordings/round-1/R1-003: 500 \"Cannot read property 'username' of undefined\"; R1-030: PUT {} sin respuesta (RW-DEF-05)"
  - id: RW-ERR-06
    category: error
    fact: "hipótesis: POST /api/users sin password da 500, porque pbkdf2Sync recibe undefined."
    evidence: "routes/api/users.js:68, models/User.js:27"
    observable: "registro con solo username y email"
    expect: "escenario con `fix`"
    status: measured
    note: "recordings/round-1/R1-004: 500 \"Pass phrase must be a buffer\""
  - id: RW-ERR-07
    category: error
    fact: "Un id de comentario que no es un ObjectId da CastError, que acaba en 500."

    observable: "DELETE /api/articles/x/comments/no-es-id"
    expect: "escenario con `fix` (debería ser 404)"
    status: measured
    note: "recordings/round-0/newman.json: la colección del repo borra el comentario \"1\" → 500 \"Cast to ObjectId failed\""

  # ── Seguridad ───────────────────────────────────────────────────────────────
  - id: RW-SEC-01
    category: security
    fact: "JWT HS256 con claims id, username y exp (+60 días). Acepta los esquemas `Token` y `Bearer`, y solo de la cabecera Authorization."
    evidence: "models/User.js:30-39, routes/auth.js:4-11"
    observable: "la misma sonda con `Token x` y con `Bearer x` da lo mismo"
    expect: "security.authentication; los dos esquemas, como hecho (y decisión sobre si se mantienen)"
    status: measured
    note: "recordings/round-1/R1-010: Token y Bearer → 200, Basic → 401 (los claims, por lectura)"
  - id: RW-SEC-02
    category: security
    fact: "No hay roles. La autorización es por PROPIEDAD. Editar o borrar un artículo exige ser su autor (si no, 403 de texto \"Forbidden\"), y borrar un comentario exige ser su autor."
    evidence: "routes/api/articles.js:153-195, routes/api/articles.js:266-277"
    observable: "la sonda de autorización con un segundo usuario da 403"
    expect: "security con scoping o regla de propiedad por recurso"
    status: measured
    note: "recordings/round-1/R1-012 y R1-013: 403 text/plain \"Forbidden\""
  - id: RW-SEC-03
    category: security
    fact: "Las lecturas con auth.optional cambian la respuesta según haya token (favorited y following)."
    evidence: "routes/api/articles.js:31,141,227, routes/api/profiles.js:17"
    observable: "la misma sonda con y sin token"
    expect: "operación con identidad opcional"
    status: measured
    note: "recordings/round-1/R1-014: favorited y following cambian con y sin token"


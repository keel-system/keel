# Registro de decisiones estructurales (structural-decisions.md § 3). Tomadas al preparar la corrida del
# incremento 8 de keel-nest (2026-10-07), por delegación del diseñador, y reafirmadas en la v1.1.0 (incremento 6
# de PLAN-DSL-228-CICLO-DE-VIDA.md, 2026-11-12), que añade la § 3.13. En la v1.1.0 saveMyCard ya declara errores
# (EMAIL_ALREADY_EXISTS y CARD_ALREADY_EXISTS), así que la aceptación de CHK-USECASES-COMMAND-NO-ERRORS se fue.
structural:
  - section: '3.2'
    chosen: >-
      sin idempotency en saveMyCard: es un PUT que REEMPLAZA la ficha del titular, así que repetirlo
      deja el mismo estado y devuelve la misma ficha
    discarded: idempotency con keySource client-key
    reason: >-
      Un reintento tras un timeout no puede producir un segundo efecto: la ficha se identifica por el
      sub del token (naturalKey subject), y escribir dos veces el mismo contenido es escribirlo una. La
      única ventana es la de la PRIMERA escritura simultánea, que la clave natural rechaza con
      CARD_ALREADY_EXISTS (gaps.yaml, clase 4). deleteMyCard y restoreMyCard tampoco la necesitan: repetir
      un borrado o una restauración que ya se hizo da 404 CARD_NOT_FOUND y no cambia nada.
    since: 1.1.0
  - section: '3.3'
    chosen: sin caché en getMyCard
    discarded: cache con ttlSeconds e invalidatedBy saveMyCard
    reason: >-
      El titular lee su ficha justo después de guardarla, borrarla o restaurarla y espera ver lo que hizo:
      una respuesta cacheada le mentiría. Es una lectura por clave natural única; la caché no ahorraría nada
      que valga su invalidación.
    since: 1.1.0
  - section: '3.7'
    scope: persistence.consistency.transactionalBoundary
    chosen: per-aggregate
    discarded: per-operation
    reason: >-
      Cada operación toca una sola raíz (la ficha del titular) y no publica nada: no hay dos escrituras
      que tengan que confirmar juntas.
    since: 1.1.0
  - section: '3.9'
    scope: persistence.consistency.optimisticLocking
    chosen: none
    discarded: all
    reason: >-
      Las únicas escrituras concurrentes posibles son del MISMO titular sobre su propia ficha (dos
      pestañas guardando a la vez), y el reemplazo es entero: gana el último, que es lo que el titular
      vio por última vez. Un 409 le obligaría a reintentar para conseguir exactamente eso. Un borrado que
      cruza con un guardado de la otra pestaña tampoco lo arbitra una versión: el borrado marca la fila viva
      y el guardado que llega después crea otra (FL-CRD-005).
    since: 1.1.0
  - section: '3.9b'
    scope: persistence.audit.timestamps
    chosen: none
    discarded: all
    reason: >-
      Nadie pregunta cuándo se escribió una ficha de contacto: no hay operación que lo lea ni soporte que
      lo necesite, y la ficha la escribe siempre su propio titular. El momento del borrado sí importa, pero
      es la marca del generador que leen la ventana y la retención, no una columna de auditoría.
    since: 1.1.0
  - section: '3.9b'
    scope: persistence.audit.authorship
    chosen: none
    discarded: all
    reason: >-
      El autor de cada escritura es, por construcción, el titular de la ficha (subject): un createdBy
      repetiría el mismo sub con peor nombre.
    since: 1.1.0
  - section: '3.13'
    scope: persistence.entities.ContactCard.deletion
    chosen: logical
    discarded: physical
    reason: >-
      Restaurable durante 30 días (restoreMyCard, CARD_NOT_RESTORABLE) y purgada a los 30 días del borrado
      (retention from deleted, then delete); descartados también el borrado lógico sin ventana y el conservado
      indefinidamente.
      Deshacer: el titular se puede arrepentir de borrar su ficha, y un mes es lo que tarda en notarlo quien
      la borró por error. Cuánto se conserva: la ficha es enteramente datos personales (displayName y email),
      así que lo borrado no se guarda más allá de la ventana en la que se puede restaurar; a partir de ahí
      conservarla no sirve a nadie. Referencias: ningún otro agregado apunta a la ficha. La clave: el titular
      puede volver a crear su ficha y su correo queda libre mientras está borrada (FL-CRD-005, FL-CRD-006).
    since: 1.1.0

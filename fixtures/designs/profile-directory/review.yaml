# Revisión semántica de la v1.2.0 (DSL 2.29: el historial de cambios de la ficha y getMyCardHistory). Rehecha al
# migrar la fixture (incremento 6 de PLAN-DSL-229-HISTORIAL.md, 2026-11-13), sobre las capas enteras y no solo sobre
# lo nuevo: review.yaml caduca con el minor. La v1.1.0 (DSL 2.28) trajo el email, el borrado lógico y la retención.
reviewedBy: keel-design-review
reviewedAt: 1.2.0
findings:
  - id: REV-DOMAIN-PROMISED-STATE
    scope: domain.entities.ContactCard
    verdict: ok
    note: >-
      La prosa promete que una ficha borrada se puede restaurar durante 30 días: lo sostienen deletion logical,
      restorableFor y restoreMyCard, y la marca de borrado la pone el generador. Lo que getMyCardHistory promete
      (quién, cuándo y desde qué valor) lo guarda el almacén del historial, no un campo de la ficha. No hay otro
      verbo de conservación ni de ocultación sin campo detrás.
  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations.saveMyCard
    verdict: accepted
    note: >-
      saveMyCard se reintenta sin idempotency a propósito: reemplaza la ficha entera del titular,
      identificada por su naturalKey (subject), así que una repetición deja el mismo estado y devuelve
      la misma ficha. Tampoco ensucia el historial: un guardado sin diferencias no deja entrada (FL-CRD-008-B).
      deleteMyCard y restoreMyCard repetidos dan 404 CARD_NOT_FOUND sin efecto. Registro estructural § 3.2.
  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases.operations.restoreMyCard
    verdict: ok
    note: >-
      El orden de restoreMyCard es implementable con lo que hay en cada paso: buscar la borrada más reciente
      del titular (404), comparar su marca con la ventana (CARD_NOT_RESTORABLE) y solo entonces devolverla a
      viva, donde las dos unicidades responden con su 409 (CARD_ALREADY_EXISTS por el subject,
      EMAIL_ALREADY_EXISTS por el correo). Los escenarios no dependen de cuál de los dos 409 gana cuando chocan
      los dos: FL-CRD-005-B y FL-CRD-006-B provocan cada uno solo el suyo. getMyCardHistory solo tiene una
      guarda, la ficha viva del titular (404), que es la misma lectura que getMyCard.
  - id: REV-SEC-RESOURCE-SCOPE
    scope: security.authentication.callerIdentity
    verdict: ok
    note: >-
      El alcance no se da por hecho en prosa: cada titular opera sobre SU ficha porque la identidad la
      estampa el servidor desde el claim sub (callerIdentity) y la ficha se busca por ese subject, también
      al borrar, al restaurar y al leer su historial. No hay recursos de otros a los que acotar, así que
      tampoco ownership ni scoping con reads. FL-CRD-002 y FL-CRD-010-C lo afirman.
  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities.ContactCard
    verdict: ok
    note: >-
      Las cinco operaciones buscan por subject, que es la naturalKey (índice único entre vivas); la
      restauración busca la borrada por la misma clave. email es único y lleva su propio índice. La página del
      historial la lee el almacén del generador por su índice (tipo de raíz, id, instante).
  - id: REV-PERSONAL-CLASSIFICATION
    scope: domain.entities.ContactCard
    verdict: ok
    note: >-
      Los tres campos que hablan de una persona van marcados: displayName y email, que escribe el titular, y
      subject, el sub del token, que es un identificador seudónimo de esa persona y sigue siendo dato personal
      aunque no diga su nombre. id es un uuid del servidor que no identifica a nadie fuera de este servicio. Los
      tres viajan también al historial, con el régimen de la ficha: la purga se los lleva (FL-CRD-007-C).
  - id: REV-API-DELETE-BODY
    scope: api.endpoints.deleteMyCard
    verdict: ok
    note: >-
      deleteMyCard es void con 204: el cliente no necesita nada de vuelta, y lo que queda lo lee con getMyCard.
  - id: REV-HISTORY-SCOPE
    scope: persistence.audit.history
    verdict: ok
    note: >-
      La única raíz del servicio, ContactCard, lleva historial: es enteramente datos personales y su titular
      tiene que poder ver qué se cambió, cuándo y desde qué valor. No hay dinero ni estado regulado en otra
      raíz que se quede sin él.

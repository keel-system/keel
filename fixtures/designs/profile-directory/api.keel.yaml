style: rest
basePath: /api
endpoints:
  getMyCard:
    method: GET
    path: /me/card
  saveMyCard:
    method: PUT
    path: /me/card
    successStatus: 200
  deleteMyCard:
    method: DELETE
    path: /me/card
    successStatus: 204
  restoreMyCard:
    method: POST
    path: /me/card/restore
    successStatus: 204

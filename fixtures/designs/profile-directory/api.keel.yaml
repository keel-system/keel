style: rest
basePath: /api
pagination:
  style: offset
  defaultSize: 20
  maxSize: 100
endpoints:
  getMyCard:
    method: GET
    path: /me/card
  saveMyCard:
    method: PUT
    path: /me/card
    successStatus: 200
  deleteMyCard:
    method: DELETE
    path: /me/card
    successStatus: 204
  getMyCardHistory:
    method: GET
    path: /me/card/history
  restoreMyCard:
    method: POST
    path: /me/card/restore
    successStatus: 204

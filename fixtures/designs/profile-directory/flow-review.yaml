findings:
  - flow: FL-CRD-003-D
    step: "When"
    kind: unreachable-given
    artifact: security.roles
    evidence: >-
      El When usa «el token de un usuario autenticado sin ningún rol». security declara un solo rol
      (card-holder) y ninguna identidad sin rol: nada en el diseño garantiza que exista un sujeto
      autenticado que no lo tenga.
    proposal: >-
      Aceptarlo apoyándose en el proveedor de prueba (el realm siembra siempre un usuario sin roles, y
      es lo que hace observable el 403), o declarar en security un rol sin permisos solo para ejercitarlo.
    resolution: accepted
    reason: "Aceptado: «autenticado sin el permiso» es la ausencia de un rol, no una identidad de negocio
      que haya que declarar. El realm de prueba de los dos generadores siembra un usuario sin roles
      (no-role) precisamente para este 403, y un rol vacío en el diseño sería ruido en el catálogo."

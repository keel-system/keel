findings:
  - flow: FL-CRD-003-D
    step: "When"
    kind: unreachable-given
    artifact: security.roles
    evidence: >-
      Mismo hallazgo que la pasada 1, al que se llega por separado. El When usa «el token de un usuario
      autenticado sin ningún rol»; security declara un único rol (card-holder) y ninguna identidad
      autenticada sin rol. validation-scenarios.md (§ superficies, Auth) pide que las identidades que
      nombran los escenarios sean las que declara el diseño —«se nombran los de security.roles, o no
      hay token que emitir. Si el escenario necesita una identidad que el diseño no tiene […] lo que
      falta es declararla»—. CHK-SCEN-UNDECLARED-ROLE no salta porque el escenario no nombra ningún
      rol, sino su ausencia, así que el hueco queda fuera de la comprobación mecánica. Que el proveedor
      de prueba siembre un usuario sin roles es una convención del generador que el diseño no fija.
    proposal: >-
      Aceptarlo apoyándose en que el realm de prueba de los generadores siembra un usuario sin roles
      (y citarlo en las Convenciones de determinación, junto a los 401/403), o declarar en security un
      rol sin permisos solo para ejercitar el 403 y nombrarlo en el escenario.
    resolution: accepted
    reason: "Aceptado: «autenticado sin el permiso» es la ausencia de un rol, no una identidad de negocio. El realm de prueba de los dos generadores siembra un usuario sin roles (no-role) precisamente para este 403, y un rol vacío en el diseño sería ruido en el catálogo."

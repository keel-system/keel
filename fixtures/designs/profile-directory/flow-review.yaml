findings:
  - flow: FL-CRD-003-D
    step: "When"
    kind: unreachable-given
    artifact: security.roles
    evidence: >-
      El When usa «el token de un usuario autenticado sin ningún rol»; security declara un único rol
      (card-holder) y ninguna identidad autenticada sin rol. CHK-SCEN-UNDECLARED-ROLE no salta porque el
      escenario no nombra ningún rol, sino su ausencia. Que el proveedor de prueba siembre un usuario sin roles
      es una convención del generador que el diseño no fija. Mismo hallazgo que en la v1.0.0.
    proposal: >-
      Aceptarlo apoyándose en que el realm de prueba de los generadores siembra un usuario sin roles, o
      declarar en security un rol sin permisos solo para ejercitar el 403.
    resolution: accepted
    reason: "Aceptado, como en la v1.0.0: «autenticado sin el permiso» es la ausencia de un rol, no una identidad de negocio. El realm de prueba de los cuatro generadores siembra un usuario sin roles (no-role) precisamente para este 403."
  - flow: FL-CRD-007
    step: "Given"
    kind: unreachable-given
    artifact: persistence.entities.ContactCard.restorableFor
    evidence: >-
      El Given pide una ficha «borrada hace 31 días», y ninguna operación del diseño fija el momento del borrado:
      deleteMyCard lo estampa ahora. La marca la pone el generador (D1 de la 2.28) y no está en el contrato, y el
      arnés no trae un helper que la envejezca, como sí trae ageForDeadline para un plazo o ageForReconciliation
      para un barrido. Lo que hay son los genéricos dbSql y mongoEval, y la convención «edad de un borrado» dice
      que el arnés retrasa esa marca en la base.
    proposal: >-
      Aceptarlo: el agente de pruebas envejece la marca con dbSql o mongoEval sobre la columna o el campo que
      escribe build (deleted_at / deletedAt), igual que en las sondas LC-7 y RT-4 de los cuatro generadores. Si una
      corrida lo tropieza, el helper se añade al arnés de los cuatro como ageForDeadline.
    resolution: accepted
    reason: "Aceptado. Las corridas de control (incremento 7) dijeron que hacía falta el helper: tres de cinco nombraron mal la tabla con el SQL a mano. Desde entonces el arnés de los cuatro trae ageDeletion(<Entidad>, id, días), que toma la tabla del modelo y falla si la fila no estaba borrada."
  - flow: FL-CRD-007-B
    step: "When"
    kind: unobservable
    artifact: persistence.entities.ContactCard.retention
    evidence: >-
      La purga borra la fila entera, y desde la API una ficha purgada y una ficha que nunca existió se ven igual.
      Lo único observable es el cambio de desenlace de restoreMyCard: 409 CARD_NOT_RESTORABLE antes de la purga
      (FL-CRD-007) y 404 CARD_NOT_FOUND después. Si el barrido no llegara a correr, el Then 1 saldría rojo con el
      409, que es lo que hace del cambio una prueba y no una coincidencia.
    proposal: >-
      Aceptarlo: el par FL-CRD-007 / FL-CRD-007-B discrimina, y el Then 2 afirma que lo que no ha vencido sigue.
    resolution: accepted
    reason: "Aceptado: el 409 previo del mismo flujo es la línea base que hace observable la purga sin leer la base."

# El legacy emitía sus propios JWT (HS256, 60 días, esquemas Token y Bearer). El servicio nuevo valida los
# de un proveedor OIDC (decisions.yaml: fix-identity). El legacy NO tiene roles ni permisos (medido: toda
# ruta con token válido pasa; los únicos 403 son de propiedad, R1-012/R1-013): el acceso es «token válido»
# y la autorización por propiedad (autor del artículo o del comentario) va en ownership (DSL 2.23).
authentication:
  protocol: oidc
  tokenLocation: header
  callerIdentity:
    field: callerSubject
    from: { source: claim, name: sub }
    description: El titular es el claim sub del token; nunca sale del cuerpo ni de la ruta.

cors:
  description: Consumido desde el navegador por el frontend de Conduit (el legacy abría CORS a todo origen).
  allowCredentials: false
  allowedHeaders: [Authorization, Content-Type]

# Las cuatro lecturas que el legacy personaliza si llega un token (favorited, following; R1-014) son optional (DSL 2.27):
# sin token se ejecutan como públicas, con uno válido hay titular, y uno inválido o caducado es 401, nunca anónimo. Era la
# frontera F-OPTIONAL-AUTH.
access:
  default: { level: required }
  rules:
    getProfile:   { level: optional }
    listArticles: { level: optional }
    getArticle:   { level: optional }
    listComments: { level: optional }
    listTags:     { level: public }

# Solo el autor edita o borra su artículo, y solo el autor borra su comentario (medido: R1-012, R1-013; los
# únicos 403 del legacy). El dueño es el subject del perfil autor, el mismo valor que estampa callerIdentity.
ownership:
  Article:
    owner: author.subject
    error: NOT_ARTICLE_AUTHOR
    operations: [updateArticle, deleteArticle]
    # Los artículos los lee cualquiera (el feed es de los autores que sigues, no de los tuyos): ninguna lectura se acota
    # por el autor (DSL 2.27).
    reads: []
  Comment:
    owner: author.subject
    error: NOT_COMMENT_AUTHOR
    operations: [deleteComment]
    reads: []

keel: "2.23"
service:
  name: conduit
  version: 0.1.1
  description: >-
    Blog social (RealWorld/Conduit) recuperado del legacy node-express-realworld-example-app @ ba04b70:
    perfiles, artículos con etiquetas y favoritos, seguidores y comentarios. Identidad delegada en un
    proveedor OIDC (decisión fix-identity de decisions.yaml).
  domain: publishing
conventions:
  # El legacy omite el campo cuando no tiene valor (GET /api/user sin imagen: RW-RULE-14); el
  # contrato canónico decide aquí una sola forma para todo el servicio.
  nulls: include
layers:
  domain: domain.keel.yaml
  use-cases: use-cases.keel.yaml
  persistence: persistence.keel.yaml
  api: api.keel.yaml
  security: security.keel.yaml

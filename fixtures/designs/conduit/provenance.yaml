fixes:
  - id: fix-unique-409
    legacy: responde 422 a un username repetido
    reason: "una unicidad es un conflicto: el método exige 409 (decidido por el humano el 2026-10-22)"
    evidence: recordings/round-1/R1-001.json
  - id: fix-validation-400
    legacy: responde 422 a una entrada inválida
    reason: la validación de entrada es 400 en el contrato canónico (decidido por el humano el 2026-10-22)
    evidence: recordings/round-1/R1-002.json
  - id: fix-profile-case
    legacy: "busca el perfil distinguiendo mayúsculas: Alice da 404"
    reason: el username se guarda en minúsculas y se busca igual (decidido por el humano el 2026-10-22)
    evidence: recordings/round-1/R1-008.json
  - id: fix-author-filter
    legacy: con el filtro author de alguien que no existe devuelve todos los artículos
    reason: un filtro por un autor inexistente devuelve una página vacía (decidido por el humano el 2026-10-22)
    evidence: recordings/round-1/R1-031.json
  - id: fix-comment-ownership
    legacy: borra un comentario aunque no pertenezca al artículo de la ruta
    reason: el comentario se busca dentro de su artículo (decidido por el humano el 2026-10-22)
    evidence: recordings/round-1/R1-033.json
  - id: fix-delete-cascade
    legacy: deja huérfanos los comentarios y favoritos de un artículo borrado
    reason: el artículo se borra con su agregado (decidido por el humano el 2026-10-22)
    evidence: recordings/round-1/R1-032.json
    noFlow:
      why: "los huérfanos del legacy solo se ven en la base: un flujo HTTP no puede afirmarlos (decidido por el humano el 2026-10-22)"
      proof: "recordings/round-1/R1-032.json (diff de mongo: comments y favorites del artículo borrado siguen ahí)"
  - id: fix-feed-order
    legacy: el feed no ordena
    reason: el feed se ordena por createdAt descendente, como el listado (decidido por el humano el 2026-10-22); lo demuestra FL-FOL-004
    evidence: src/routes/api/articles.js:105
  - id: fix-page-max
    legacy: limit sin tope
    reason: la página tiene tamaño máximo (decisions.yaml); el defecto de 20 es el del legacy
    evidence: recordings/round-1/R1-031.json
    noFlow:
      why: "solo se ve con más artículos que la página máxima (101): un flujo que los cree no cabe en el documento de escenarios (decidido por el humano el 2026-10-22)"
      proof: "recordings/round-1/R1-031.json (limit=1000 aceptado); api.pagination.maxSize 100 en api.keel.yaml"
  - id: fix-identity
    legacy: emite sus propios JWT con usuario y contraseña (POST /api/users, /api/users/login)
    reason: la identidad se delega en un proveedor OIDC (decidido por el humano el 2026-10-22)
    evidence: recordings/round-1/R1-001.json
    noFlow:
      why: "es de arquitectura (dónde vive la credencial), no una respuesta distinta de una operación: la cubren los actores de contract-map.yaml en los dos lados (decidido por el humano el 2026-10-22)"
      proof: "decisión fix-identity; recordings/round-1/R1-001.json; FL-PRF-008 (mark new)"
frontier:
  - id: F-OPTIONAL-AUTH
    what: lecturas públicas que con token personalizan la respuesta (favorited, author.following)
    why: el DSL no tiene un nivel de acceso «opcional»; las lecturas quedan public y sin personalizar
    evidence: R1-014 (RW-SEC-03)
  - id: F-METHOD-OVERRIDE
    what: X-HTTP-Method-Override
    why: no es contrato expresable ni deseable; se elimina (fix)
    evidence: R1-035
  - id: F-WIRE
    what: envolturas {user}/{article}, errores {errors:{campo:msg}}, 404/403/401 en texto plano, limit/offset + articlesCount
    why: el contrato del cable lo fija el método (paridad semántica, contract-map.yaml)
    evidence: R1-001, R1-007, R1-012, R1-031

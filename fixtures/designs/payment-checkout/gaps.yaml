  - class: 18
    unit: charge
    what: "No dice cuánto espera el servicio a que el cliente se autentique ni quién cancela el cobro si
      no vuelve: el lifecycle no tiene salida de actionRequired (ni de pending) a canceled y
      cancelPayment exige authorized, así que pedidos no puede retirar un cobro en actionRequired de
      un pedido abandonado."
    severity: gap
    state: accepted
    reason: "Aceptado en v1.0.0 y vigente en v1.2.0: el plazo de la autenticación lo pone la pasarela,
      que da por fallido el cobro que el cliente no completa, y el barrido recoge ese desenlace. Un
      plazo propio más corto cancelaría cobros que el cliente aún puede completar."
  - class: 18
    unit: charge
    what: "El parámetro currency admite cualquier código de tres letras, aunque su descripción pide solo
      monedas de dos decimales: con una moneda de 0 o 3 decimales la escala 2 de todos los importes
      deja de ser la de la pasarela, y nada lo impide ni declara qué pasa."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.2.0: la moneda la elige quien despliega, y la descripción del parámetro dice
      que solo valen monedas de dos decimales. Las unidades menores de cada moneda las conoce el
      generador (la tabla de keel-core), así que el importe a la pasarela sale bien; lo que
      cambiaría es la escala de los importes del contrato, y eso es otra versión del diseño."
  - class: 18
    unit: charge
    what: "El cobro no guarda la moneda ni la llevan los eventos: un cambio del parámetro currency entre
      despliegues deja capturas, devoluciones y desenlaces de cobros anteriores sin decir en qué
      moneda estaban."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.1.0 y vigente en v1.2.0: la moneda es única por despliegue
      (service.parameters.currency) y cambiarla es una migración de datos fuera del servicio, no un
      cambio de configuración."
  - class: 18
    unit: charge
    what: "Por la suscripción, un mensaje con un chargeRequestId que ya tiene cobro se da por atendido
      aunque su orderId, payerId o amount sean otros: no dice si una referencia reutilizada con otro
      contenido es un duplicado o un error de pedidos, que entonces no recibe desenlace ni
      descarte."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.2.0: la referencia es de pedidos y reutilizarla con otro contenido es un
      error de pedidos, no de este servicio. El cobro de esa referencia ya existe y tiene su
      desenlace; el mensaje nuevo se confirma como duplicado (acknowledgeOn), igual que por HTTP
      responde CHARGE_ALREADY_REQUESTED."
  - class: 18
    unit: refund
    what: "No dice qué pasa con una devolución, captura o anulación hecha directamente en la pasarela
      (fuera del servicio): su aviso no tiene transición desde el estado del cobro, el desenlace es
      un no-op y el registro y pedidos se quedan creyendo lo contrario."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.1.0 y vigente en v1.2.0: el servicio es el único que actúa sobre la
      pasarela; operar desde su panel (devolver, capturar o anular a mano) queda fuera de alcance y
      no se reconcilia."

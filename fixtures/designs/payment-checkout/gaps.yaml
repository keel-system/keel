findings:
  - class: 2
    unit: capturePayment
    what: >-
      Solo dice qué pasa si la pasarela rechaza la captura porque la autorización caducó; si la
      rechaza por cualquier otro motivo, no hay error declarado ni estado al que vuelva el cobro
      (sale de capturing a authorized, a canceled, o se queda).
    severity: gap
    state: decided
    reason: >-
      Decidido en v1.1.0: si la pasarela rechaza la captura por otro motivo, el cobro vuelve a
      authorized, con awaitingSince vacío, y se responde CAPTURE_REJECTED (422), simétrico con
      REFUND_REJECTED (rule y transición capturing → authorized de capturePayment, FL-STL-001-B Then
      4).
  - class: 2
    unit: cancelPayment
    what: >-
      No dice qué responde ni a qué estado vuelve el cobro si la pasarela rechaza la anulación (la
      autorización ya caducó, o ya figura capturada en la pasarela): no hay un error de rechazo
      como el REFUND_REJECTED de refundPayment.
    severity: gap
    state: decided
    reason: >-
      Decidido en v1.0.0 y vigente: la anulación pasa por canceling; si la pasarela no la hace, el
      barrido devuelve el cobro a authorized (rule de sweepPendingPayments, FL-REC-002 Then 3), y un
      cobro que ya no está autorizado responde PAYMENT_NOT_CANCELABLE.
  - class: 3
    unit: Payment
    what: >-
      awaitingSince se describe como «desde cuándo el cobro espera un desenlace» y sale en las
      respuestas, pero el barrido lo vuelve a estampar al reclamar cada candidato, así que tras
      una pasada ya no dice desde cuándo espera sino cuándo se consultó por última vez.
    severity: risk
    state: decided
    reason: >-
      Decidido en v1.1.0: awaitingSince significa desde cuándo el cobro espera SIN RESPUESTA, y lo
      renueva cada consulta del barrido (description del campo en domain, docs/dsl/payments.md § El
      registro). No dice cuándo empezó la espera, y no lo pretende.
  - class: 4
    unit: requestCharge
    what: >-
      No dice si puede haber más de un cobro vivo (no failed ni canceled) por orderId: la guarda del
      doble cargo es solo chargeRequestId y orderId tiene un índice no único, así que dos
      referencias distintas para el mismo pedido se cobran las dos.
    severity: gap
    state: accepted
    reason: >-
      Aceptado en v1.0.0 y vigente: puede haber varios cobros por pedido a propósito —tras un
      failed, pedidos pide otro con otra referencia—. Qué cobro vale para un pedido es de pedidos
      (DESIGN.md § 6, «Varios cobros por pedido»); este servicio garantiza una sola ejecución por
      referencia.
  - class: 4
    unit: savePaymentMethod
    what: >-
      Con la respuesta de la pasarela perdida (503) el medio puede haber quedado guardado en la
      pasarela sin registro aquí, y reintentar con el mismo token —en general de un solo uso— lo
      rechaza; el diseño no dice cómo recupera pedidos ese medio ni qué pasa con el huérfano.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en v1.0.0 y vigente: un medio guardado en la pasarela sin registro propio no se puede
      cobrar por este servicio (no hay id que lo nombre) y no tiene coste; pedidos pide otro token
      al cliente y guarda otro medio.
  - class: 6
    unit: SavedPaymentMethod
    what: >-
      No hay ninguna forma de retirar un medio guardado, ni aquí ni en la pasarela: el cliente que
      quiere quitar su tarjeta, o un medio que ya no debe cobrarse, queda guardado y cobrable para
      siempre con su gatewayReference sensible.
    severity: gap
    state: accepted
    reason: >-
      Aceptado en v1.0.0 y vigente: retirar un medio guardado queda fuera (DESIGN.md § 6, «Sin
      retirar medios guardados en v1.x»). Solo pedidos puede cobrarlo y solo a nombre de su titular;
      un medio caducado lo rechaza la pasarela. Entra con el caso de uso de baja de cliente.
  - class: 7
    unit: subscriptions.ChargeRequested
    what: >-
      La regla de rechazo por evento solo cubre el medio de pago; un ChargeRequested cuyo importe o
      campos violan las cotas de requestCharge (más de dos decimales, importe menor de 0.01,
      referencias de más de 64) no dice si se reintenta, va a la DLQ o sale como PaymentFailed, y
      PaymentFailureReason no tiene motivo para ello.
    severity: gap
    state: accepted
    reason: >-
      Aceptado en v1.1.0: un ChargeRequested que viola las cotas del contrato es un contrato roto
      por el emisor, no un rechazo de negocio. Va a la cola de descarte sin reintento y lo vigila
      operación, como el resto de fallos de la suscripción; por eso no hay failureReason que lo
      nombre.
  - class: 8
    unit: subscriptions.ChargeRequested
    what: >-
      Dice que el cobro se registra en pending antes de llamar a la pasarela, pero no que ese
      registro se confirme en su propia transacción: si la llamada va dentro de la transacción del
      listener y algo falla después, el reintento deshace el pending y vuelve a cobrar, frenado solo
      por la idempotencia de la pasarela, que caduca.
    severity: risk
    state: decided
    reason: >-
      Decidido en v1.0.0 y vigente: el cobro se registra en pending ANTES de llamar a la pasarela
      por las dos puertas (rule de requestCharge, docs/dsl/payments.md § El cobro), y el registro y
      la llamada no comparten transacción: lo que la regla exige es que el pending exista cuando la
      pasarela actúa.
  - class: 13
    unit: sweepPendingPayments
    what: >-
      Un cobro que la pasarela sigue dando por en curso (actionRequired sin cliente, una devolución
      pendiente) se deja para la siguiente pasada sin tope: se consulta cada 15 minutos
      indefinidamente y nada avisa de que lleva días atascado.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en v1.0.0 y vigente: el plazo lo pone la pasarela, que da por fallida una
      autenticación que el cliente no completa; el barrido recoge ese desenlace. Un plazo propio más
      corto cancelaría cobros que el cliente aún puede completar.
  - class: 18
    unit: charge
    what: >-
      No dice cuánto espera el servicio a que el cliente se autentique (actionRequired) ni quién
      cancela el cobro si no vuelve: lo delega en que «la pasarela acaba dándolo por fallido», que
      no hacen todas las pasarelas ni en el mismo plazo, y el lifecycle no tiene salida de
      actionRequired a canceled.
    severity: gap
    state: accepted
    reason: >-
      Aceptado en v1.0.0 y vigente: el plazo de la autenticación lo pone la pasarela, que da por
      fallido el cobro que el cliente no completa, y el barrido recoge ese desenlace. Un plazo
      propio más corto cancelaría cobros que el cliente aún puede completar.
  - class: 18
    unit: charge
    what: >-
      El cobro no guarda la moneda ni la llevan los eventos: un cambio del parámetro currency entre
      despliegues deja capturas, devoluciones y desenlaces de cobros anteriores sin decir en qué
      moneda estaban.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en v1.1.0: la moneda es única por despliegue (service.parameters.currency) y
      cambiarla es una migración de datos fuera del servicio, no un cambio de configuración.
  - class: 18
    unit: refund
    what: >-
      No dice qué pasa con una devolución, captura o anulación hecha directamente en la pasarela
      (fuera del servicio): su aviso no tiene transición desde el estado del cobro, el desenlace es
      un no-op y el registro y pedidos se quedan creyendo lo contrario.
    severity: risk
    state: accepted
    reason: >-
      Aceptado en v1.1.0: el servicio es el único que actúa sobre la pasarela; operar desde su panel
      (devolver, capturar o anular a mano) queda fuera de alcance y no se reconcilia.

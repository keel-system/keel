findings:
  - class: 1
    unit: Payment
    what: "cancelPayment dice que, si la pasarela rechaza la anulación dando el cobro por capturado, se
      aplica ese desenlace, pero el lifecycle no tiene la arista canceling → captured y markCaptured
      solo parte de capturing: ese desenlace no tiene transición que ejecutar, y lo mismo le pasa al
      barrido si encuentra capturado un cobro en canceling."
    severity: gap
    state: decided
    reason: "Decidido en v1.2.0: la rama «capturado» no puede ocurrir —solo este servicio captura, y
      capturing impide anular—, y la rule de cancelPayment ya no la promete: solo la autorización
      caducada lleva canceling a canceled (markCanceled, cancelReason expired). El «capturado» del
      barrido es el de refunding → captured."
  - class: 2
    unit: capturePayment
    what: "La regla de la autorización caducada lleva el cobro de capturing a canceled (cancelReason
      expired) y responde PAYMENT_NOT_CAPTURABLE, pero capturePayment no declara esa transición ni
      dice si sale PaymentCanceled: no está dicho si pedidos se entera también por evento."
    severity: gap
    state: decided
    reason: "Decidido en v1.2.0: la autorización caducada aplica markCanceled (transición capturing →
      canceled, cancelReason expired), que publica PaymentCanceled como cualquier anulación; pedidos
      se entera por la respuesta y por el evento."
  - class: 4
    unit: requestCharge
    what: "No dice si puede haber más de un cobro vivo (ni failed ni canceled) por orderId: la guarda es
      solo chargeRequestId y orderId tiene un índice no único, así que dos referencias distintas
      para el mismo pedido se cobran las dos."
    severity: gap
    state: accepted
    reason: "Aceptado en v1.0.0 y vigente en v1.2.0: puede haber varios cobros por pedido a propósito
      —tras un failed, pedidos pide otro con otra referencia—. Qué cobro vale para un pedido es de
      pedidos (DESIGN.md § 6, «Varios cobros por pedido»); este servicio garantiza una sola
      ejecución por referencia."
  - class: 4
    unit: savePaymentMethod
    what: "Con la respuesta de la pasarela perdida (GATEWAY_UNAVAILABLE) el medio puede haber quedado
      guardado en la pasarela sin registro aquí, y el token suele ser de un solo uso: no dice cómo
      recupera pedidos ese medio ni qué pasa con el huérfano."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.0.0 y vigente en v1.2.0: un medio guardado en la pasarela sin registro
      propio no se puede cobrar por este servicio (no hay id que lo nombre) y no tiene coste;
      pedidos pide otro token al cliente y guarda otro medio."
  - class: 6
    unit: SavedPaymentMethod
    what: "No hay ninguna operación para retirar un medio guardado, ni aquí ni en la pasarela: un medio
      que el cliente quiere quitar, o que ya no debe cobrarse, queda guardado y cobrable para
      siempre con su gatewayReference sensible."
    severity: gap
    state: accepted
    reason: "Aceptado en v1.0.0 y vigente en v1.2.0: retirar un medio guardado queda fuera (DESIGN.md §
      6, «Sin retirar medios guardados en v1.x»). Solo pedidos puede cobrarlo y solo a nombre de su
      titular; un medio caducado lo rechaza la pasarela. Entra con el caso de uso de baja de
      cliente."
  - class: 7
    unit: subscriptions.ChargeRequested
    what: "El rechazo por evento solo cubre el medio de pago: un ChargeRequested que viola las cotas de
      requestCharge (más de dos decimales con scalePolicy reject, importe menor de 0.01, referencias
      de más de 64) no dice si se reintenta, va a la DLQ o sale como PaymentFailed, y
      PaymentFailureReason no tiene motivo para ello."
    severity: gap
    state: accepted
    reason: "Aceptado en v1.1.0 y vigente en v1.2.0: un ChargeRequested que viola las cotas del contrato
      es un contrato roto por el emisor, no un rechazo de negocio. Va a la cola de descarte sin
      reintento y lo vigila operación, como el resto de fallos de la suscripción; por eso no hay
      failureReason que lo nombre."
  - class: 11
    unit: getPayment
    what: "Las respuestas a pedidos devuelven la entidad Payment entera, incluidos awaitingSince (el
      reloj interno del barrido, que este re-estampa al reclamar) y el id interno: el contrato M2M
      acopla a otro equipo a un mecanismo interno de la reconciliación sin que el diseño lo elija."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.2.0: el único lector es pedidos, que lee awaitingSince para saber desde
      cuándo un cobro espera sin respuesta (es su significado declarado), y el id no le sirve para
      nada pero tampoco abre nada: no hay lectura por id. Recortar la respuesta es un cambio de
      contrato que no pide nadie."
  - class: 13
    unit: sweepPendingPayments
    what: "Un cobro que la pasarela sigue dando por en curso (actionRequired sin cliente, una devolución
      pendiente) se deja para la siguiente pasada sin tope: se consulta indefinidamente y nada avisa
      de que lleva días atascado."
    severity: risk
    state: accepted
    reason: "Aceptado en v1.0.0 y vigente en v1.2.0: el plazo lo pone la pasarela, que da por fallida
      una autenticación que el cliente no completa; el barrido recoge ese desenlace. Un plazo propio
      más corto cancelaría cobros que el cliente aún puede completar."
  - class: 16
    unit: "3.1"
    what: La fiabilidad del outbox está registrada en structural con since 1.1.0; el diseño va por la
      1.2.0 y no se ha vuelto a preguntar.
    severity: gap
    state: decided
    reason: "Reafirmado en v1.2.0: decisions.yaml → structural lleva since 1.2.0 en todas las entradas,
      y la de 3.5 describe el onFailure de ahora, acknowledgeOn incluido. Los onRejected de 3.2 son
      una decisión de la capa payments, no de idempotencia: la guarda sigue siendo la misma."

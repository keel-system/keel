reviewedBy: keel-design-review
reviewedAt: 1.1.0
findings:
  - id: REV-DOMAIN-VAGUE-INVARIANT
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Las cuatro invariantes de Payment se deciden con campos declarados: refundedAmount <= amount;
      el payerId del SavedPaymentMethod de savedPaymentMethodId igual al payerId del cobro (cruza
      agregado, pero el payerId de un medio no lo cambia ninguna operación, así que basta
      comprobarlo al anotarlo, como dice la rule de requestCharge); customerAction solo en
      actionRequired; awaitingSince solo en pending, actionRequired, capturing, canceling y
      refunding. SavedPaymentMethod no declara invariantes.
  - id: REV-DOMAIN-INVARIANT-IS-TRANSITION
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Ninguna invariante habla de pasar de un estado a otro: son una cota, una pertenencia y dos
      condiciones de presencia por estado. Las transiciones están en el lifecycle de status, y la
      «una sola devolución» (rule de refundPayment) la sostiene refunded terminal.
  - id: REV-DOMAIN-PROMISED-STATE
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Cada promesa de la prosa tiene campo o transición: «conserva gatewayPaymentId y el medio»
      (markFailed) → gatewayPaymentId y savedPaymentMethodId; «guarda customerAction tal cual»
      → customerAction json; «reclama volviendo a estampar awaitingSince» (barrido) →
      awaitingSince; «la referencia de la pasarela se guarda aparte» (savePaymentMethod) →
      SavedPaymentMethod.gatewayReference; «caducó» → cancelReason expired y la arista
      capturing→canceled; «vuelve a captured» → arista refunding→captured.
  - id: REV-DOMAIN-PARTIAL-WRITER
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Las vías a failed escriben todas failureReason (respuesta o aviso vía markFailed con el
      motivo traducido, barrido con notReceived, rechazo previo por evento con
      invalidPaymentMethod); las vías a canceled pasan por markCanceled con cancelReason
      obligatorio (requested o expired, decisión aceptada en decisions.yaml); a authorized y a
      captured se vuelve sin campos propios que distinguir. Matiz sin hallazgo: refundPayment dice
      que al volver a captured vacía awaitingSince y el barrido (refunding→captured,
      capturing/canceling→authorized) no lo dice, pero lo impone la invariante de awaitingSince.
  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations.savePaymentMethod
    verdict: accepted
    note: >-
      savePaymentMethod no declara idempotency ni hay naturalKey en SavedPaymentMethod: un
      reintento tras timeout da de alta un segundo medio (y otro en la pasarela). Lo acepta el
      registro estructural 3.2 de decisions.yaml («savePaymentMethod se repite sin daño: guarda
      otro medio, que nadie cobra si nadie usa su id»). El resto sí tiene guarda: requestCharge la
      naturalKey sobre chargeRequestId (CHARGE_ALREADY_REQUESTED), capture/cancel/refund sus
      precondiciones de estado y sus estados en vuelo, y los desenlaces sus transiciones.
  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases.operations.requestCharge
    verdict: ok
    note: >-
      Ninguna rule fija un orden entre rechazos. Las guardas de requestCharge (fuente única,
      medio existente y del pagador, referencia repetida) y de refundPayment (captured, importe
      <= cobrado) dependen solo del input y del cobro o medio que este nombra; FL-CHG-004 y
      FL-STL-003-B ejercitan cada una por separado, sin escenarios de precedencia.
  - id: REV-SEC-M2M-AUDIENCE
    scope: security.authentication.serviceAuth
    verdict: ok
    note: >-
      serviceAuth declara validateAudience true y toda la superficie es level service para
      orders-service: un token emitido para otro servicio no vale aquí.
  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: ok
    note: >-
      Los seis eventos publicados declaran channel paymentEvents y la suscripción ChargeRequested
      channel chargeRequests; los dos son nombres lógicos estables y con description.
  - id: REV-MSG-DEDUPE-WINDOW
    scope: messaging.subscriptions.ChargeRequested
    verdict: ok
    note: >-
      requestCharge no declara transitions ni idempotency, pero su efecto no es acumulable: es un
      alta frenada por la naturalKey sobre chargeRequestId, que no caduca, y el cobro nace en
      pending antes de llamar a la pasarela. Pasada la retención de procesados, una reentrega
      choca con CHARGE_ALREADY_REQUESTED sin segundo cobro (FL-EVT-001-B, incluido el mensaje
      distinto con la misma referencia).
  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities.Payment
    verdict: ok
    note: >-
      Lecturas declaradas: por chargeRequestId (getPayment, acciones y desenlaces) → naturalKey;
      el barrido por status y awaitingSince → índice [status, awaitingSince]; el aviso de la
      pasarela y la consulta por gatewayPaymentId → índice [gatewayPaymentId]; el medio guardado
      por su id → clave primaria. Ninguna query filtra por un campo sin índice.
  - id: REV-PAYMENTS-AMOUNT-SOURCE
    scope: use-cases.operations.requestCharge
    verdict: accepted
    note: >-
      El importe llega en el input (charge.amount: amount) y nada lo contrasta. Lo explica la
      primera rule de requestCharge: «El importe lo fija el sistema de pedidos, que es el único
      llamante (un cliente máquina con su scope) y el único emisor del canal chargeRequests: el
      servicio no vende nada y no tiene contra qué contrastarlo». Cubre las dos puertas, la HTTP
      (serviceClients solo tiene orders-service) y la del evento (source orders-service).
  - id: REV-PAYMENTS-CARD-DATA
    scope: use-cases
    verdict: ok
    note: >-
      Ningún input ni payload lleva número, caducidad ni CVV: paymentToken es el token del
      componente de la pasarela, paymentMethodRef un uuid propio, los payloads de evento llevan
      referencias, importes y motivos, y gatewayReference es sensitive y queda excluido de la
      salida de savePaymentMethod.
  - id: REV-PAYMENTS-SAVED-OWNERSHIP
    scope: use-cases.operations.requestCharge
    verdict: ok
    note: >-
      exposedAs: id (uuid propio, no la referencia de la pasarela); savePaymentMethod ata el medio
      al payerId («El medio queda a nombre del payerId de la petición»), y requestCharge lo
      comprueba en su precondición y responde igual a inexistente y ajeno (FL-CHG-004; por evento,
      FL-EVT-003). Que payerId lo ponga pedidos en el cuerpo y no salga de la credencial está
      aceptado en decisions.yaml (OBL-CALLER-IDENTITY).
  - id: REV-PAYMENTS-FAILED-RECORD
    scope: use-cases.operations.requestCharge
    verdict: ok
    note: >-
      Las rules de requestCharge lo dicen: el medio se anota en savedPaymentMethodId «solo si
      existe y es del pagador», y «un cobro rechazado antes de llamar a la pasarela no anota lo
      que no llegó a existir: ni el medio, ni gatewayPaymentId»; por la suscripción, el cobro se
      registra en pending sin anotar el medio y markFailed lo cierra con invalidPaymentMethod.
      Compatible con la invariante de titularidad, y markFailed solo conserva el medio «si se
      anotó al pedirlo». Por HTTP el rechazo previo es 422 sin registro (FL-CHG-004 Then 4);
      FL-EVT-003 afirma savedPaymentMethodId y gatewayPaymentId nulos.

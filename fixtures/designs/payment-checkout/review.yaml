reviewedBy: keel-design-review
reviewedAt: 1.2.0
findings:
  - id: REV-DOMAIN-VAGUE-INVARIANT
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Las cuatro invariantes de Payment se deciden con campos declarados: refundedAmount <= amount;
      customerAction con valor solo en actionRequired; awaitingSince con valor solo en pending,
      actionRequired, capturing, canceling y refunding (campo status). La de titularidad del medio
      cruza al agregado SavedPaymentMethod, pero su payerId no lo cambia ninguna operación, así que
      basta comprobarla al anotar el medio, que es lo que dicen la precondición y la rule de
      requestCharge. SavedPaymentMethod no declara invariantes.

  - id: REV-DOMAIN-INVARIANT-IS-TRANSITION
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Ninguna invariante habla de pasar de un estado a otro: son una cota, una pertenencia y dos
      condiciones de presencia por estado. Las transiciones están en lifecycle.status, y la «una
      sola devolución» de refundPayment la sostiene refunded terminal.

  - id: REV-DOMAIN-PROMISED-STATE
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Toda promesa de estado tiene arista. La rama «capturado» del rechazo de la anulación se quitó
      de la rule de cancelPayment (v1.2.0): no puede ocurrir, porque solo este servicio captura y
      capturing impide anular; el rechazo devuelve el cobro a authorized (canceling → authorized,
      CANCEL_REJECTED) y la autorización caducada lo lleva a canceled con markCanceled. El
      «capturado» del barrido es el de refunding → captured, que sí tiene arista. El resto:
      «conserva gatewayPaymentId y el medio» (markFailed), customerAction json, awaitingSince
      renovado por el barrido, gatewayReference aparte, capturing → canceled con cancelReason
      expired.

  - id: REV-DOMAIN-PARTIAL-WRITER
    scope: domain.entities.Payment
    verdict: ok
    note: >-
      Las vías a failed escriben todas failureReason (respuesta o aviso vía markFailed con el
      motivo traducido; el barrido con notReceived; el rechazo previo por evento con
      invalidPaymentMethod), y gatewayPaymentId/savedPaymentMethodId distinguen a propósito lo que
      llegó a existir (docs § Lo que conserva un cobro failed, FL-EVT-003). Las vías a canceled pasan
      todas por markCanceled con cancelReason obligatorio (requested desde canceling, expired en el
      resto, decisión CHK-PAYMENTS-OUTCOME-INPUT-UNBACKED). Las vueltas a authorized y a captured
      (acción rechazada o barrido) no tienen campo propio y todas dicen que vacían awaitingSince.
      Matiz sin hallazgo: una anulación rechazada porque la autorización ya caducó acaba en
      canceled con requested, y una captura rechazada por lo mismo con expired; es coherente con la
      decisión escrita (lo que pidió el llamante), no una vía que deje el campo vacío.

  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations.savePaymentMethod
    verdict: accepted
    note: >-
      savePaymentMethod no declara idempotency ni hay naturalKey en SavedPaymentMethod: un reintento
      tras timeout da de alta un segundo medio (y otro en la pasarela). Lo acepta el registro
      estructural 3.2 de decisions.yaml («savePaymentMethod se repite sin daño: guarda otro medio,
      que nadie cobra si nadie usa su id»); ese registro es de la v1.1.0 y el criterio structural
      de --ready pide reafirmarlo. Los demás commands sí tienen guarda: requestCharge la naturalKey
      sobre chargeRequestId, capture/cancel/refund sus precondiciones y estados en vuelo, los
      desenlaces sus transiciones.

  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases.operations.requestCharge
    verdict: ok
    note: >-
      La única secuencia que fijan las rules es «por HTTP, las precondiciones se comprueban ANTES de
      registrar», y es implementable: la fuente única depende solo del input y la titularidad del
      medio de paymentMethodRef + payerId, ambos disponibles antes del insert; la referencia
      repetida la decide la naturalKey al insertar, después. FL-CHG-004 usa referencias propias por
      caso, así que no fija una precedencia distinta. Por evento, el rechazo previo registra el cobro
      y la referencia repetida cae en el mismo insert (acknowledgeOn). refundPayment (captured,
      importe <= amount) solo mira el cobro que nombra el input.

  - id: REV-SEC-M2M-AUDIENCE
    scope: security.authentication.serviceAuth
    verdict: ok
    note: >-
      serviceAuth declara validateAudience: true; un token emitido para otro servicio del mismo
      servidor de autenticación no vale aquí.

  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: ok
    note: >-
      Los seis eventos publicados van por paymentEvents y la suscripción ChargeRequested por
      chargeRequests, los dos con nombre lógico y descripción en messaging.channels.

  - id: REV-MSG-DEDUPE-WINDOW
    scope: messaging.subscriptions.ChargeRequested
    verdict: ok
    note: >-
      requestCharge no declara transitions ni idempotency, pero su efecto no es acumulable: inserta
      un Payment cuya naturalKey [chargeRequestId] no caduca, así que una reentrega pasada la
      retención de la tabla de procesados choca con CHARGE_ALREADY_REQUESTED, que acknowledgeOn da
      por atendido sin segundo cobro ni desenlace (FL-EVT-001-B). Lo dice también el registro 3.2.

  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities.Payment
    verdict: ok
    note: >-
      Las búsquedas del diseño tienen índice: getPayment y todos los desenlaces y acciones por
      chargeRequestId (naturalKey, única); el barrido por status + awaitingSince ([status,
      awaitingSince]); la consulta y el aviso de la pasarela por gatewayPaymentId. El medio se lee
      por su id (PK). [orderId] y SavedPaymentMethod.[payerId] no los usa ninguna operación
      declarada: sobran, no faltan.

  - id: REV-PAYMENTS-AMOUNT-SOURCE
    scope: use-cases.operations.requestCharge
    verdict: accepted
    note: >-
      El importe viaja en el input de requestCharge (y en el payload de ChargeRequested) y nada lo
      contrasta. Lo explica la propia rule de requestCharge: lo fija el sistema de pedidos, único
      llamante (cliente máquina con scope payment:charge, security.serviceClients) y único emisor de
      chargeRequests; el servicio no vende nada y no tiene contra qué contrastarlo.

  - id: REV-PAYMENTS-CARD-DATA
    scope: use-cases
    verdict: ok
    note: >-
      Ningún input ni payload lleva número, caducidad o CVV: savePaymentMethod y requestCharge
      reciben paymentToken (token del componente de la pasarela, «nunca un dato de tarjeta») y
      paymentMethodRef (uuid propio); los payloads llevan referencias, importes y motivos.
      customerAction es la acción opaca de la pasarela (3DS, redirección), no datos de tarjeta.

  - id: REV-PAYMENTS-SAVED-OWNERSHIP
    scope: use-cases.operations.requestCharge
    verdict: ok
    note: >-
      El medio queda atado a su titular: savePaymentMethod lo guarda a nombre del payerId («el medio
      queda a nombre del payerId de la petición»), la invariante de Payment exige que coincidan, y
      la precondición de requestCharge lo comprueba con PAYMENT_METHOD_NOT_FOUND idéntico para
      inexistente y ajeno (FL-CHG-004). Por evento, el ajeno acaba en failed invalidPaymentMethod
      (FL-EVT-003). La gatewayReference no sale (sensitive, excluida del output).

  - id: REV-PAYMENTS-FAILED-RECORD
    scope: use-cases.operations.requestCharge
    verdict: ok
    note: >-
      Las rules lo dicen y es compatible con la invariante: «el medio queda anotado en
      savedPaymentMethodId solo si existe y es del pagador», y por la suscripción un medio inválido,
      ausente, doble o ajeno «registra el cobro en pending, sin anotar el medio» y aplica markFailed
      con invalidPaymentMethod sin llamar a la pasarela, así que gatewayPaymentId también queda
      vacío. FL-EVT-003 lo verifica (savedPaymentMethodId null, gatewayPaymentId null). Por HTTP no
      queda cobro.

dependencies:
  inventory:
    description: Almacén, dueño del stock físico y de su bloqueo.
    contract:
      version: 1.0.0
    activations:
      reserveStock:
        description: Bloqueo del stock del pedido en el almacén.
        triggeredBy: [confirmReservation]
        # Publicado, no llamado: el encargo tiene que acabar saliendo aunque el almacén
        # esté caído, y eso lo garantiza el outbox. El precio es que aquí no hay
        # desenlace —por eso el schema prohíbe `onFailure` en esta rama— y que la
        # operación propia termina sin saber si el stock quedó bloqueado.
        via:
          publishes: StockReservationRequested
        effect: El stock del pedido queda bloqueado y deja de estar disponible para otros.
        # `acknowledgement`, no `outcome`: el desenlace existe, pero llega después y por
        # otro canal (la suscripción a StockReserved / StockRejected). `outcome` exigiría
        # un canal síncrono y `keel validate` lo daría en rojo.
        awaits: acknowledgement
        # La pata del SILENCIO. Si no llega ni la confirmación ni el rechazo, la reserva
        # se queda en `awaitingStock` sin que nada lo delate: eso solo lo ve un barrido.
        reconciledBy: reconcileReservations
        # Cuánto silencio del almacén se tolera antes de volver a insistir.
        unansweredAfterSeconds: 1800
        # Y desde cuándo se cuenta: la marca que estampa confirmReservation al encargar el
        # bloqueo. Lleva delante el nombre de la activación porque una reserva puede acabar
        # esperando dos desenlaces, y con una marca compartida el segundo pisa al primero.
        awaitingSince: reserveStockAwaitingSince
      cancelStock:
        description: Cancelación del bloqueo de un encargo que se dio por perdido.
        # Lo que ENLAZA el barrido con lo que reconcilia: rendirse no es solo mover el
        # estado propio, es decírselo al almacén — que puede haber bloqueado el stock
        # aunque su respuesta nunca nos llegara.
        triggeredBy: [reconcileReservations]
        via:
          client: inventory
          call: cancelStock
        effect: El bloqueo de stock del pedido queda anulado en el almacén.
        awaits: outcome
        onFailure:
          action: ignore
    compensations:
      - onEvent: StockRejected
        undoes: reserveStock
        description: El almacén rechazó el bloqueo; la reserva se libera.

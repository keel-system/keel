operations:
  createReservation:
    description: Registra la intención de reservar stock para un pedido.
    kind: command
    input:
      fields:
        orderId:
          type: uuid
          required: true
        # Las constraints se repiten aquí y no solo en la entidad a propósito: el
        # generador emite la validación desde el INPUT, así que una restricción que
        # solo vive en `domain` no se comprueba en la frontera — la violación viaja
        # hasta el agregado y sale como un 400 sin `code`, que ningún escenario puede
        # afirmar. Declararla en los dos sitios es lo que hace que el rechazo sea
        # contrato público (VALIDATION_ERROR) y no un accidente del dominio.
        sku:
          type: string
          required: true
          constraints: { maxLength: 32 }
        quantity:
          type: int
          required: true
          constraints: { min: 1 }
    output:
      entity: Reservation
      # Marcador operativo del barrido, no algo que el cliente necesite.
      exclude: [reserveStockAwaitingSince]
    errors:
      - code: RESERVATION_ALREADY_EXISTS
        when: Ya existe una reserva para ese pedido.
        http: 409
    # El eje de repetición del LLAMANTE: un cliente con timeout reintenta el POST y
    # no puede acabar con dos reservas del mismo pedido. La clave la genera él.
    idempotency:
      keySource: client-key
      ttlSeconds: 3600

  confirmReservation:
    description: Encarga al almacén el bloqueo del stock y deja la reserva esperando.
    kind: command
    input:
      fields:
        id:
          type: uuid
          required: true
    output:
      entity: Reservation
      # Marcador operativo del barrido, no algo que el cliente necesite.
      exclude: [reserveStockAwaitingSince]
    errors:
      - code: RESERVATION_NOT_FOUND
        when: No existe una reserva con ese id.
        http: 404
    # El encargo viaja PUBLICADO, así que esta operación no conoce el desenlace: lo
    # que hace es dejar la reserva esperándolo. Es la operación que crea la deuda —a
    # partir de aquí hay trabajo encargado al almacén— y también la que crea el estado
    # de espera del que vive `reconciledBy`.
    emits: [StockReservationRequested]
    transitions:
      - entity: Reservation
        from: [pending]
        to: awaitingStock

  applyStockReserved:
    description: Confirma la reserva cuando el almacén avisa de que bloqueó el stock.
    kind: command
    # El desenlace BUENO del encargo asíncrono. Sin esta operación la reserva no
    # saldría nunca de la espera por la vía normal, y el barrido acabaría rindiéndose
    # con todas: la reconciliación no sustituye al camino feliz, lo respalda.
    internal: true
    input:
      fields:
        orderId:
          type: uuid
          required: true
    output: "void"
    errors:
      - code: RESERVATION_NOT_FOUND
        when: No existe una reserva para ese pedido.
        http: 404
    transitions:
      - entity: Reservation
        from: [awaitingStock]
        to: confirmed

  noteStockCount:
    description: Anota la corrección de recuento que el almacén comunica sobre un pedido.
    kind: command
    # Interna: la dispara solo la suscripción.
    internal: true
    # La OTRA mitad de la idempotencia de consumo: esta operación NO declara `transitions`.
    # Sin transición de lifecycle no hay guarda de dominio que rechace la segunda aplicación,
    # así que el generador elige el otro orden del IdempotencyGuard —`tryRecord`: marcar ANTES
    # de procesar—, que cierra la ventana del duplicado a cambio de perder el mensaje si el
    # handler falla. `catalog-extended` ya genera esa rama, pero nadie la ha EJECUTADO: lo que
    # esta operación aporta es un efecto observable en caja negra —un contador— sobre el
    # diseño que sí se corre entero. Aplicarla dos veces se ve en la API.
    input:
      fields:
        orderId:
          type: uuid
          required: true
        countedQuantity:
          type: int
          required: true
    output: "void"
    errors:
      - code: RESERVATION_NOT_FOUND
        when: No existe una reserva para ese pedido.
        http: 404

  getReservation:
    description: Consulta el estado de una reserva.
    kind: query
    input:
      fields:
        id:
          type: uuid
          required: true
    output:
      entity: Reservation
      # Marcador operativo del barrido, no algo que el cliente necesite.
      exclude: [reserveStockAwaitingSince]
    errors:
      - code: RESERVATION_NOT_FOUND
        when: No existe una reserva con ese id.
        http: 404

  releaseReservation:
    description: Libera la reserva cuando el almacén rechaza el bloqueo a posteriori.
    kind: command
    # Interna: solo la dispara la suscripción. Exponerla por HTTP abriría un segundo
    # camino que la deduplicación del listener no cubre (keel validate lo da en rojo
    # si no hay guarda de dominio; aquí la hay, pero no hace falta el endpoint).
    internal: true
    input:
      fields:
        orderId:
          type: uuid
          required: true
        reason:
          type: string
          required: true
    output: "void"
    errors:
      - code: RESERVATION_NOT_FOUND
        when: No existe una reserva para ese pedido.
        http: 404
    # El estado de vuelta: deshacer contra el almacén sin devolver esto dejaría la
    # reserva donde la puso un trabajo que ya no existe. Los dos `from` no son laxitud:
    # entre que se publica el encargo y que el almacén responde no hay orden garantizado,
    # así que el rechazo puede llegar con la reserva todavía esperando (awaitingStock) o
    # ya confirmada (confirmed). Ninguno de los dos vuelve a `released` desde `released`,
    # que es lo que la mantiene irrepetible.
    transitions:
      - entity: Reservation
        from: [awaitingStock, confirmed]
        to: released

  reconcileReservations:
    description: Barre las reservas que llevan demasiado tiempo esperando al almacén.
    kind: command
    internal: true
    input: "void"
    output: "void"
    # La pata del SILENCIO. El encargo salió publicado y el desenlace llega por evento:
    # si el almacén cae, pierde el mensaje o nunca responde, no llega NI StockReserved
    # ni StockRejected, y la reserva se queda en `awaitingStock` para siempre. No hay
    # excepción, no hay log de error, no hay alarma — una ausencia no produce ningún
    # hecho al que reaccionar, y por eso lo único que la ve es algo que corre solo.
    #
    # Se rinde: cancela el encargo contra el almacén (por si llegó a bloquear stock sin
    # que su respuesta nos llegara) y saca la reserva de la espera.
    # Cada minuto, no cada quince: el barrido es el ÚNICO mecanismo de los cinco sin gate
    # conductual, y un cron de quince minutos no se alcanza desde una prueba de caja negra.
    # Lo que hace que esto no sea un ajuste para la prueba es que el umbral —cuánto tiempo en
    # espera es demasiado— vive aparte, en `parameters/`: el barrido corre a menudo y se
    # rinde tarde, que es como se opera de verdad. El escenario no espera al umbral, retrasa
    # `awaiting_since` en la base y espera al siguiente tick.
    schedule:
      cron: "* * * * *"
    transitions:
      - entity: Reservation
        from: [awaitingStock]
        to: released

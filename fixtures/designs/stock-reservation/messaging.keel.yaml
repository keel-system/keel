# La silueta del encargo ASÍNCRONO, que es la que necesita reconciliación: se publica
# la petición, la reserva se queda esperando, y el desenlace llega por uno de dos
# eventos que pueden no llegar nunca. Aquí están las tres mitades: lo que sale
# (publishing), lo que entra bien (StockReserved) y lo que entra mal (StockRejected).
channels:
  stockEvents:
    description: Canal por el que este servicio encarga stock y el almacén responde.

publishing:
  # El encargo viaja publicado, así que la garantía de que sale no la da publicar: la
  # da el outbox. Con `best-effort`, un broker caído en el instante del commit perdería
  # el encargo sin dejar rastro, y no hay compensación posible de un trabajo que nunca
  # se pidió — `keel validate` lo avisa.
  reliability: outbox
  events:
    StockReservationRequested:
      channel: stockEvents
      description: Petición de bloqueo de stock dirigida al almacén.
      payload:
        orderId: { type: uuid, required: true }
        sku:     { type: string, required: true }
        quantity: { type: int, required: true }

subscriptions:
  StockReserved:
    description: El almacén confirma que bloqueó el stock del pedido.
    source: inventory
    channel: stockEvents
    payload:
      orderId: { type: uuid, required: true }
    contract:
      envelope: keel
    triggers: applyStockReserved
    input:
      orderId: orderId
    onFailure:
      retry: { maxAttempts: 5, backoff: exponential, initialDelayMs: 500, maxDelayMs: 15000 }
      deadLetter: true

  StockCountAdjusted:
    description: El almacén corrige la cantidad que tiene bloqueada para el pedido.
    source: inventory
    channel: stockEvents
    payload:
      orderId:         { type: uuid, required: true }
      countedQuantity: { type: int, required: true }
    contract:
      envelope: keel
    # Ni desenlace ni compensación: una corrección. `noteStockCount` no declara transiciones,
    # así que aquí la deduplicación NO tiene detrás ninguna guarda de dominio y es lo único
    # que impide que una reentrega vuelva a sumar en el contador. Es la rama `tryRecord`.
    triggers: noteStockCount
    input:
      orderId: orderId
      countedQuantity: countedQuantity
    onFailure:
      retry: { maxAttempts: 5, backoff: exponential, initialDelayMs: 500, maxDelayMs: 15000 }
      deadLetter: true

  StockRejected:
    description: El almacén rechaza el bloqueo de stock del pedido.
    source: inventory
    channel: stockEvents
    payload:
      orderId: { type: uuid, required: true }
      reason:  { type: string, required: true }
    contract:
      # Sin `messageId`: la fuente es otro servicio Keel, así que la identidad del mensaje
      # ya es `metadata.eventId` de la envoltura —estampado una vez en el `raise` y viaje
      # intacto hasta el cable—, y es lo que alimenta `processed_event`. Declarar uno
      # propio apuntaría a un metadato nativo del broker que ningún emisor Keel escribe.
      envelope: keel
    triggers: releaseReservation
    input:
      orderId: orderId
      reason: reason
    # Una compensación puede llegar ANTES del hecho que compensa: entre que se publica
    # el encargo y que el almacén responde no hay orden garantizado. Los reintentos
    # absorben esa carrera solos; la DLQ es la red.
    onFailure:
      retry: { maxAttempts: 5, backoff: exponential, initialDelayMs: 500, maxDelayMs: 15000 }
      deadLetter: true

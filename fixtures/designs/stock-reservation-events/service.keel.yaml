keel: "2.20"
# Variante de `stock-reservation` hecha para medir la MENSAJERÍA de los dos generadores con el
# mismo diseño (incremento 9 de PLAN-KEEL-NEST.md): la reserva se encarga al almacén publicando un
# evento y su desenlace llega por eventos. Sin la llamada saliente al almacén ni su reconciliación
# por reloj, que son otra silueta (la de `stock-reservation`) y otro incremento de keel-nest.
#
#   - idempotencia de PETICIÓN  → `createReservation` con `client-key`
#   - OUTBOX                    → `confirmReservation` publica el encargo
#   - idempotencia de CONSUMO   → las tres suscripciones, por el eventId de la envoltura Keel,
#                                 en los dos órdenes del guard (con y sin guarda de dominio)
#   - COMPENSACIÓN              → `releaseReservation`, irrepetible por su lifecycle
service:
  name: stock-reservation-events
  version: 1.0.0
  description: Reserva stock para un pedido encargándoselo al almacén por eventos, y la libera si el almacén la rechaza.
  domain: fulfillment
conventions:
  # Un campo sin valor viaja como null (releaseReason y lastCountedQuantity hasta que algo los escribe):
  # el default, escrito.
  nulls: include
layers:
  domain: domain.keel.yaml
  use-cases: use-cases.keel.yaml
  api: api.keel.yaml
  persistence: persistence.keel.yaml
  messaging: messaging.keel.yaml
  security: security.keel.yaml

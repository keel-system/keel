# Obligaciones de diseño que este servicio deja abiertas a sabiendas.
decisions:
  - id: OBL-QUERY-SORT-UNDECIDED
    scope: use-cases.listReports.output.sortable
    reason: >
      Provisional (DSL 2.32, incremento B1 de PLAN-DSL-231-232-INVARIANTES-Y-BUSQUEDA.md): listReports se queda con su
      orden por defecto y sin orden del cliente mientras los generadores no generan `sortable`. Se revisa en B8.
    since: 1.0.0
  - id: OBL-ENTITY-UNREACHABLE
    scope: domain
    reason: >
      Los inspectores los da de alta el servicio de personal, que publica sus bajas
      (InspectorDeactivated); aquí solo se referencian desde el informe. En las pruebas se siembran
      en la base antes de cada flujo.
    since: 1.0.0

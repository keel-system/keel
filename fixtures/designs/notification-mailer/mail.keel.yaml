# La silueta que ninguna otra fixture tiene: un servicio cuya SALIDA es correo.
description: Correo transaccional que este servicio emite en nombre de las aplicaciones registradas.

delivery:
  transport: smtp
  parts: [html, text]
  # La ÚNICA fixture con capa `mail`, así que es la única que puede compilar esta rama: sin
  # este `true`, el record anidado Attachment, el componente extra de MailMessage, el import
  # de ByteArrayResource y el bucle addAttachment(...) no los tokeniza java-syntax.test.js ni
  # los compila compile-check. Eran siete sitios del generador con cero tests y cero fixtures.
  attachments: true

# Una sola operación manda correo, y es la que declara el estado EN VUELO. Registrar una
# petición —por HTTP o por evento— no envía nada: separar las dos cosas es lo que permite que
# el envío tenga guarda, porque la guarda necesita un estado intermedio que solo tiene sentido
# en la operación que produce el efecto.
sentBy:
  - sendAcceptedNotification

sender:
  source: data
  fallback: no-reply@ejemplo.com
  description: Cada aplicación registrada tiene su propio remitente verificado ante el proveedor.

replyTo:
  source: fixed
  address: soporte@ejemplo.com

templating:
  source: data
  declaredVariables: true

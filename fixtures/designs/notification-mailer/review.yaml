reviewedBy: keel-design-review
reviewedAt: 2.0.0
findings:
  - id: REV-DOMAIN-PROMISED-STATE
    scope: mail.delivery.attachments
    verdict: accepted
    note: >-
      Aceptado: attachments existe para la cobertura del generador y no promete nada a nadie
      (DESIGN.md lo dice). La aceptación de gaps.yaml que citaba sendingSince ya está escrita, en la
      clase 13.
  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations.registerTemplate
    verdict: accepted
    note: >-
      Aceptado: el PUT versiona a propósito, porque registrar nunca pisa una versión que alguien
      pudo publicar. Un reintento tras un timeout deja un borrador más, que nadie usa hasta
      publicarlo por id.
  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases.operations.requestNotification
    verdict: fixed
    note: >-
      Corregido en v2.0.0: la clave se acota a la aplicación del llamante (regla de
      requestNotification). Así el ámbito del almacén y el de la naturalKey coinciden, y dos
      sistemas no se pisan. Que el DSL no pueda declarar ese ámbito queda como hallazgo del método.
  - id: REV-SEC-M2M-AUDIENCE
    scope: security.authentication
    verdict: fixed
    note: >-
      Corregido en v2.0.0: serviceAuth.validateAudience true, y FL-NTF-001 lo afirma con un token de
      otra audiencia (403).
  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: ok
    note: >-
      NotificationSent declara channel notificationEvents y la suscripción NotificationRequested
      channel notificationRequests; los dos canales están descritos en channels.
  - id: REV-MSG-IDENTITY-FROM-FIELD
    scope: messaging.subscriptions.NotificationRequested.identity
    verdict: accepted
    note: >-
      identity.from es location field sobre metadata.source, y el trabajo pedido es irreversible (un
      correo que sale desde el remitente verificado de otra aplicación). Releída la asunción:
      trustedPublishers la escribe entera y la deja viva a sabiendas («un sistema propio con un bug,
      o comprometido, pida un envío en nombre de otra aplicación»), explica por qué la salida
      location header no es viable con SNS→SQS (SenderId de cuenta, verificado contra LocalStack) y
      nombra el disparador de revisión (emisor fuera del perímetro u obligación de no-repudio) con
      su salida real, un destino por emisor. Ningún emisor declarado está hoy fuera del perímetro:
      source es any-registered-system y los serviceClients son todos sistemas propios. Aceptado por
      la prosa del propio diseño.
  - id: REV-MSG-DEDUPE-WINDOW
    scope: messaging.subscriptions.NotificationRequested
    verdict: ok
    note: >-
      acceptNotificationRequest no declara transitions ni idempotency, y su efecto sí es acumulable
      (una notificación más es un correo más). Pero hay guarda de dominio que no caduca: dedupeKey
      es metadata.eventId y Notification tiene naturalKey [applicationKey, dedupeKey], así que una
      reentrega pasada la retención de la tabla de procesados no puede insertar una segunda
      notificación. El residuo es de ruido, no de daño: esa violación no tiene code, fallaría como
      error pasajero y acabaría en la cola de descarte tras cinco intentos; con ventanas de
      reentrega de horas frente a una retención de días no es un escenario realista.
  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities
    verdict: ok
    note: >-
      Las lecturas que el diseño implica tienen índice: Application por client_id ([credentialKeys])
      y por key (naturalKey); la plantilla activa por aplicación, clave e idioma (índice único
      condicionado a status active); la siguiente versión (prefijo de la naturalKey [application,
      key, locale, version]); la deduplicación (naturalKey [applicationKey, dedupeKey]); el lote del
      barrido ([status, requestedAt]). getTemplate y getNotification van por clave primaria. Las
      TemplateVariable se leen por su plantilla en cada envío a través de la clave ajena de la
      relación one-to-many, que es del generador y no se declara aquí.
  - id: REV-MAIL-SENTBY-NO-GUARD
    scope: mail.sentBy.sendAcceptedNotification
    verdict: ok
    note: >-
      La única operación de sentBy, sendAcceptedNotification, declara transiciones
      queued→sending→sent|failed, y su regla exige que la marca sending esté confirmada antes de
      entregar. Que esa guarda no sea observable en caja negra ya está aceptado en decisions.yaml
      (OBL-GUARD-UNOBSERVABLE).
  - id: REV-MAIL-TEMPLATE-ERRORS
    scope: mail
    verdict: ok
    note: >-
      Las dos preguntas se contestan en las puertas que aceptan el envío: requestNotification y
      acceptNotificationRequest declaran TEMPLATE_NOT_FOUND (422) y TEMPLATE_VARIABLE_MISSING (422).
      sendAcceptedNotification no los declara y su regla explica por qué: renderiza la versión
      congelada, que ninguna operación borra, con las variables ya validadas y congeladas al
      aceptar; y la compilación se valida al registrar (TEMPLATE_SYNTAX_INVALID).
  - id: REV-MAIL-ASYNC-OUTCOME
    scope: use-cases.operations.sendAcceptedNotification
    verdict: accepted
    note: >-
      Aceptado en parte y corregido en parte (v2.0.0). El relay caído o sin respuesta deja el envío
      en failed (regla), y NotificationSent lleva dedupeKey para correlacionar. Que failed no emita
      evento se acepta: hoy ningún consumidor reacciona a un fallo. Un envío parado en sending está
      aceptado en gaps.yaml (clase 13).
  - id: REV-MAIL-BOUNCE-CHANNEL
    scope: mail
    verdict: ok
    note: >-
      Ninguna regla depende de un fallo posterior a la aceptación del relay. La regla de
      sendAcceptedNotification lo declara como hueco explícito: el rebote llega por un canal que el
      diseño no declara y queda fuera de alcance; FL-DSP-001 lo repite. No hay supresión de
      direcciones ni conteo de quejas.

# Sin autenticación, y decidido: este servicio lo llaman el sistema que encola y el ejecutor desde la red
# interna, y la frontera de confianza la pone esa red. Es una variante para medir el RELOJ de los
# generadores: meter un proveedor de identidad no dice nada sobre lo que se mide.
authentication:
  protocol: none
access:
  default:
    level: public
    description: API interna detrás de la red del sistema de trabajos; nadie la expone fuera.

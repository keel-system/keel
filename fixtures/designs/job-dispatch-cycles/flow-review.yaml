    artifact: use-cases.operations.dispatchJobs
    evidence: >-
      El Given encola el trabajo y lo deja en running con el reloj rancio. Entre las dos cosas puede pasar
      un ciclo de dispatchJobs (cada minuto) y llevárselo de queued a running con runningSince = ahora;
      FL-RSC-002 tiene la misma ventana con putInFlight.
    proposal: >-
      No hace falta cambiar nada: stallInFlight y putInFlight fijan el estado Y el reloj, así que pisan lo
      que hubiera hecho el ciclo. Dejarlo dicho para quien escriba la prueba.
    resolution: accepted
    reason: "Aceptado: el helper del arnés escribe estado y reloj juntos, así que el resultado es el mismo pase o no el ciclo antes; en FL-RSC-002 el ciclo pondría el reloj a ahora, que es justo lo que el Given pide."

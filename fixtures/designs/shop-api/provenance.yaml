fixes:
  - id: fix-wire-contract
    legacy: "Sirve bajo /api sin versión; el cuerpo de error es el de Spring (timestamp, status, error, message, path) o vacío; devuelve cuerpos escalares o vacíos (true/false, null) y recibe cuerpos que son una lista o un número sin envoltura."
    reason: "Exigido por el método (docs/wire-contract.md y docs/dsl/api.md): prefijo /api/v1, cuerpo de error con code/details/correlationId y entradas/salidas como objetos con campos nombrados. Decidido por el humano el 2026-10-23 (Adoptar el contrato de Keel)."
    evidence: "recordings/round-0/R0-009.json; recordings/round-0/R0-029.json; recordings/round-0/R0-034.json; recordings/round-0/R0-036.json; src/main/resources/application.yml:39-40"
    noFlow:
      why: "Los flujos se escriben en operaciones del diseño y contract-map.yaml absorbe las envolturas, las rutas y los cuerpos escalares de cada lado: la diferencia de forma no se ve desde un paso."
      proof: "legacy/shop-api/contract-map.yaml (operations, wrap, page, declaredDifferences) y las grabaciones citadas"
  - id: fix-pagination-envelope
    legacy: "Pagina con page de base 1 sin tolerancia (page=0 y size=0 responden 500, page=abc 400) y devuelve el Page de Spring (content, pageable, totalPages, totalElements, number...) con tamaño por defecto 3 en productos y 10 en pedidos."
    reason: "Exigido por el método (docs/dsl/api.md): sobre canónico items/page/size/totalElements/totalPages, page de base 0 y valores fuera de rango sustituidos por el defecto. Decidido por el humano el 2026-10-23 (Adoptar la paginación de Keel); el defecto y el tope los fija api-pagination (10 y 100)."
    evidence: "recordings/round-0/R0-001.json; recordings/round-0/R0-003.json; recordings/round-0/R0-004.json; recordings/round-0/R0-005.json"
  - id: fix-register-email-409
    legacy: "Un email repetido en el alta responde 400 sin cuerpo, igual que un campo vacío."
    reason: "El índice único de users.email es una unicidad del dominio y Keel la contesta con 409 EMAIL_ALREADY_EXISTS (docs/dsl/persistence.md). Decidido por el humano el 2026-10-23 (409 EMAIL_ALREADY_EXISTS)."
    evidence: "recordings/round-0/R0-012.json"
  - id: fix-product-validation-400
    legacy: "Un producto con stock negativo o sin nombre ni precio responde 500 (Type definition error al serializar el BindingResult) en lugar de un fallo de validación."
    reason: "Las cotas required y min 0 del dominio las hace cumplir la validación de forma del generador con 400 (docs/dsl/use-cases.md). Decidido por el humano el 2026-10-23 (400 de validación), también al editar."
    evidence: "recordings/round-0/R0-059.json; recordings/round-0/R0-063.json"
  - id: fix-not-found-404
    legacy: "Un producto inexistente (GET) y una línea de carrito inexistente (PUT) responden 200 con el cuerpo vacío; una categoría, un pedido o un producto a borrar inexistentes responden 500."
    reason: "Un 500 no es un «no existe» y un 200 vacío esconde el fallo. Decidido por el humano el 2026-10-23 (404 con code en todos): PRODUCT_NOT_FOUND, CATEGORY_NOT_FOUND, ORDER_NOT_FOUND y CART_ITEM_NOT_FOUND. El borrado de un producto inexistente pasa de PRODUCT_NOT_EXIST a PRODUCT_NOT_FOUND, y CATEGORY_NOT_FOUND vale 404 también al crear y editar un producto con una categoría que no existe (misma interpretación para el mismo code)."
    evidence: "recordings/round-0/R0-007.json; recordings/round-0/R0-009.json; recordings/round-0/R0-037.json; recordings/round-0/R0-046.json; recordings/round-0/R0-064.json"
  - id: fix-conflict-status
    legacy: "Las reglas de negocio violadas responden 500: stock insuficiente en el checkout (que además rechaza comprar justo todo el stock, porque exige que quede más de 0), un pedido que no está nuevo al finalizar o cancelar, un productStatus mayor que 1 y un código de producto repetido."
    reason: "Un fallo del cliente no es un 500 y el rechazo del último ejemplar es un error de comparación (update <= 0). Decidido por el humano el 2026-10-23 (409 / 422 y comprar todo el stock): stock insuficiente, pedido no nuevo y código repetido son 409, y comprar exactamente el stock disponible es válido. El pedido no nuevo sale con el INVALID_STATE_TRANSITION del ciclo de vida de fix-status-names y el productStatus fuera de rango es un 400 de validación, no el 422 de la respuesta, porque el estado pasa a ser un enum cerrado (UP y DOWN): un valor ajeno no llega al caso de uso."
    evidence: "recordings/round-0/R0-041.json; recordings/round-0/R0-049.json; recordings/round-0/R0-058.json; recordings/round-0/R0-060.json; src/main/java/me/zhulin/shopapi/service/impl/ProductServiceImpl.java:68-69"
  - id: fix-ownership-403
    legacy: "Un cliente que pide o cancela el pedido de otro recibe 401 sin cuerpo; uno que pide o actualiza el perfil de otro recibe 400 sin cuerpo."
    reason: "401 es «no autenticado» y el 400 del perfil no dice nada de por qué. Decidido por el humano el 2026-10-23 (403 con code (ownership)): ORDER_NOT_OWNED y PROFILE_NOT_OWNED; vendedores y empleados quedan exentos del pedido y el perfil no tiene exentos."
    evidence: "recordings/round-0/R0-022.json; recordings/round-0/R0-025.json; recordings/round-0/R0-047.json; recordings/round-0/R0-053.json; src/main/java/me/zhulin/shopapi/api/OrderController.java:48-51"
  - id: fix-register-role-escalation
    legacy: "El alta pública acepta el campo role: cualquiera se da de alta como vendedor (ROLE_MANAGER) y con él crea, edita y borra productos y cancela o finaliza pedidos ajenos."
    reason: "Es una escalada de privilegios medida. Decidido por el humano el 2026-10-23 (Alta siempre como cliente): el alta no acepta ni guarda un rol; los empleados y vendedores se crean por otra vía que el servicio no tiene (seed o alta administrada) y los roles salen del proveedor de identidad."
    evidence: "recordings/round-0/R0-015.json; src/main/java/me/zhulin/shopapi/entity/User.java:42-43"
  - id: fix-password-hash-exposure
    legacy: "El alta, el perfil y la actualización del perfil devuelven en la respuesta la contraseña codificada del usuario (password: $2a$10$...)."
    reason: "Una contraseña codificada no es dato de salida de ninguna operación. Decidido por el humano el 2026-10-23 (No devolver password); con la identidad delegada el servicio ya no guarda contraseña."
    evidence: "recordings/round-0/R0-011.json; recordings/round-0/R0-021.json; recordings/round-0/R0-024.json"
  - id: fix-checkout-empty-cart
    legacy: "El checkout con el carrito vacío crea un pedido de importe 0 y sin líneas, y un checkout repetido (o dos a la vez) deja otro pedido vacío."
    reason: "Un pedido sin líneas no tiene sentido de negocio. Decidido por el humano el 2026-10-23 (Rechazar el carrito vacío): 409 CART_EMPTY sin pedido."
    evidence: "recordings/round-0/R0-040.json; recordings/round-0/R0-042.json; recordings/round-0/R0-066.json"
  - id: fix-cart-client-price
    legacy: "POST /cart guarda las líneas con el nombre, la descripción, la categoría y el precio que manda el cliente, y el checkout cobra con el precio guardado en la línea; la línea no lleva el icono del catálogo."
    reason: "El servidor no puede cobrar un precio que decide el comprador. Decidido por el humano el 2026-10-23 (Tomar los datos del catálogo): mergeCart solo usa productId y count, y un productId inexistente se rechaza (404 PRODUCT_NOT_FOUND por composición con fix-not-found-404)."
    evidence: "recordings/round-0/R0-034.json; src/main/java/me/zhulin/shopapi/service/impl/CartServiceImpl.java:51-69"
  - id: fix-cart-quantity-validation
    legacy: "Añadir al carrito una cantidad 0 o negativa responde 200 true y no guarda nada; una línea inválida de mergeCart (count 0, campos nulos) responde 200 mostrándola sin haberla guardado."
    reason: "Una respuesta que no hace lo que dice engaña al cliente. Decidido por el humano el 2026-10-23 (Solo validar la cantidad): una cantidad o una línea inválidas responden 400; el stock solo se comprueba en el checkout, como hoy."
    evidence: "recordings/round-0/R0-032.json; recordings/round-0/R0-033.json; recordings/round-0/R0-035.json"
  - id: fix-status-names
    legacy: "El estado de un pedido viaja como 0, 1 y 2 y el de un producto como 0 y 1, y el ciclo de vida del pedido es una condición en el código que responde 500 al finalizar o cancelar un pedido que no está nuevo."
    reason: "Los enums del DSL son nombres y declarar el ciclo de vida exige NEW, FINISHED y CANCELED en el cable. Decidido por el humano el 2026-10-23 (Nombres y ciclo de vida): orderStatus y productStatus viajan como NEW/FINISHED/CANCELED y UP/DOWN, y finishOrder y cancelOrder son las transiciones del lifecycle."
    evidence: "recordings/round-0/R0-049.json; recordings/round-0/R0-052.json; src/main/java/me/zhulin/shopapi/enums/OrderStatusEnum.java:7-9; src/main/java/me/zhulin/shopapi/enums/ProductStatusEnum.java:10-11"
  - id: fix-edit-keeps-create-time
    legacy: "Editar un producto reemplaza el registro entero con el cuerpo: lo que no llega se pone a null y createTime también."
    reason: "Perder la fecha de alta es un defecto. Decidido por el humano el 2026-10-23 (Conservar createTime): la edición no toca createTime; los demás campos siguen reemplazándose."
    evidence: "recordings/round-0/R0-061.json; src/main/java/me/zhulin/shopapi/service/impl/ProductServiceImpl.java:106-116"
  - id: fix-identity-oidc
    legacy: "El servicio emite sus propios JWT (HS512, secreto jwtSecret, 24 h), guarda las contraseñas con bcrypt, tiene una operación login y no deja iniciar sesión a un usuario con active false."
    reason: "El método fija la identidad en un proveedor OIDC. Decidido por el humano el 2026-10-23 (Delegar en un proveedor OIDC): desaparecen login y la contraseña de User, el alta crea el perfil del usuario ya autenticado, los roles salen del proveedor y la identidad del llamante es el claim email del token. Hay que migrar las cuentas."
    evidence: "recordings/round-0/R0-017.json; recordings/round-0/R0-023.json; src/main/java/me/zhulin/shopapi/security/JWT/JwtProvider.java:27-35"
    noFlow:
      why: "Es de arquitectura (dónde vive la credencial): la operación login deja de existir en el servicio y un paso del diseño no puede nombrarla; el rechazo de credenciales malas y de un usuario inactivo pasa al proveedor."
      proof: "La decisión del humano (questions.yaml fix-identity-oidc, 2026-10-23) y legacy/shop-api/contract-map.yaml: los actores del legacy siguen entrando por su login (/api/login) y los del servicio nuevo usan el proveedor (via idp)."
  - id: fix-void-204
    legacy: "Checkout, quitar una línea del carrito y borrar un producto responden 200 con el cuerpo vacío."
    reason: "Keel prefiere 204 para una operación sin salida y es el default de un borrado. Decidido por el humano el 2026-10-23 (204 sin cuerpo)."
    evidence: "recordings/round-0/R0-038.json; recordings/round-0/R0-039.json; recordings/round-0/R0-064.json"

  - id: fix-product-not-available
    legacy: "Añadir al carrito (o fusionar) un producto fuera de venta lo acepta y el checkout no mira el estado; el checkout de una línea cuyo producto se borró responde 500 PRODUCT_NOT_EXIST y no deja pedido; un producto sin estado (createProduct o updateProduct sin productStatus) no tiene default y desreferencia un estado nulo."
    reason: "Un producto fuera de venta o borrado no se compra. Decidido por el humano el 2026-10-23 (cierre del diseño, gaps clase 1 y clase 2): productStatus tiene default UP, y añadir, fusionar o hacer checkout de un producto DOWN o borrado responde 409 PRODUCT_NOT_AVAILABLE."
    evidence: "src/main/java/me/zhulin/shopapi/api/CartController.java:40-67; src/main/java/me/zhulin/shopapi/service/impl/ProductServiceImpl.java:64-73; legacy/shop-api/unobserved.yaml (U-CHECKOUT-PRODUCT-MISSING, U-PRODUCT-STATUS-NULL); sin grabación previa, la ejecución de FL-CRT-013 y FL-ORD-022 contra el legacy la mide"
  - id: fix-profile-partial-update
    legacy: "PUT /profile sustituye name, phone y address por lo que llega: lo que no llega pasa a null y el guardado falla por la validación, de modo que responde 400 sin cuerpo."
    reason: "Un campo omitido no es un campo vacío. Decidido por el humano el 2026-10-23 (cierre del diseño, gaps clase 2): en updateProfile un campo omitido se conserva. Con la misma decisión, un usuario autenticado sin perfil o sin carrito responde 404 PROFILE_NOT_FOUND o CART_NOT_FOUND, algo que el legacy no puede producir."
    evidence: "recordings/round-0/R0-026.json; src/main/java/me/zhulin/shopapi/service/impl/UserServiceImpl.java:61-70; src/main/java/me/zhulin/shopapi/entity/User.java:34-39; la ejecución de FL-ACC-013 contra el legacy mide el 400 de un teléfono y una dirección ausentes"
  - id: fix-cart-modify-quantity-min
    legacy: "PUT /cart/{id} acepta cualquier cantidad: sobre una línea ausente responde 200 con el cuerpo vacío con 0 y con un valor negativo (R0-037); sobre una línea presente no se sondeó (U-MODIFY-CART-ZERO-EXISTING)."
    reason: "Una cantidad menor que 1 no es una cantidad. Decidido por el humano el 2026-10-23 (cierre del diseño, gaps clase 2, modifyCartItem): quantity >= 1 en modifyCartItem, igual que en addToCart y mergeCart, y falla con 400 antes de buscar la línea; quitar una línea es removeCartItem."
    evidence: "recordings/round-0/R0-037.json; src/main/java/me/zhulin/shopapi/service/impl/ProductInOrderServiceImpl.java:22-29"
  - id: fix-update-product-no-upsert
    legacy: "PUT /seller/product/{id}/edit crea el producto si no existe y responde 200 con él."
    reason: "Dar de alta es createProduct, con su permiso product:create que solo tiene el vendedor; con el upsert un empleado con product:edit creaba productos. Decidido por el humano el 2026-10-23 (cierre del diseño, gaps clases 2, 9 y 15): updateProduct solo reemplaza y responde 404 PRODUCT_NOT_FOUND si el producto no existe."
    evidence: "recordings/round-0/R0-063.json; src/main/java/me/zhulin/shopapi/api/ProductController.java:65-76"
  - id: fix-update-product-version
    legacy: "La edición de un producto reemplaza todos sus campos sin versión: gana la última escritura y puede pisar el stock que acaba de descontar un checkout."
    reason: "Perder una venta por una edición vieja tiene coste. Decidido por el humano el 2026-10-23 (cierre del diseño, gaps clase 4, updateProduct): updateProduct lleva la version del producto y responde 409 CONCURRENT_MODIFICATION si no es la vigente (structural-3-9 ya había elegido el bloqueo optimista)."
    evidence: "src/main/java/me/zhulin/shopapi/service/impl/ProductServiceImpl.java:64-73, 106-116; recordings/round-0/R0-061.json"
  - id: fix-register-active-true
    legacy: "El alta respeta el active que manda el solicitante: un usuario dado de alta con active false queda inactivo y no inicia sesión."
    reason: "Nada en el servicio lee ni cambia active, así que dejarlo en manos del solicitante solo permite registrar cuentas inactivas sin efecto. Decidido por el humano el 2026-10-23 (cierre del diseño, gaps clase 3 y clase 9): active deja de ser input de register y se fija a true."
    evidence: "recordings/round-0/R0-016.json; src/main/java/me/zhulin/shopapi/entity/User.java:41"

  - id: fix-product-category-required
    legacy: "createProduct sin categoryType responde 500 CATEGORY_NOT_FOUND (la categoría ausente se busca como una que no existe) y updateProduct, que usa el mismo método, responde igual a una edición sin categoryType."
    reason: "Un producto no puede quedar sin categoría y un campo ausente no es una categoría que no existe. Decidido por el humano el 2026-10-23 (segunda vuelta del cierre, gaps clase 3, ProductInfo): categoryType es obligatorio al crear (400 si falta), se conserva al editar sin mandarlo y CATEGORY_NOT_FOUND solo sale si llega y no existe."
    evidence: "recordings/round-0/R0-060.json; src/main/java/me/zhulin/shopapi/service/impl/ProductServiceImpl.java:106-116; src/main/java/me/zhulin/shopapi/service/impl/CategoryServiceImpl.java:33-37"
  - id: fix-cart-line-nullable-fields
    legacy: "La línea del carrito exige descripción y categoría (@NotNull): con un producto que no tiene descripción, addToCart y mergeCart no guardan la línea y responden 200 igualmente (la excepción la traga el controlador)."
    reason: "Un producto sin descripción se puede comprar. Decidido por el humano el 2026-10-23 (segunda vuelta del cierre, gaps clase 3, ProductInOrder): la línea acepta null en descripción y categoría y los copia tal cual del producto."
    evidence: "src/main/java/me/zhulin/shopapi/entity/ProductInOrder.java:41-44 y 53-55; src/main/java/me/zhulin/shopapi/api/CartController.java:40-61; recordings/round-0/R0-035.json (campos nulos: 200 sin guardar); sin grabación con este producto, la ejecución de FL-CRT-020 la mide"
  - id: fix-product-id-length
    legacy: "El código de producto admite hasta 255 caracteres, la longitud de su columna."
    reason: "Un código largo no se puede direccionar con comodidad en la ruta. Decidido por el humano el 2026-10-23 (segunda vuelta del cierre, gaps clase 15, getProduct): productId de hasta 64 caracteres en el producto, en la línea y en todas las operaciones que lo reciben."
    evidence: "surface.yaml (product_info.product_id); recordings/round-0/R0-057.json; sin grabación con un código de más de 64, la ejecución de FL-SEL-019 la mide"
  - id: fix-create-product-guard-order
    legacy: "createProduct comprueba primero el código repetido y, si lo hay, responde 500 sin mirar la categoría."
    reason: "Orden global de las guardas decidido por el humano el 2026-10-23 (segunda vuelta del cierre, REV-USECASES-GUARD-ORDER): propiedad, existencia (404) y estado (409). Con el código repetido y la categoría inexistente a la vez sale el 404 CATEGORY_NOT_FOUND."
    evidence: "src/main/java/me/zhulin/shopapi/api/ProductController.java:50-57; recordings/round-0/R0-058.json"
  - id: fix-order-amount-max
    legacy: "El legacy no limita orderAmount (numeric(19,2)): un checkout con un carrito de cualquier importe crea el pedido."
    reason: "Un pedido por encima de 1.000.000.000 no se acepta. Decidido por el humano el 2026-10-23 (tercera vuelta del cierre, pregunta fix-order-amount-max): el checkout que supere orderAmount 1.000.000.000 responde 409 ORDER_AMOUNT_EXCEEDED, rechazado entero, sin crear pedido ni tocar el stock; se evalúa tras PRODUCT_NOT_AVAILABLE y PRODUCT_NOT_ENOUGH."
    evidence: "surface.yaml (order_main.order_amount numeric(19,2)); src/main/java/me/zhulin/shopapi/entity/OrderMain.java:74-76; sin grabación, la ejecución de FL-ORD-027 contra el legacy la mide (producto de 1.000.000 y 1001 unidades)"
  - id: fix-product-id-charset
    legacy: "El código de producto admite cualquier carácter."
    reason: "Un código con barra, porcentaje o espacios no se puede direccionar en la ruta. Decidido por el humano el 2026-10-23 (tercera vuelta del cierre, gaps clase 15, getProduct): productId solo admite [A-Za-z0-9_-], hasta 64; otro carácter da 400 al crear y en la ruta."
    evidence: "surface.yaml (product_info.product_id); sin grabación con caracteres fuera del patrón, la ejecución de FL-SEL-022 la mide"

frontier:
  - id: F-ORDER-LIST-SCOPING
    what: "Un cliente solo ve en el listado los pedidos de su email y el resto de roles ve todos (la parte declarable, el 403 de quien no tiene ningún rol conocido, está en security.access.rules.listOrders)."
    why: "La salida de una query se acota por igualdad de campos fijos o de inputs, no por el rol de quien pregunta, y scoping/ownership del DSL actúan sobre un claim o sobre un campo de la operación de escritura, no sobre un listado según rol."
    evidence: "recordings/round-0/R0-044.json; recordings/round-0/R0-045.json; src/main/java/me/zhulin/shopapi/api/OrderController.java:36-40"
  - id: F-CATEGORY-NAME-WRAPPER
    what: "GET /category/{type} envuelve la página de productos con el nombre de la categoría (category y page)."
    why: "Una salida paginada tiene siempre el sobre canónico de página: no admite un campo hermano con el nombre de la categoría."
    evidence: "recordings/round-0/R0-008.json; src/main/java/me/zhulin/shopapi/api/CategoryController.java:39-44"
  - id: F-INDEX-DIRECTIONS
    what: "El índice de pedidos ordena orderStatus ascendente y createTime descendente, como el orden de listOrders."
    why: "Los miembros de un índice son nombres de campo y el DSL no declara la dirección de cada uno; queda escrita en la description del índice, que ningún generador lee."
    evidence: "recordings/round-0/R0-045.json; src/main/java/me/zhulin/shopapi/repository/OrderRepository.java"

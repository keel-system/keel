findings:
  # ================================================================ HALLAZGOS NUEVOS (open)
  - class: 2
    unit: checkout
    what: "Un usuario sin perfil (y por tanto sin carrito) puede disparar a la vez CART_NOT_FOUND (404) y CART_EMPTY (409): las rules solo fijan que CART_EMPTY es el primer rechazo, pero no dicen si va antes o después de CART_NOT_FOUND. Dos stacks darían status distintos al mismo cliente."
    severity: gap
    state: decided
    reason: "Orden global de las guardas - propiedad, existencia y después estado y stock - y CART_NOT_FOUND primero: checkout evalúa CART_NOT_FOUND, CART_EMPTY, PRODUCT_NOT_AVAILABLE y PRODUCT_NOT_ENOUGH, en las rules y en el orden de errors (use-cases checkout; FL-CRT-014). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 2
    unit: cancelOrder
    what: "La restitución suma a productStock la cantidad de cada línea, pero ProductInfo.productStock tiene máximo 1000000: un producto con stock alto al que se devuelven unidades puede superar la cota. Ninguna guarda ni error dice qué ve quien cancela (rechazo, tope o stock por encima de la cota)."
    severity: gap
    state: decided
    reason: "El máximo de 1.000.000 acota lo que manda quien crea o edita el producto y no limita la devolución de stock de cancelOrder: el stock puede quedar por encima y no se rechaza ni se recorta (rules de cancelOrder, description de ProductInfo.productStock; FL-ORD-026). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre). Deja abierto el hallazgo nuevo sobre la copia del stock a la línea."
  - class: 2
    unit: cancelOrder
    what: "Un cliente que cancela el pedido de otro y que además no está en NEW dispara a la vez ORDER_NOT_OWNED (403) e INVALID_STATE_TRANSITION (409): no se dice qué se evalúa antes. Fija si el estado de un pedido ajeno se filtra a quien no es su dueño."
    severity: risk
    state: decided
    reason: "La propiedad se evalúa antes que la existencia y el estado: ORDER_NOT_OWNED primero en errors y en las rules de cancelOrder, así que un cliente nunca averigua el estado del pedido de otro (FL-ORD-025). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 2
    unit: mergeCart
    what: "Varias guardas pueden fallar a la vez y el orden no está fijado: CART_NOT_FOUND frente a los errores de producto, y PRODUCT_NOT_FOUND frente a PRODUCT_NOT_AVAILABLE cuando items mezcla una línea inexistente y otra fuera de venta. El cliente ve uno u otro según el stack."
    severity: risk
    state: decided
    reason: "mergeCart evalúa CART_NOT_FOUND, PRODUCT_NOT_FOUND y PRODUCT_NOT_AVAILABLE, con la existencia de todas las líneas antes que su estado: items con un producto inexistente y uno fuera de venta responde PRODUCT_NOT_FOUND sea cual sea su posición (rules y errors de mergeCart; FL-CRT-018 y FL-CRT-019). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 2
    unit: addToCart
    what: "Si el usuario no tiene carrito y el producto no existe, no se dice si responde 404 CART_NOT_FOUND o 200 con added false; tampoco el orden entre CART_NOT_FOUND y PRODUCT_NOT_AVAILABLE."
    severity: risk
    state: decided
    reason: "addToCart evalúa CART_NOT_FOUND primero, sin mirar el producto, y después el producto: inexistente responde added false y fuera de venta 409 PRODUCT_NOT_AVAILABLE (rules y errors de addToCart; FL-CRT-018). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 3
    unit: ProductInOrder
    what: "La línea exige productDescription y categoryType, pero en ProductInfo ambos son opcionales (productDescription sin required, categoryType sin required). addToCart y mergeCart copian esos datos del catálogo y no dicen qué se copia cuando el producto los tiene nulos: ¿cadena vacía, rechazo, línea con nulo pese a required?"
    severity: gap
    state: decided
    reason: "La línea acepta null en productDescription y categoryType y los copia tal cual del producto (domain ProductInOrder, rules de addToCart y mergeCart; fix-cart-line-nullable-fields; FL-CRT-020). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 3
    unit: ProductInfo
    what: "categoryType es opcional en el dominio, y updateProduct dice que los campos que no llegan quedan null, pero la misma operación (y createProduct) responde 404 CATEGORY_NOT_FOUND si categoryType no se manda. Un producto nunca puede quedar sin categoría, así que o el campo es obligatorio o la regla de 'queda null' no se aplica a él; el diseño dice las dos cosas."
    severity: gap
    state: decided
    reason: "categoryType es obligatorio al crear (400 si falta) y se conserva al editar sin mandarlo; CATEGORY_NOT_FOUND solo sale si llega y no existe (domain ProductInfo.categoryType required, rules de createProduct y updateProduct; fix-product-category-required; FL-SEL-017 y FL-SEL-018). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 3
    unit: OrderMain
    what: "checkout dice de dónde salen buyerName, buyerPhone y buyerAddress (los actuales del cliente) pero no buyerEmail, que es además el campo del que cuelga la propiedad del pedido (ownership.OrderMain.owner). Es requerido y no llega en ningún input."
    severity: risk
    state: decided
    reason: "buyerEmail del pedido es el claim email del token (callerEmail), que es también el campo del que cuelga la propiedad (rules de checkout; FL-ORD-001 comprueba buyerEmail). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 4
    unit: register
    what: "La decisión previa citaba OBL-CONCURRENCY-CODE en decisions.yaml, que ya no existe. Con optimisticLocking all, cualquier escritura de checkout, cancelOrder, finishOrder, updateProfile, addToCart, mergeCart, modifyCartItem y deleteProduct puede devolver 409 CONCURRENT_MODIFICATION, y solo updateProduct lo declara en errors; para el resto el status de la carrera lo fija únicamente la prosa de decisions.yaml 3.9."
    severity: risk
    state: decided
    reason: "CONCURRENT_MODIFICATION (409) queda declarado en errors de updateProfile, mergeCart, addToCart, modifyCartItem, removeCartItem, checkout, cancelOrder, finishOrder y deleteProduct, que se suman a updateProduct, siempre el último en el orden de las guardas. Decidido por el humano el 2026-10-23 (segunda vuelta del cierre); removeCartItem entra por el mismo criterio (borra una línea versionada), que es una lectura del arqueólogo de 'las operaciones que escriben entidades versionadas'."
  - class: 5
    unit: listProductsByCategory
    what: "listProducts dice que incluye los productos fuera de venta (DOWN), pero listProductsByCategory y getProduct no dicen si los devuelven o los filtran. Quien navega por categoría puede ver productos que no se pueden comprar o no verlos, según el stack."
    severity: risk
    state: decided
    reason: "listProductsByCategory aplica el mismo filtro de estado que listProducts, que no filtra: incluye los productos fuera de venta (rules de listProductsByCategory; FL-CAT-009, con totalElements 5 medido en R0-008). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre). getProduct ya devuelve un producto fuera de venta en FL-CAT-003."
  - class: 9
    unit: register
    what: "El email del perfil sale del claim email del token, pero el diseño no dice qué pasa si el token no lo trae o si el proveedor no lo ha verificado: ni un error declarado ni una exigencia de email verificado. Una identidad con un email sin verificar puede registrarse, o actuar sobre pedidos y perfil, como otro cliente."
    severity: gap
    state: decided
    reason: "Un token sin el claim email se rechaza con 401 y no se exige que el proveedor haya verificado el email (rules de register y cabecera de security.keel.yaml; FL-ACC-016). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 12
    unit: service
    what: "User.email no declara compare: exact en el dominio, aunque los escenarios (convenciones) dicen que el email se compara tal cual. La unicidad de EMAIL_ALREADY_EXISTS, ownership por email (getProfile, updateProfile, getOrder, cancelOrder) y el filtro de listOrders por buyerEmail dependen de si 'Bob@x.com' y 'bob@x.com' son el mismo email, y eso solo está en prosa de los escenarios."
    severity: gap
    state: decided
    reason: "User.email declara compare exact: la unicidad, la propiedad por email y el filtro por buyerEmail distinguen mayúsculas (domain User.email; FL-ACC-017). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 12
    unit: service
    what: "orderAmount (decimal) no declara máximo y es la suma de precio por cantidad de un número de líneas sin cota (precio máximo 1000000 por cantidad máxima 1000000 por línea); el desbordamiento de la columna no tiene error. Además no hay moneda declarada en ningún precio ni importe: se supone una sola, sin decirlo."
    severity: gap
    state: decided
    reason: "orderAmount lleva máximo 1.000.000.000 y una sola moneda implícita, escrita en su description (domain OrderMain.orderAmount). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre). El checkout que supere el máximo se rechaza entero con 409 ORDER_AMOUNT_EXCEEDED, sin pedido ni descuento de stock (fix-order-amount-max, tercera vuelta del cierre, 2026-10-23; FL-ORD-027)."
  - class: 14
    unit: OrderMain
    what: "El índice (buyerEmail, orderStatus, createTime) sostiene el listado del cliente, pero listOrders de empleados y vendedores (todos los pedidos, orden orderStatus asc, createTime desc, orderId asc) no tiene índice que lo sostenga, y createTime va descendente frente a orderStatus ascendente en el orden de la query sin que el índice declare direcciones."
    severity: risk
    state: decided
    reason: "persistence declara el índice (orderStatus, createTime) para el listado de empleados y vendedores y las direcciones del orden (orderStatus ascendente, createTime descendente) en la description de los dos índices de pedidos; el DSL no declara direcciones y queda como frontera F-INDEX-DIRECTIONS. Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 14
    unit: ProductInfo
    what: "ProductInfo.version es un contador propio del dominio (sube con cada escritura, también con el descuento de stock del checkout) y a la vez persistence declara optimisticLocking all, que lleva su propio control de versión. No se dice si son el mismo contador o dos distintos, ni cuál es el que provoca el 409 CONCURRENT_MODIFICATION."
    severity: risk
    state: decided
    reason: "La version del dominio es el contador del bloqueo optimista de la raíz, el mismo y no otro, y es la que provoca el 409 CONCURRENT_MODIFICATION (description de ProductInfo.version y comentario de persistence.consistency). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 14
    unit: ProductInOrder
    what: "Las líneas de un pedido se leen por su relación order (getOrder, listOrders, cancelOrder) y no hay índice sobre order; solo el único (cart, productId) sostiene las lecturas por carrito."
    severity: risk
    state: decided
    reason: "persistence declara el índice [order] en ProductInOrder (persistence.keel.yaml). Decidido por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 15
    unit: getProduct
    what: "productId ya tiene un máximo de 64 caracteres, pero sigue siendo un texto libre sin patrón que viaja en la ruta en getProduct, modifyCartItem, removeCartItem, updateProduct y deleteProduct: un código con '/', '%' o espacios no se puede direccionar y el comportamiento queda al stack."
    severity: risk
    state: decided
    reason: "productId lleva el patrón [A-Za-z0-9_-] y hasta 64 caracteres (domain ProductInfo, ProductInOrder y CartItemInput; use-cases en todas las operaciones que lo reciben): cualquier otro carácter da 400 al crear y en la ruta (fix-product-id-charset; FL-SEL-022). Decidido por el humano el 2026-10-23 (tercera vuelta del cierre)."
  - class: 16
    unit: "3.2"
    what: "El registro de 3.2 no tiene entrada de register, cancelOrder ni finishOrder, y la decisión anterior da a register por frenado por la clave natural sin que esté escrita como entrada. cancelOrder y finishOrder son PATCH que, repetidos, no devuelven lo mismo (la segunda llamada es 409 INVALID_STATE_TRANSITION), así que el reintento tras un timeout no es transparente y no consta que se preguntara."
    severity: gap
    state: accepted
    reason: "decisions.yaml structural 3.2 tiene ahora entrada para register (la unicidad del email frena el reintento: 409 EMAIL_ALREADY_EXISTS), cancelOrder y finishOrder (el estado terminal hace al comando idempotente en su efecto: el reintento no repite el stock ni el cambio y responde 409 INVALID_STATE_TRANSITION). Aceptado por el humano el 2026-10-23 (segunda vuelta del cierre)."
  - class: 16
    unit: "3.8"
    what: "El registro de 3.8 solo cubre api.pagination (tamaños de página). Las colecciones sin paginar, las líneas de getCart (sin cota de líneas por carrito más allá de una por producto) y las de cada pedido, no tienen entrada que diga que se decidió no paginarlas con la cota esperada delante."
    severity: risk
    state: accepted
    reason: "decisions.yaml structural 3.8 tiene ahora entrada para las líneas de getCart (domain Cart.products) y las de cada pedido (domain OrderMain.products), sin paginar por tamaño acotado: una línea por producto en el carrito, mergeCart con 100 líneas por llamada y el carrito vaciado en el checkout. Aceptado por el humano el 2026-10-23 (segunda vuelta del cierre)."

  - class: 3
    unit: ProductInOrder
    what: "La línea copia productStock del producto y lo acota a un máximo de 1000000, pero la devolución de stock de cancelOrder, que no está limitada por ese máximo, puede dejar el producto por encima: la siguiente copia a una línea (addToCart, mergeCart) no cabría en el campo y el diseño no dice qué ve quien añade ese producto."
    severity: gap
    state: decided
    reason: "El stock copiado en la línea (ProductInOrder.productStock) no lleva máximo de entrada, por ser dato derivado del producto: la devolución de stock de cancelOrder, que puede dejar el producto por encima de 1000000, nunca rompe addToCart ni mergeCart (domain ProductInOrder.productStock; FL-ORD-026). Decidido por el humano el 2026-10-23 (tercera vuelta del cierre)."

  # ================================================================ DECISIONES PREVIAS VIGENTES (se conservan)
  # ---------------------------------------------------------------- 1. Ciclo de vida
  - class: 1
    unit: ProductInfo
    what: "productStatus (UP/DOWN) es un campo de estado enum sin lifecycle: estado inicial, significado de DOWN para quien compra."
    severity: gap
    state: decided
    reason: "productStatus tiene default UP (domain ProductInfo.productStatus: required, default UP) y un producto DOWN o borrado no se compra: addToCart, mergeCart y checkout responden 409 PRODUCT_NOT_AVAILABLE (fix-product-not-available; FL-CRT-013, FL-ORD-022, FL-ORD-023, FL-SEL-015). Decidido por el humano el 2026-10-23 (hueco 6). Que UP y DOWN se alternan sin restricción lo recoge decisions.yaml 3.9 (REV-DOMAIN-ENUM-NO-LIFECYCLE)."
  - class: 1
    unit: OrderMain
    what: "El estado inicial (NEW) y las transiciones están completos y alcanzables; falta decidir qué operaciones quedan prohibidas en FINISHED y CANCELED."
    severity: risk
    state: decided
    reason: "Las únicas operaciones sobre un pedido son finishOrder y cancelOrder, y ambas rechazan lo que no está en NEW con INVALID_STATE_TRANSITION 409 (validation-scenarios.md FL-ORD-010, FL-ORD-011, FL-ORD-013); no hay otra operación que modifique un pedido."

  # ---------------------------------------------------------------- 2. Guardas y errores
  - class: 2
    unit: updateProfile
    what: "Usuario autenticado sin perfil y significado de omitir name, phone o address."
    severity: gap
    state: decided
    reason: "Un usuario autenticado sin perfil recibe 404 PROFILE_NOT_FOUND y un campo omitido (name, phone o address) se conserva (use-cases updateProfile; fix-profile-partial-update; FL-ACC-013 y FL-ACC-015). Decidido por el humano el 2026-10-23 (hueco 7)."
  - class: 2
    unit: mergeCart
    what: "Operaciones de carrito para un usuario sin carrito (sin register)."
    severity: gap
    state: decided
    reason: "Sin perfil no hay carrito: todas las operaciones del carrito declaran 404 CART_NOT_FOUND (use-cases getCart, mergeCart, addToCart, modifyCartItem, removeCartItem y checkout; FL-CRT-014). Decidido por el humano el 2026-10-23 (hueco 7)."
  - class: 2
    unit: addToCart
    what: "quantity sin obligatoriedad y producto existente pero fuera de venta."
    severity: gap
    state: decided
    reason: "quantity es obligatoria con mínimo 1 y máximo 1000000 (400 si falta o no cumple; fix-cart-quantity-validation y la cota del cierre, hueco 8) y un producto DOWN responde 409 PRODUCT_NOT_AVAILABLE (fix-product-not-available; FL-CRT-013). Decidido por el humano el 2026-10-23."
  - class: 2
    unit: modifyCartItem
    what: "quantity sin mínimo y significado de cantidad 0."
    severity: gap
    state: decided
    reason: "quantity exige mínimo 1 y falla con 400 antes de buscar la línea; la cantidad 0 no borra la línea, porque quitarla es removeCartItem (fix-cart-modify-quantity-min; FL-CRT-016 y FL-CRT-017). Decidido por el humano el 2026-10-23 (hueco 8)."
  - class: 2
    unit: checkout
    what: "Línea de un producto borrado o DOWN."
    severity: gap
    state: decided
    reason: "Una línea de un producto borrado o DOWN rechaza el checkout entero con 409 PRODUCT_NOT_AVAILABLE, que se evalúa después de CART_EMPTY y antes del stock (use-cases checkout; fix-product-not-available; FL-ORD-022 y FL-ORD-023). Decidido por el humano el 2026-10-23 (hueco 6)."
  - class: 2
    unit: createProduct
    what: "Orden de evaluación de PRODUCT_ID_ALREADY_EXISTS (409) y CATEGORY_NOT_FOUND (404)."
    severity: risk
    state: decided
    reason: "Cuando el productId repetido y la categoría inexistente fallan a la vez sale el 404 CATEGORY_NOT_FOUND: la existencia va antes que el conflicto (use-cases createProduct, rules y orden de errors; fix-create-product-guard-order; FL-SEL-020). Antes aceptado sin fijar (hueco 12); decidido por el humano el 2026-10-23 en la segunda vuelta del cierre, que fija el orden de todas las guardas."
  - class: 2
    unit: updateProduct
    what: "Orden de evaluación de varias guardas a la vez y upsert."
    severity: risk
    state: decided
    reason: "Orden fijado: ID_NOT_MATCHED, PRODUCT_NOT_FOUND, CATEGORY_NOT_FOUND y CONCURRENT_MODIFICATION el último (use-cases updateProduct, rules y orden de errors; FL-SEL-021); la parte del upsert quedó decidida con fix-update-product-no-upsert (200 al reemplazar, 404 si no existe, nunca crea). Antes aceptado sin fijar (hueco 12); decidido por el humano el 2026-10-23 en la segunda vuelta del cierre, que fija el orden de todas las guardas."
  - class: 2
    unit: cancelOrder
    what: "El error de transición inválida no está declarado en errors, pero lo fija INVALID_STATE_TRANSITION 409 en los escenarios."
    severity: risk
    state: decided
    reason: "validation-scenarios.md FL-ORD-013 y FL-ORD-014 fijan status 409 y code INVALID_STATE_TRANSITION; es el error derivado del lifecycle de OrderMain."
  - class: 2
    unit: finishOrder
    what: "El error de transición inválida no está declarado en errors, pero lo fija INVALID_STATE_TRANSITION 409 en los escenarios."
    severity: risk
    state: decided
    reason: "validation-scenarios.md FL-ORD-010 y FL-ORD-011 fijan status 409 y code INVALID_STATE_TRANSITION."
  - class: 2
    unit: removeCartItem
    what: "Quitar una línea inexistente no falla."
    severity: risk
    state: decided
    reason: "use-cases removeCartItem rules: con carrito, si no tiene esa línea no hace nada y responde igual (el legacy responde igual, R0-038; fix-not-found-404 no alcanza al borrado); sin carrito responde 404 CART_NOT_FOUND, que se evalúa primero (orden global de las guardas, segunda vuelta del cierre, 2026-10-23); FL-CRT-011 y FL-CRT-014 lo cubren. La referencia anterior a CHK-USECASES-COMMAND-NO-ERRORS en decisions.yaml ya no aplica: la operación declara CART_NOT_FOUND."

  # ---------------------------------------------------------------- 3. Determinación del estado
  - class: 3
    unit: User
    what: "active aceptado en el input de register sin decir quién lo pone a true."
    severity: gap
    state: decided
    reason: "active deja de ser input de register y se fija a true: el campo tiene default true, ninguna operación lo cambia ni lo lee, y el cliente no puede registrarse inactivo (fix-register-active-true; FL-ACC-014). Decidido por el humano el 2026-10-23 (hueco 10)."
  - class: 3
    unit: ProductInOrder
    what: "count y productStock requeridos, y si el precio de una línea existente se refresca al sumar."
    severity: gap
    state: decided
    reason: "count y productStock son obligatorios en la línea (siempre se copian al crearla: count de quantity o de count, mínimo 1, y productStock del catálogo; una línea con campos nulos es un 400 por fix-cart-quantity-validation). Al sumar a una línea existente solo cambia count y el resto de sus datos, el precio incluido, se conserva, que es lo que hace el legacy (CartServiceImpl.java:55-60). Decidido el 2026-10-23 con los huecos 8 y 11; la conservación de los datos de la línea es lectura del legacy sin sonda: confirmar."
  - class: 3
    unit: OrderMain
    what: "Cuándo se recalcula updateTime."
    severity: risk
    state: accepted
    reason: "updateTime lo mueve la infraestructura en cada escritura del pedido, como el legacy (@UpdateTimestamp, OrderMain.java:66); los escenarios solo comprueban su forma y nunca su valor. Aceptado por el humano el 2026-10-23 (hueco 12, updateTime; decisions.yaml)."
  - class: 3
    unit: ProductInfo
    what: "Campos opcionales que no llegan en updateProduct y recálculo de updateTime."
    severity: risk
    state: accepted
    reason: "Un campo opcional que no llega al editar queda null (updateProduct rules, FL-SEL-006), productStatus vuelve a UP (default), y createTime y categoryType se conservan (fix-product-category-required); updateTime lo mueve la infraestructura en cada escritura, como el legacy (@UpdateTimestamp, ProductInfo.java:58). Aceptado por el humano el 2026-10-23 (hueco 12, updateTime; decisions.yaml)."
  - class: 3
    unit: Cart
    what: "cartId es computed como el id del usuario propietario, y el momento está dicho (se crea en register)."
    severity: risk
    state: decided
    reason: "domain.keel.yaml Cart.cartId (computed: id del usuario propietario) y use-cases register (rules: Crea el carrito del usuario en la misma operación)."
  - class: 3
    unit: ProductCategory
    what: "Cómo se asignan categoryId y categoryType sin operación que cree categorías."
    severity: risk
    state: decided
    reason: "Las categorías se cargan por seed (ninguna operación las crea) y categoryType es obligatorio y único, así que un tipo nulo no es válido; la autoría de esa carga es el valor centinela del generador porque no nace de una petición (domain ProductCategory; decisions.yaml). Decidido por el humano el 2026-10-23 (hueco 12, categorías por seed)."

  # ---------------------------------------------------------------- 4. Concurrencia y unicidad
  - class: 4
    unit: register
    what: "Dos registros simultáneos con el mismo email."
    severity: risk
    state: decided
    reason: "domain User.email unique + persistence naturalKey [email] + EMAIL_ALREADY_EXISTS 409 (la carrera se resuelve por unicidad)."
  - class: 4
    unit: addToCart
    what: "Leer-sumar-escribir de la línea sin unicidad (carrito, productId)."
    severity: gap
    state: decided
    reason: "Unicidad (carrito, productId) en persistence (índice único en ProductInOrder) y ProductInOrder.cart como relación: dos peticiones simultáneas no crean dos líneas del mismo producto (persistence.keel.yaml; hueco 8). El bloqueo optimista all sigue cubriendo la escritura concurrente con 409 CONCURRENT_MODIFICATION. Decidido por el humano el 2026-10-23."

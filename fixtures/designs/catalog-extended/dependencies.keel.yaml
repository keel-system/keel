# Las dos mitades de la capa, en un solo diseño: se LEE un dato ajeno (needs, con
# sus dos estrategias) y se PIDE trabajo (activations, por los dos canales).
dependencies:
  pricing:
    description: Servicio de precios, dueño del precio vigente y del precio de proveedor.
    contract:
      version: 2.1.0
    needs:
      currentPrice:
        description: Precio vigente que acompaña a la ficha pública del producto.
        strategy: on-demand
        usedBy: [getProductBySlug]
        # El dato no solo se usa para decidir: acompaña a la ficha, que es lo que dice
        # su propia descripción. Sin declararlo, se pedía al proveedor y se descartaba
        # tras el anticorrupción — y ningún escenario podía afirmar que llegara.
        exposedAs: currentPrice
        fetchedFrom:
          client: pricing
          call: getPrice
        # Qué ve el cliente si pricing no contesta. Antes esto solo existía como prosa en
        # el `fallback` de la llamada («devolver el último precio conocido en caché»), que
        # es la capa técnica: decía el mecanismo y no la política, así que la ventana de
        # validez la acababa eligiendo quien construía — y en una corrida real salió sin
        # ninguna. Aquí la decisión está entera: hasta cuándo vale, y qué pasa después.
        onUnavailable:
          action: lastKnown
          maxAgeSeconds: 900
          error: PRICE_UNAVAILABLE

      supplierPrice:
        description: Precio de proveedor, que se consulta en cada listado y no puede pagar una llamada por elemento.
        strategy: replicated
        usedBy: [listProducts, getProductsByIds]
        # La razón por la que este es `replicated` y no `on-demand` se ve justo aquí:
        # se expone en un LISTADO, así que on-demand sería una llamada al proveedor por
        # elemento. `keel validate` lo avisa. Antes de poder declarar esto, el reader
        # quedaba generado y sin ningún llamador: nadie consumía el dato.
        exposedAs: supplierPrice
        fetchedFrom:
          client: pricing
          call: getPrice
        replica:
          entity: SupplierPrice
          keyField: sku
          fedBy: [SupplierPriceChanged]
          freshness: Vale con que refleje el precio del último cambio publicado; unos segundos de retraso son aceptables.
          onMiss:
            action: fetch

  legacy-erp:
    description: ERP heredado, dueño del coste de aprovisionamiento de cada producto.
    needs:
      productCost:
        description: Coste de aprovisionamiento que acompaña a la ficha del producto.
        strategy: on-demand
        usedBy: [getProductBySlug]
        exposedAs: productCost
        fetchedFrom:
          client: legacy-erp
          call: getCost
        # Aquí la respuesta honesta no es servir un coste viejo: es servir la ficha sin él.
        onUnavailable:
          action: degrade
          degradedTo: La ficha se devuelve sin coste de aprovisionamiento; el consumidor no puede pintar el margen y lo sabe porque el campo llega nulo.

  search-index:
    description: Servicio de búsqueda, que mantiene el índice del catálogo.
    activations:
      indexProduct:
        description: Reindexado del producto tras darlo de alta o cambiarlo.
        triggeredBy: [createProduct, updateProduct]
        via:
          client: search-index
          call: reindexProduct
        effect: El producto queda buscable con sus datos nuevos.
        awaits: acknowledgement
        onFailure:
          action: ignore

  partner-catalog:
    description: Socio externo que replica nuestras fichas en su escaparate.
    contract:
      version: 3.0.0
    activations:
      notifyPartner:
        description: Anuncio al socio del cambio de la ficha.
        triggeredBy: [updateProduct]
        via:
          client: partner-catalog
          call: notifyCatalogChange
        effect: El socio recibe la ficha nueva y la refleja en su escaparate.
        awaits: acknowledgement
        # `ignore`: que el socio no conteste no puede bloquear la edición de nuestra
        # propia ficha. Con esta política el cuerpo del fallback lo escribe `build`
        # entero —resultado neutro y aviso—, así que el escenario del token caído
        # mide el camino generado, no lo que improvise el agente.
        onFailure:
          action: ignore

  notifications:
    description: Servicio de avisos, que comunica a los suscriptores las novedades del catálogo.
    activations:
      announceNewProduct:
        description: Aviso a los suscriptores de la categoría.
        triggeredBy: [createProduct]
        via:
          publishes: ProductCreated
        effect: Sale un aviso hacia los suscriptores de la categoría del producto.
        awaits: nothing

  compliance:
    description: Registro regulatorio de retiradas, obligatorio antes de retirar un producto.
    contract:
      version: 1.0.0
    activations:
      recordWithdrawal:
        description: Alta de la retirada en el registro regulatorio.
        # El barrido aparece aquí porque su desenlace es volver a inscribir: es lo
        # que lo enlaza con lo que reconcilia (la otra forma sería una transición de
        # salida). Sin ese enlace sería un `schedule` que no toca nada de esto.
        triggeredBy: [retireProduct, reconcileWithdrawals]
        via:
          client: compliance
          call: recordWithdrawal
        effect: La retirada queda inscrita en el registro regulatorio con su motivo.
        awaits: outcome
        # Sin esto, la compensación de abajo solo existe si el registro se acuerda de
        # publicar su rechazo. Cuando no lo hace, nada lo detecta.
        reconciledBy: reconcileWithdrawals
        # Cuánto silencio del registro se tolera antes de volver a insistir. Es la
        # decisión que el barrido no puede tomar solo: depende de cuánto tarda ESTE
        # proveedor en contestar. En local el generador la baja por entorno.
        unansweredAfterSeconds: 3600
        # Y desde cuándo se cuenta ese silencio: el estado dice que la retirada espera
        # inscripción, no cuánto lleva esperando. La estampa `retireProduct`.
        awaitingSince: recordWithdrawalAwaitingSince
        onFailure:
          action: fail
          error: COMPLIANCE_UNAVAILABLE

      # La ACTIVACIÓN DE VUELTA: es lo que convierte la compensación de abajo en algo
      # más que un cambio de estado propio. Deshacer un trabajo encargado tiene dos
      # mitades —devolver el estado propio y decírselo a quien lo hizo— y solo la
      # primera se ve desde nuestra base: si falta la segunda, el registro conserva la
      # inscripción de una retirada que ya no existe y todo parece consistente.
      cancelWithdrawal:
        description: Anulación de la inscripción de una retirada que el registro rechazó.
        triggeredBy: [reactivateWithdrawnProduct]
        via:
          client: compliance
          call: cancelWithdrawal
        effect: La inscripción de la retirada queda anulada en el registro regulatorio.
        awaits: outcome
        # `ignore` y no `fail`: la reactivación del producto no puede quedar bloqueada
        # porque el registro no responda. El fallback deja la inscripción huérfana y lo
        # registra, que es lo que el diseño declara en el cliente.
        onFailure:
          action: ignore
    compensations:
      - onEvent: WithdrawalRejected
        undoes: recordWithdrawal
        description: El registro rechazó la retirada a posteriori; el producto vuelve a estado activo y la inscripción se anula.

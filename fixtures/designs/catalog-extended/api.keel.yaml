style: rest
basePath: /api
endpoints:
  createProduct:
    method: POST
    path: /products
    successStatus: 201
  getProductBySlug:
    method: GET
    path: /public/products/{slug}
  updateProduct:
    method: PATCH
    path: /products/{id}
  listProducts:
    method: GET
    path: /products
  listDraftProducts:
    method: GET
    path: /products/drafts
  getProductsByIds:
    method: POST
    path: /products/batch
  retireProduct:
    method: POST
    path: /products/{id}/retire
  addProductImage:
    method: POST
    path: /products/{productId}/images
    successStatus: 201
  removeProductImage:
    method: DELETE
    path: /products/{productId}/images/{imageId}
    successStatus: 204
pagination:
  style: offset
  defaultSize: 20
  maxSize: 100
# Escritura condicional (DSL 2.25): la ficha de un producto la editan personas desde un formulario,
# así que guardar con una lectura vieja no puede pisar el cambio de otro. getProductBySlug da el
# ETag; updateProduct lo exige en If-Match y devuelve el nuevo. retireProduct es una transición, no
# una edición: no compara.
concurrency:
  conditionalWrites: required
  operations: [updateProduct]

reviewedBy: keel-design-review
reviewedAt: 2.0.0
findings:
  - id: REV-DOMAIN-PROMISED-STATE
    scope: domain.entities
    verdict: ok
    note: >-
      Cada promesa de la prosa tiene campo o transición detrás: «retirada» es Template.status
      retired (lifecycle active → retired); «publishedAt no cambia al retirarse» es un campo propio;
      «sus envíos se cortan» es Application.active; lo «congelado» de Notification son
      templateVersion, renderedSubject, variables y copyRecipients; «desde cuándo está en sending»
      es sendingSince. Las dos vías a Notification.accepted (requestNotification y
      acceptNotificationRequest) rellenan igual dedupeKey y lo congelado; copyRecipients solo lo
      trae la vía HTTP porque el payload del evento no lo tiene. Nota al margen: la description de
      sendingSince cita «aceptado en gaps.yaml, clase 13», y en este directorio no hay gaps.yaml.
  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations.registerTemplate
    verdict: accepted
    note: >-
      Aceptado: el PUT versiona a propósito, porque registrar nunca pisa una versión que alguien
      pudo publicar. Un reintento tras un timeout deja un borrador más, que nadie usa hasta
      publicarlo por id.
  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases
    verdict: ok
    note: >-
      Los órdenes de evaluación de validation-scenarios.md son implementables: registerTemplate
      resuelve la aplicación del token antes de compilar y de mirar variables; publishTemplate y
      getTemplate acotan por la aplicación, que sale del token; requestNotification comprueba la
      clave de idempotencia antes que la aplicación, lo que solo exige que el almacén se acote por
      el principal del token (disponible antes de resolver Application), no por applicationKey;
      acceptNotificationRequest resuelve el emisor por metadata.source antes de buscar plantilla.
  - id: REV-SEC-M2M-AUDIENCE
    scope: security.authentication.serviceAuth
    verdict: fixed
    note: >-
      Corregido en v2.0.0: serviceAuth.validateAudience true, y FL-NTF-001 lo afirma con un token de
      otra audiencia (403).
  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: ok
    note: >-
      NotificationSent va por notificationEvents y NotificationRequested por notificationRequests,
      los dos declarados en channels con nombre lógico y sin tecnología.
  - id: REV-MSG-IDENTITY-FROM-FIELD
    scope: messaging.subscriptions.NotificationRequested.identity
    verdict: accepted
    note: >-
      La identidad sale de metadata.source y el trabajo que se pide es irreversible (un correo real
      desde el remitente verificado de otra aplicación), que es justo el caso en que la checklist
      pide cuestionarlo. Releída la asunción de trustedPublishers: todos los emisores son sistemas
      propios, el broker autentica quién publica, el riesgo residual (un emisor propio con bug o
      comprometido suplanta a otro) está nombrado, la salida location: header se evaluó y se
      descartó con motivo, y el disparador de revisión está escrito. Ningún serviceClient declarado
      está fuera del perímetro. Se acepta por la prosa del propio diseño. Ojo: el descarte de header
      se argumenta con la topología SNS → SQS (SenderId de cuenta), que es elección de stack y no de
      diseño; con otro broker esa razón habría que volver a comprobarla.
  - id: REV-MSG-DEDUPE-WINDOW
    scope: messaging.subscriptions.NotificationRequested
    verdict: ok
    note: >-
      acceptNotificationRequest no declara transitions ni idempotency y su efecto sí es acumulable
      (cada ejecución crea una Notification, es decir, un correo). Pero hay freno de dominio más
      allá de la tabla de procesados: dedupeKey es metadata.eventId y la naturalKey de Notification
      es [applicationKey, dedupeKey], así que una reentrega pasada la retención choca con la
      unicidad y no produce un segundo correo. Lo único que queda sin decidir es el desenlace de ese
      choque: sin code declarado, reintenta y acaba en la cola de descarte como falsa alarma. No
      duplica.
  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities
    verdict: ok
    note: >-
      Las búsquedas que hace el diseño tienen índice: Application por credentialKeys (índice propio)
      y por key (naturalKey); la plantilla activa por aplicación, clave e idioma (índice parcial
      when status active); la siguiente versión (prefijo de la naturalKey de Template); el barrido
      por [status, requestedAt]; la deduplicación por [applicationKey, dedupeKey]; getTemplate y
      getNotification van por id. Sobran más bien que faltan: [recipient, requestedAt] y
      [copyRecipients] no los usa ninguna operación, y el comentario de este último habla de
      @CollectionTable y tabla hija, que en el modelo documental es un índice multikey.
  - id: REV-MAIL-SENTBY-NO-GUARD
    scope: use-cases.operations.sendAcceptedNotification.rules
    verdict: fixed
    note: >-
      Corregido en v2.0.0: la regla decía «de accepted a sending», una arista que el lifecycle no
      tiene. Ahora dice queued → sending, que es la guarda que declaran las transitions.
  - id: REV-MAIL-TEMPLATE-ERRORS
    scope: use-cases
    verdict: ok
    note: >-
      Donde puede faltar la plantilla o una variable requerida, el error está declarado:
      requestNotification y acceptNotificationRequest con TEMPLATE_NOT_FOUND y
      TEMPLATE_VARIABLE_MISSING. sendAcceptedNotification no los declara y lo justifica: renderiza
      con la versión congelada, que ninguna operación borra, y con las variables congeladas y ya
      validadas al aceptar; la plantilla compila porque registerTemplate la rechaza si no
      (TEMPLATE_SYNTAX_INVALID).
  - id: REV-MAIL-ASYNC-OUTCOME
    scope: use-cases.operations.sendAcceptedNotification
    verdict: accepted
    note: >-
      Aceptado en parte y corregido en parte (v2.0.0). El relay caído o sin respuesta deja el envío
      en failed (regla), y NotificationSent lleva dedupeKey para correlacionar. Que failed no emita
      evento se acepta: hoy ningún consumidor reacciona a un fallo.
  - id: REV-MAIL-BOUNCE-CHANNEL
    scope: use-cases.operations.sendAcceptedNotification
    verdict: ok
    note: >-
      Ninguna regla depende de un fallo posterior a la aceptación del relay: la regla de
      sendAcceptedNotification y las notas de FL-DSP-001 dejan el rebote diferido explícitamente
      fuera de alcance, y no hay supresión de direcciones ni conteo de quejas.

findings:
  - flow: FL-AST-002
    step: "Then 4"
    kind: other
    artifact: use-cases.getAsset.cache.invalidatedBy
    evidence: >-
      El Then dice que «la respuesta cacheada de antes de publicar no sobrevive, porque AssetPublished la invalida». Pero el flujo no cachea nada antes del When: el ejecutor resetea el estado antes de cada flujo, el Given solo deja <a1> en draft y programa el escáner, y aunque reprodujera el GET de FL-AST-001 Then 4, ahí rendering.getThumbnail no está programado, la ficha sale degradada y getAsset no la cachea (rule «La ficha degradada ... no se cachea»). El Then se cumple con la caché vacía, así que la invalidación por AssetPublished no la mide ningún flujo.
    proposal: >-
      Escenario: añadir al Given un GET /api/v1/assets/{a1} con rendering.getThumbnail respondiendo 200 (ficha completa, que sí se cachea) antes del When, como se hizo en FL-AST-003-D. Si no, quitar la frase de la caché del Then 4.
    resolution: scenario
    sealAfter: c92cb8d9c1538fef43d29753b8147e27c34bd6bd2fd0bb74b5fc9ec6a9fbd1b1
  - flow: FL-QUA-001
    step: "Then 2"
    kind: other
    artifact: use-cases.getAsset.cache.invalidatedBy
    evidence: >-
      El Then afirma quarantined «aunque la ficha estaba cacheada: AssetQuarantined la invalida». El Given (<a1> publicado por el camino de FL-AST-002 y purgeThumbnail en 204) no hace ningún GET de la ficha con rendering.getThumbnail programado, y tras el reset por flujo no hay nada en la caché; una ficha degradada tampoco se cachea. El Then se cumple sin caché y no prueba la invalidación por AssetQuarantined, que es justo lo que se añadió al diseño en la pasada anterior.
    proposal: >-
      Escenario: añadir al Given un GET /api/v1/assets/{a1} con rendering.getThumbnail respondiendo 200 antes de que llegue MalwareDetected.
    resolution: scenario
    sealAfter: 3638c80648311d146cbcaae1558d1a8fd03f3ffca2675efd2d588ac0cd402308
  - flow: FL-THD-001
    step: "Then 1"
    kind: other
    artifact: use-cases.getAsset.cache.invalidatedBy
    evidence: >-
      El Then dice «La ficha está cacheada y el contador viaja en ella, así que este Then también afirma que la caché la invalida un evento consumido (ThumbnailDelivered)». El Given solo dice que <a1> existe con thumbnailDeliveryCount 0; nada en el flujo pide la ficha antes del evento, y sin rendering.getThumbnail programado la ficha saldría degradada y no se cachearía. Con la caché vacía el contador sale 1 igual, y el escenario no mide la invalidación que dice medir.
    proposal: >-
      Escenario: añadir al Given un GET /api/v1/assets/{a1} con rendering.getThumbnail respondiendo 200 que devuelva thumbnailDeliveryCount = 0, y después el evento.
    resolution: scenario
    sealAfter: 9093bda9bc46d500f03f9c58755f395ea00a898d07f0b9f9714b06ef9d0333b4
  - flow: FL-QUA-001-C
    step: "Then 2"
    kind: count
    artifact: messaging.publishing.events.AssetQuarantined
    evidence: >-
      El Then dice «Y sale exactamente un AssetQuarantined» sin acotarlo a <a4>. FL-QUA-001-C está dentro del flujo FL-QUA-001, que encadena estado: FL-QUA-001 ya publicó un AssetQuarantined para <a1> (su Then 4), así que en el canal hay dos. El DELETE sí está acotado a {a4}; el evento no, y FL-OBX-001 ya advierte que un «exactamente una vez» sin acotar mide otra cosa.
    proposal: >-
      Escenario: «sale exactamente un AssetQuarantined con assetId = <a4>».
    resolution: scenario
    sealAfter: e58340c8afa1789b3b73a80abc8224ec9196a9becb8d591d5c4b0bcf01a53c22
  - flow: FL-REC-001
    step: "Then 4"
    kind: other
    artifact: dependencies.security-scanner.activations.scanAsset.unansweredAfterSeconds
    evidence: >-
      El Then afirma que «los archivos de los demás flujos no se ven afectados: solo se barre lo que lleva sin revalidar más que el umbral». El ejecutor resetea el estado antes de cada flujo, así que en FL-REC-001 no existe ningún archivo de otro flujo, y el único publicado es <a5>, el envejecido. La aserción no tiene sujeto, y un barrido que revalidara todo published sin mirar lastScannedAt pasaría el flujo entero: el umbral no lo discrimina ningún Then.
    proposal: >-
      Escenario: añadir al Given un segundo archivo publicado en el mismo flujo cuyo lastScannedAt NO se envejece, y afirmar que el proveedor no recibió ningún POST /scans con su assetId tras el tick y que su lastScannedAt no cambia.
    resolution: scenario
    sealAfter: 31bfd9ad68a3553944ae29f9958933d5785db5749549b28c9cd6f807d3b076e7
  - flow: FL-CLU-002
    step: "Then 3"
    kind: other
    artifact: dependencies.security-scanner.activations.scanAsset.unansweredAfterSeconds
    evidence: >-
      El Then dice «Ningún archivo ajeno al escenario se ve afectado». Tras el reset por flujo, los únicos archivos de FL-CLU-002 son los cinco del Given, todos envejecidos: no hay ningún archivo ajeno sobre el que afirmar nada, y la aserción se cumple siempre.
    proposal: >-
      Escenario: o quitar el Then 3, o añadir al Given un sexto archivo publicado sin envejecer y afirmar que no recibe POST /scans (con lo que el «exactamente cinco» del Then 1 también lo discrimina).
    resolution: scenario
    sealAfter: eabb25010ec2885d88bec3c0eb15172ecd75bdbb8fccca35531a57b3c751eeeb

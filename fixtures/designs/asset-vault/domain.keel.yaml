types:
  AssetStatus:
    description: Estados por los que pasa un archivo custodiado.
    values: [draft, published, quarantined]

entities:
  Owner:
    description: Propietario de los archivos; raíz de su propio agregado.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      code:
        type: string
        required: true
        description: Código estable del propietario dentro de la organización.
      displayName:
        type: string
        required: true

  Asset:
    description: Archivo custodiado, raíz del agregado.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      slug:
        type: string
        required: true
        description: Nombre estable del archivo dentro de su propietario.
      title:
        type: string
        required: true
      # Campo `unique` suelto, distinto de la clave natural: dos propietarios no pueden
      # custodiar el mismo binario. Es lo que genera un uk_ de campo (uk_assets_checksum)
      # además del uk_ de clave natural.
      checksum:
        type: string
        required: true
        unique: true
        description: Huella del binario, que identifica el contenido con independencia del nombre.
      contentType:
        type: string
        required: true
      sizeBytes:
        type: long
        required: true
      storageKey:
        type: string
        required: true
        description: Clave del binario dentro del bucket.
      # Array plano: en el modelo documental se indexa como multikey, sin tabla de
      # elementos ni join.
      labels:
        type: string
        list: true
        description: Etiquetas libres del archivo.
      status:
        type: AssetStatus
        required: true
        default: draft
      # CONTADOR, y por eso `noteThumbnailDelivery` no es idempotente por naturaleza:
      # aplicarla dos veces se ve en la API. Es lo que hace observable la única guarda
      # que le queda a una suscripción sin transición de lifecycle — el registro de
      # procesados—, y la clave de esa suscripción no es la envoltura Keel sino una
      # cabecera nativa del renderizador.
      thumbnailDeliveryCount:
        type: int
        required: true
        default: 0
        description: Cuántas entregas de su miniatura ha comunicado el renderizador.
      lastDeliveredAt:
        type: timestamp
        description: Cuándo sirvió el renderizador la miniatura por última vez.
      # La marca de espera del barrido. No se llama `scanAssetAwaitingSince` porque aquí
      # no se espera un desenlace: el escáner responde en el acto y lo que envejece es la
      # CREENCIA de que el archivo está limpio. Es el equivalente temporal que busca la
      # nota del stub de reconciliación, y tiene que ser propio: `updatedAt` rejuvenece
      # con cualquier otra escritura y dejaría el archivo invisible al barrido para
      # siempre.
      lastScannedAt:
        type: timestamp
        description: Cuándo dio el escáner su último veredicto sobre el binario.
    relations:
      owner:
        entity: Owner
        cardinality: many-to-one
        required: true
        description: Propietario del archivo; otro agregado, solo su id.
      revisions:
        entity: AssetRevision
        cardinality: one-to-many
        description: Revisiones del archivo, anidadas dentro de su documento.
    lifecycle:
      field: status
      transitions:
        draft: [published, quarantined]
        published: [quarantined]
        quarantined: []

  AssetRevision:
    description: Revisión del archivo, entidad interna de su agregado.
    fields:
      id:
        type: uuid
        id: true
        generated: true
      revisionNumber:
        type: int
        required: true
        description: Orden de la revisión dentro del archivo; contrato observable.
      note:
        type: text
    relations:
      asset:
        entity: Asset
        cardinality: many-to-one
        required: true
        description: Archivo al que pertenece la revisión.

aggregates:
  Vault:
    root: Asset
    entities: [AssetRevision]

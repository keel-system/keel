style: rest
basePath: /api
auto: true
endpoints:
  activateProduct:
    method: POST
    path: /products/{id}/activate
    successStatus: 204
  retireProduct:
    method: POST
    path: /products/{id}/retire
    successStatus: 204
  importProducts:
    method: POST
    path: /products/batch
  importCatalog:
    method: POST
    path: /products/imports
pagination:
  style: offset
  defaultSize: 20
  maxSize: 100

findings:
  - flow: FL-PRD-008-E
    step: "When"
    kind: unobservable
    artifact: use-cases.operations.importProducts.idempotency
    evidence: >-
      Que las dos peticiones caigan en la misma ventana no se puede forzar desde fuera: si la primera termina antes de
      que llegue la segunda, la segunda es una repetición secuencial y recibe el mismo 207, que el Then también admite.
      En ese caso el escenario pasa sin haber ejercido el 409 de la clave en curso.
    proposal: >-
      Aceptarlo, como FL-PRD-003: la disyunción es cerrada y el conteo por la API (un solo RAC-0001 y un solo
      RAC-0002) es lo que falla si nada arbitra la ventana. El 409 en curso lo mide la red de cada generador (BK-3).
    resolution: accepted
    reason: "Aceptado: el conteo discrimina, y el caso que el escenario no puede forzar está medido en BK-3 en los cuatro."
  - flow: FL-PRD-009-F
    step: "When"
    kind: unobservable
    artifact: use-cases.operations.importCatalog.idempotency
    evidence: >-
      Lo mismo en el trabajo: una segunda petición que llega tarde encuentra el trabajo creado y recibe el mismo 202. El
      Then admite el 409 de la clave en curso para la que cae en la ventana del alta, que el contrato no fija
      (wire-contract.md § Lotes asíncronos solo dice que la repetición responde el mismo 202).
    proposal: >-
      Aceptarlo: lo que el escenario afirma sin disyunción es que hay un solo trabajo (la misma Location si las dos son
      202) y un solo RAC-0003.
    resolution: accepted
    reason: "Aceptado: un solo trabajo y un solo producto es lo que importa al cliente, gane quien gane la ventana."
  - flow: FL-PRD-009-D
    step: "When"
    kind: unreachable-given
    artifact: security.roles
    evidence: >-
      El When usa el token de «otro usuario con el rol catalog-editor». El diseño declara un rol y ninguna identidad de
      negocio concreta; que haya dos usuarios distintos con el mismo rol es una convención del proveedor de prueba, no
      del diseño.
    proposal: >-
      Aceptarlo apoyándose en el realm de prueba de los cuatro generadores, que siembra dos usuarios por rol
      (catalog-editor y catalog-editor-2) y uno sin ninguno (no-role, el de FL-PRD-010-B).
    resolution: accepted
    reason: "Aceptado: es exactamente para lo que el realm siembra el segundo usuario de cada rol (secondUserOf de gen/identity-realm.js)."
  - flow: FL-PRD-009
    step: "Then 2"
    kind: other
    artifact: use-cases.operations.importCatalog.batch
    evidence: >-
      El trabajo lo procesa el cronómetro del servicio cuando vence su temporizador, no la petición, así que el Then
      depende de cuánto tarda el sondeador en recogerlo; el diseño no fija ese tiempo (es del generador:
      timer.max-sleep-ms y batch.chunk-size).
    proposal: >-
      Acotar la espera en el documento y no en el diseño: la convención «Trabajos asíncronos» sondea cada medio
      segundo durante como mucho 60 segundos, el doble del sueño máximo del sondeador por defecto.
    resolution: accepted
    reason: "Aceptado: la convención ya lo fija; si una corrida necesita más de 60 s para tres elementos, es un hueco del generador."

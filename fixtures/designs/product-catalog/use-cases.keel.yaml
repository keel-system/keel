operations:
  createProduct:
    description: Da de alta un producto en estado draft.
    kind: command
    input:
      entity: Product
    output:
      entity: Product
      # Token de sincronización con el proveedor: sensible, nunca sale del servicio.
      exclude: [apiToken]
    rules:
      - Verificar que el sku no existe antes de crear.
    errors:
      - code: SKU_ALREADY_EXISTS
        when: Ya existe un producto con ese sku.
        http: 409
    idempotency:
      keySource: client-key
      ttlSeconds: 86400
  getProduct:
    description: Recupera un producto por su identificador.
    kind: query
    input:
      fields:
        id:
          type: uuid
          required: true
    output:
      entity: Product
      # Token de sincronización con el proveedor: sensible, nunca sale del servicio.
      exclude: [apiToken]
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404
  listProducts:
    description: Lista los productos del catálogo paginados.
    kind: query
    input: "void"
    output:
      entity: Product
      # Token de sincronización con el proveedor: sensible, nunca sale del servicio.
      exclude: [apiToken]
      paginated: true
  activateProduct:
    description: Publica un producto en borrador; solo con un precio mayor que cero.
    kind: command
    input:
      fields:
        id:
          type: uuid
          required: true
    output: "void"
    transitions:
      - entity: Product
        from: [draft]
        to: active
    preconditions:
      - El producto existe y está en draft.
    rules:
      - El precio del producto es mayor que cero (el invariante de un producto active).
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404
      - code: PRODUCT_NOT_DRAFT
        when: El producto no está en draft.
        http: 409
      - code: PRODUCT_PRICE_NOT_POSITIVE
        when: El precio del producto es cero.
        http: 422
  retireProduct:
    description: Retira un producto del catálogo de forma definitiva.
    kind: command
    input:
      fields:
        id:
          type: uuid
          required: true
    output: "void"
    transitions:
      - entity: Product
        from: [draft, active]
        to: retired
    preconditions:
      - El producto existe y no está ya retired.
    errors:
      - code: PRODUCT_NOT_FOUND
        when: No existe un producto con ese id.
        http: 404
      - code: PRODUCT_ALREADY_RETIRED
        when: El producto ya está retired.
        http: 409
